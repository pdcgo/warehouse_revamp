services:
  postgres:
    image: postgres:17-alpine
    container_name: warehouse_revamp_postgres
    restart: unless-stopped
    environment:
      # Development only — plain credentials on purpose. These match what
      # `go run ./tools/san migrate` assumes for "Database Local", so a fresh checkout
      # migrates with no configuration.
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      # 5433 on the host, not 5432: another project on this machine already runs a Postgres
      # on 5432, and this system must not share its database.
      - "5433:5432"
    volumes:
      - ./development_data/postgres:/var/lib/postgresql/data
    healthcheck:
      # Without this, anything depending on postgres races the "database system is ready"
      # log line — the server accepts connections briefly before it is actually usable.
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache for backend/pkgs/san_caches. Run the cache conformance tests against it with:
  #   REDIS_ADDR=localhost:6380 go test ./pkgs/san_caches/...
  redis:
    image: redis:7-alpine
    container_name: warehouse_revamp_redis
    restart: unless-stopped
    ports:
      # 6380, not 6379 — same reason as postgres on 5433: another project may already hold
      # the default port, and we must not share its keyspace.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local Pub/Sub for backend/pkgs/event_source — the dev server publishes to it
  # (dev-runs-the-emulator), and without it placing an order waits about a minute. Behind a
  # profile so a bare `docker compose up` skips the large image; `san dev run` and `san dev setup`
  # turn the profile on and make its topics. By hand:
  #   docker compose --profile pubsub up -d
  #   go run ./tools/san pubsub ensure --project warehouse-dev --emulator
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: warehouse_revamp_pubsub
    profiles: ["pubsub"]
    restart: unless-stopped
    command: >
      gcloud beta emulators pubsub start
      --project=warehouse-revamp-local
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    # The emulator PUSHES events to the API on the host (san dev run: :8080, the e2e: :8081). Docker Desktop
    # resolves host.docker.internal by itself; on Linux (CI) this line is what makes the name exist.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # `up --wait` (san dev run) waits on this. Without it "running" means the JVM has started,
      # not that the emulator answers — and the topics are made in the very next step.
      test: ["CMD", "curl", "-sf", "http://localhost:8085/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The e2e RUNNER, for `san test` on another PC (backlog #154, docs/tools/san.md#test-on-another-pc): Go, Node and Playwright's
  # browsers in one image (docker/e2e-runner/Dockerfile). Behind its OWN profile, so `docker compose up` here never
  # starts or builds it. san starts it on the other PC (a Linux box with Docker) with:
  #   docker compose --profile e2e-remote run --rm e2e-runner bash /san-run/inner.sh
  # and these, all set by san's job there (the defaults let it run from a checkout by hand):
  #   SAN_E2E_REPO   the checkout mounted at /work          SAN_E2E_CACHE  Go / npm / home folders kept between runs
  #   SAN_E2E_UID/GID who it runs as (the files it writes stay that user's)
  #   SAN_E2E_RUNNER_TAG, SAN_E2E_PLAYWRIGHT_VERSION, SAN_E2E_GO_VERSION  the image, from the commit's pins
  # network_mode host: the e2e reaches postgres :5433, redis :6380 and pubsub :8085 at localhost as it does here, and
  # the API binds 0.0.0.0 (SAN_E2E_BIND_HOST, E2E_API_ADDR) so the emulator's container can push to it — Linux's
  # host-gateway does not reach a loopback-bound port. ipc host: Chromium's shared memory. headless: false mounts the
  # desktop's X socket (below) and its cookie (by san, per run), so the browsers show on that PC's own screen.
  e2e-runner:
    profiles: ["e2e-remote"]
    build:
      context: ./docker/e2e-runner
      args:
        PLAYWRIGHT_VERSION: ${SAN_E2E_PLAYWRIGHT_VERSION:-1.61.1}
        GO_VERSION: ${SAN_E2E_GO_VERSION:-1.25.8}
    image: warehouse-revamp-e2e-runner:${SAN_E2E_RUNNER_TAG:-latest}
    network_mode: host
    ipc: host
    user: "${SAN_E2E_UID:-1000}:${SAN_E2E_GID:-1000}"
    working_dir: /work
    environment:
      SAN_E2E_IN_RUNNER: "1"
      SAN_E2E_BIND_HOST: 0.0.0.0
      E2E_API_ADDR: 0.0.0.0:8081
      HOME: /cache/home
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/gomod
      GOPATH: /cache/gopath
      npm_config_cache: /cache/npm
    volumes:
      - ${SAN_E2E_REPO:-.}:/work
      - ${SAN_E2E_CACHE:-./development_data/e2e-runner-cache}:/cache
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/localtime:/etc/localtime:ro
