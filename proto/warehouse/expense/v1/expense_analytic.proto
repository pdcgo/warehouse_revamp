syntax = "proto3";

package warehouse.expense.v1;

import "buf/validate/validate.proto";
import "warehouse/analytic_base/v1/analytic.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/expense/v1;expensev1";

// THE EXPENSE METRICS on the Analytic composer (docs/business/analytic/rpc_provide_decision.md —
// expense-has-ads-and-expenses, expense-figures-are-read-from-its-own-records, an-expense-correction-counts-on-the-day-it-is-made,
// stock-loss-stays-out-of-analytic-expenses, the-expense-metrics-follow-the-decisions-already-made,
// an-expense-correction-counts-for-who-made-it, the-expense-prototype-is-accepted). Read from
// `expense_metric_daily_reports`, which ExpenseCreate and ExpenseAdjust write in the expense's own transaction — never from
// events, which a STOCK_LOSS and an expense made before *Paid from* never publish.
//
// THE DAY AND THE PERSON. An expense counts on the day it BELONGS to (`occurred_at`), for the person who typed it. A
// correction — and a cancel, which is a correction of the whole net — counts on the Jakarta day it is MADE, for the
// person who MADE it, so a past day never changes. The Expenses page, `/statement` and the paying account keep every row
// on its expense's day (an-expense-posts-on-its-own-day): a period here can differ from the same period there by the
// corrections made later — accepted.
//
// SELLER OR WAREHOUSE. An expense is one team's. A selling team's sits under Seller (GROUP_TYPE_TEAM, the TEAM filter), a
// warehouse team's under Warehouse (GROUP_TYPE_WAREHOUSE) — the-warehouse-is-its-own-group; the root team's under
// neither.
service ExpenseAnalyticService {
  // The keys of one group, ranked by one field of `metrics/ads` or `metrics/expenses`, a page at a time — whether another
  // page follows, never a total (a-page-says-whether-another-follows); the key breaks every tie (the-key-breaks-every-tie).
  rpc MetricSearch(MetricSearchRequest) returns (MetricSearchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The figures of given keys — a key with nothing reads 0. The filters scope the numbers, never the keys
  // (the-fill-step-scopes-its-numbers-by-the-filters). One answer per asked metric (one-call-answers-every-asked-metric).
  rpc MetricData(MetricDataRequest) returns (MetricDataResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ADS EXPENSE — the typed ADS expenses, net of their corrections, each on its own day (the owner's tree: *Ads Expense —
// filter: team, shop, user, date range — fields: amount*). Only an ads expense names a shop
// (an-expense-names-a-shop-only-for-ads), so only this metric filters and groups by one. Settlement's ads fee is not in it
// (settlement-ads-and-accounts-are-independent).
//
// Who reads: every member of a team its own team's, CS included (every-member-reads-every-metric-of-their-team); the root
// team every team's.
message AdsExpenseMetric {
  option (warehouse.analytic_base.v1.metric) = {
    metric_id: "metrics/ads"
    supported_filters: [
      FILTER_TYPE_DATE_RANGE,
      FILTER_TYPE_SHOP,
      FILTER_TYPE_TEAM,
      FILTER_TYPE_USER
    ]
    required_filters: [FILTER_TYPE_DATE_RANGE]
    supported_group_by: [
      GROUP_TYPE_SUMMARY,
      GROUP_TYPE_SHOP,
      GROUP_TYPE_TEAM,
      GROUP_TYPE_WAREHOUSE,
      GROUP_TYPE_USER,
      GROUP_TYPE_DAILY,
      GROUP_TYPE_WEEKLY,
      GROUP_TYPE_MONTHLY,
      GROUP_TYPE_YEARLY
    ]
  };

  // Ads spend, rupiah — exact, never rounded (the-backend-never-rounds-money). Negative on a day whose corrections took
  // back more than was spent.
  double amount = 1 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
}

// Keyed by shop, seller team, warehouse team or user id.
message AdsExpenseMetricByID {
  map<uint64, AdsExpenseMetric> items = 1;
}

// Keyed by a period's first Jakarta day, `YYYY-MM-DD` (a-day-is-a-jakarta-date-string).
message AdsExpenseMetricByDay {
  map<string, AdsExpenseMetric> items = 1;
}

// EXPENSES — every expense a person TYPES, one field per kind and their total: Ads, Payroll, Operational, Other. The
// STOCK_LOSS expense is not in it (stock-loss-stays-out-of-analytic-expenses) — a loss is read as Lost stock and as Team
// Balance. A transfer's shipping is not in it either: it is a paying-account row, never an Expenses-screen record
// (a-transfers-shipping-posts-as-an-expense). No shop: only an ads expense names one.
//
// Who reads: as Ads expense.
message ExpensesMetric {
  option (warehouse.analytic_base.v1.metric) = {
    metric_id: "metrics/expenses"
    supported_filters: [
      FILTER_TYPE_DATE_RANGE,
      FILTER_TYPE_TEAM,
      FILTER_TYPE_USER
    ]
    required_filters: [FILTER_TYPE_DATE_RANGE]
    supported_group_by: [
      GROUP_TYPE_SUMMARY,
      GROUP_TYPE_TEAM,
      GROUP_TYPE_WAREHOUSE,
      GROUP_TYPE_USER,
      GROUP_TYPE_DAILY,
      GROUP_TYPE_WEEKLY,
      GROUP_TYPE_MONTHLY,
      GROUP_TYPE_YEARLY
    ]
  };

  // EXPENSE_KIND_ADS, rupiah — equal to Ads expense's `amount` over the same scope.
  double ads = 1 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
  // EXPENSE_KIND_PAYROLL.
  double payroll = 2 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
  // EXPENSE_KIND_OPERATIONAL — rent, electricity, internet, subscriptions.
  double operational = 3 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
  // EXPENSE_KIND_OTHER.
  double other = 4 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
  // The four kinds' sum — every typed expense, never a stock loss.
  double total = 5 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
}

// Keyed by seller team, warehouse team or user id.
message ExpensesMetricByID {
  map<uint64, ExpensesMetric> items = 1;
}

// Keyed by a period's first Jakarta day, `YYYY-MM-DD`.
message ExpensesMetricByDay {
  map<string, ExpensesMetric> items = 1;
}

message MetricSearchRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The reader: every member of the scoped team reads its own team's (every-member-reads-every-metric-of-their-team) —
  // CS too, unlike ExpenseList; the root team every team's.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // A group with keys — never SUMMARY, which has none.
  warehouse.analytic_base.v1.GroupType group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0, 1]
  }];
  repeated warehouse.analytic_base.v1.FilterItem filters = 3 [(buf.validate.field).repeated.max_items = 6];
  warehouse.analytic_base.v1.MetricSort sort = 4 [(buf.validate.field).required = true];
  warehouse.analytic_base.v1.PaginationFilter page = 5 [(buf.validate.field).required = true];
}

message MetricSearchResponse {
  warehouse.analytic_base.v1.MetricKeys keys = 1;
  bool has_next = 2;
}

message MetricDataRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  warehouse.analytic_base.v1.GroupType group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated warehouse.analytic_base.v1.FilterItem filters = 3 [(buf.validate.field).repeated.max_items = 6];
  // The keys to read — none under SUMMARY.
  warehouse.analytic_base.v1.MetricKeys keys = 4;
  // `metrics/ads`, `metrics/expenses` or both — one answer each, in the asked order.
  repeated string metric_ids = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
    unique: true
  }];
  // THE HEADLINE EQUALS THE ROWS (the-expense-prototype-is-accepted). SUMMARY only: the group the table's rows are read
  // by. Under an id group the headline counts only the rows that group has a key for — by Seller (TEAM) only sellers'
  // expenses, a warehouse team's being no Seller row; by Warehouse only warehouses'; by Created by only expenses a known
  // person made. Under a time group, or unset, it counts every expense the reader can see. A group the asked metrics
  // cannot be read by, or this field under any group_by but SUMMARY, is InvalidArgument.
  warehouse.analytic_base.v1.GroupType rows_group = 6 [(buf.validate.field).enum.defined_only = true];
}

message MetricData {
  oneof m {
    AdsExpenseMetricByID ads_by_id = 1;
    AdsExpenseMetricByDay ads_by_day = 2;
    AdsExpenseMetric ads_summary = 3;
    ExpensesMetricByID expenses_by_id = 4;
    ExpensesMetricByDay expenses_by_day = 5;
    ExpensesMetric expenses_summary = 6;
  }
}

message MetricDataResponse {
  repeated MetricData metric_datas = 1;
  // The read's own time: the report is written in the expense's own transaction, so nothing lags.
  int64 as_of_unix = 2;
}
