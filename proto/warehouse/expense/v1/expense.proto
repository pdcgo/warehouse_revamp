syntax = "proto3";

package warehouse.expense.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/expense/v1;expensev1";

// ExpenseService owns `expense_records` (#161) — the money the business spent that NO ORDER caused.
//
// That is the whole reason it was never part of revenue_service (since removed). A revenue row was written BY THE SYSTEM
// from an order (#153); an expense row is TYPED BY A PERSON about a period. Everything below follows from
// that one difference: the form has to be quick, the mistake has to be fixable, and the row has to say
// who entered it.
//
// Deliberately NOT here:
//   - Per-order costs. COGS and shipping are frozen onto the order (#74); marketplace and payment fees
//     per order belong beside the revenue row so settlement (#76) can compare them to a real payout.
//     Putting them here would split one order's money across two services.
//   - A ledger. No balances, no double entry — the same call revenue made (revenue §2.4). An expense row
//     records that money went out, not an account movement.
service ExpenseService {
  // Record money that went out (#168).
  rpc ExpenseCreate(ExpenseCreateRequest) returns (ExpenseCreateResponse);
  // A team's expenses for a PERIOD, with per-kind totals (#168).
  rpc ExpenseList(ExpenseListRequest) returns (ExpenseListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The same costs, summed PER DAY — the expense half of the daily statement.
  rpc ExpenseDaily(ExpenseDailyRequest) returns (ExpenseDailyResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // An expense is TYPED BY A PERSON, so it is mistypeable — and therefore correctable (#169). It is corrected by a
  // NEW ROW, never by an edit (every-correction-is-a-signed-adjustment): ExpenseUpdate and ExpenseVoid are gone.
  rpc ExpenseAdjust(ExpenseAdjustRequest) returns (ExpenseAdjustResponse);
}

// What KIND of spending. A proto enum rather than a team-managed category table (owner, §2.3): every
// team's numbers then mean the same thing, so "ads spend across all teams last month" has an answer.
// Two teams naming the same expense "Iklan" and "Marketing" is how cross-team reporting stops working on
// the day it is first needed.
//
// Adding a kind is a proto change — rare, deliberate, and visible in review. APPEND ONLY, like every
// enum here.
enum ExpenseKind {
  EXPENSE_KIND_UNSPECIFIED = 0;

  // Marketplace ads budget. The ONE kind that names a shop, and it must (an-expense-names-a-shop-only-for-ads). Posted to
  // the paying account as `ads_expense` (ads-expense-joins-the-types).
  EXPENSE_KIND_ADS = 1;

  // Wages paid to people.
  EXPENSE_KIND_PAYROLL = 2;

  // Rent, electricity, internet, subscriptions (owner, §2.1: this is what "payment" meant).
  //
  // Named OPERATIONAL rather than PAYMENT or BILL, and both rejections are worth keeping: "payment"
  // reads as a payment FEE or a payment METHOD to anyone who was not in that conversation, and a
  // "bill" is a document you receive — which a subscription charged automatically is not. All three
  // kinds now answer the same question, what kind of SPENDING.
  EXPENSE_KIND_OPERATIONAL = 3;

  // Everything else, so nothing is unrecordable while the set above is still small.
  EXPENSE_KIND_OTHER = 4;

  // STOCK WRITTEN OFF — units a warehouse recorded as damaged or lost, valued at the batch's frozen
  // unit cost. Posted by inventory_service, never typed by a person (#211).
  //
  // It was filed as OPERATIONAL until now, and that was the bug: shrinkage sat in the same bucket as
  // rent and electricity, so "how much did we break this month" had no answer — which is precisely
  // the question a warehouse's own P&L is made of. Rent is a decision somebody made. Broken stock is
  // a thing that happened to the goods. Reading them as one number hides the only one you can act on.
  //
  // ⚠ Rows written BEFORE this kind existed stay OPERATIONAL. They are only identifiable by their
  // free-text note, so a backfill would be a guess that could move a real rent row (owner, 2026-08-14).
  // History is therefore mixed and the split is honest from here forward.
  //
  // ⚠ It does NOT yet distinguish BROKEN from LOST. `stock_batches` carries one `damaged_qty` and
  // `MovementKind` has one `ADJUST`, so the DAMAGED/LOST distinction exists in the StockAdjust request
  // and is discarded on write — see #227. When that lands this becomes two kinds, or gains a
  // sub-reason. One combined figure now, split later, is additive rather than a rework (owner).
  EXPENSE_KIND_STOCK_LOSS = 5;
}

// One expense. Money is whole rupiah as int64, like every other money field in this system.
message ExpenseRecord {
  uint64 id = 1;

  // WHOSE expense — the authorization scope, exactly as on a revenue row.
  //
  // ONE team per row (owner, 2026-07-21). A warehouse IS a team, so a warehouse's payroll is an expense on
  // that warehouse's team_id — and it is never recharged onward to the selling teams it fulfils for.
  // A recharge would have been a second team on this row, which is why it was asked before the
  // migration was written rather than after.
  uint64 team_id = 2;

  // The shop the ads ran for — an ADS expense names one, every other kind names none
  // (an-expense-names-a-shop-only-for-ads, which reverses the earlier "optional on every kind"). 0 = no shop. A row
  // made before that rule keeps whatever shop it carries; an adjustment copies its expense's.
  uint64 shop_id = 3;

  // On an adjustment, the expense's kind, copied — so a kind's total and the daily split take the correction where the
  // mistake is.
  ExpenseKind kind = 4;

  // Whole rupiah. On an EXPENSE always positive: the kind already says the money is going out, so a signed amount would
  // let a negative expense silently become revenue. On an ADJUSTMENT signed and never 0 — the correction itself, not a
  // new total; the expense and its adjustments never sum below 0.
  int64 amount = 5;

  // The date the expense BELONGS TO, as chosen by the person — not the moment the row was inserted.
  // Payroll is paid on the 5th for the month before, and filing it under the 5th would put it in the
  // wrong month for every report that matters. RFC3339 date (YYYY-MM-DD). On an adjustment, the expense's day, copied
  // and never typed (an-adjustment-counts-on-the-day-it-fixes): the month that holds the mistake becomes correct.
  string occurred_at = 6;

  // What it actually was. The enum says which bucket; this says which electricity bill.
  string note = 7;

  // WHO TYPED IT. A person entered this number by hand and it moves profit directly, so the row says
  // whose number it is. Opaque user_service id. On an adjustment, who made the correction — and created_at_unix when.
  uint64 created_by = 8;

  // `voided` is gone: nothing marks a row voided, because a row never changes (every-correction-is-a-signed-adjustment).
  reserved 9;
  reserved "voided";

  int64 created_at_unix = 10;

  // 0 on an EXPENSE. On an ADJUSTMENT, the expense it corrects — always an expense, never another adjustment: a mistaken
  // adjustment is fixed by a second one on the same expense.
  uint64 adjusts_expense_id = 11;

  // On an EXPENSE, what it counts for after every adjustment of it: its amount plus theirs. 0 on an adjustment.
  int64 net_amount = 12;

  // WHICH ACCOUNT PAID — a financial_account_service id, one of the team's operational accounts
  // (an-expense-must-name-the-account-that-paid). 0 on an expense made before *Paid from* existed: nothing posts back
  // for the past. On an ADJUSTMENT, the expense's account, copied and never typed — a correction posts where the
  // original did (a-correction-follows-the-expenses-account), so an old expense's corrections name none either.
  // The account's NAME is the screen's own read (FinancialAccountByIds), as on a restock.
  uint64 finance_account_id = 13;
}

message ExpenseCreateRequest {
  // Write: a MANAGER's action on both sides, unlike revenue where customer service writes and
  // managers read. These numbers move profit directly, so the people already trusted to manage a team
  // are the ones who move them (owner, 2026-07-21) — no new finance role.
  //
  // SELLING_CS is deliberately absent: a person taking orders has no reason to see or move
  // the payroll number.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  ExpenseKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Whole rupiah, POSITIVE. Recording an expense of nothing is not an expense.
  int64 amount = 3 [(buf.validate.field).int64.gt = 0];

  // The date the expense BELONGS TO (YYYY-MM-DD), chosen by the person.
  string occurred_at = 4 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];

  // REQUIRED on ADS, refused on every other kind (an-expense-names-a-shop-only-for-ads): only an ads expense names the
  // shop it ran for. InvalidArgument either way — "an ads expense names its shop" / "only an ads expense names a shop".
  // Checked by the handler, since the rule spans two fields.
  uint64 shop_id = 5;

  string note = 6 [(buf.validate.field).string.max_len = 500];

  // REQUIRED — every expense a person types names the account that paid it, one of the team's ACTIVE OPERATIONAL
  // accounts (an-expense-must-name-the-account-that-paid); the same rule and name as a restock's `finance_account_id`.
  // Another team's account, an archived one, or one not marked operational is FailedPrecondition, naming it. The
  // expense is published after its commit and financial_account_service posts it out of this account — `ads_expense`
  // for ADS, `expense` for the rest.
  // STOCK_LOSS is outside the rule: inventory posts it by an internal call (no validation interceptor), it moves no
  // cash, and it is stored with no account and never published.
  uint64 finance_account_id = 7 [(buf.validate.field).uint64.gt = 0];
}

message ExpenseCreateResponse {
  ExpenseRecord expense = 1;
}

// ── The guideline list shape for expenses (guidelines/service-guideline.md) ───────────────────────

// ExpenseListDataType selects which slices the response carries per expense.
enum ExpenseListDataType {
  EXPENSE_LIST_DATA_TYPE_UNSPECIFIED = 0;
  // GENERAL: the shared id+name slice (name = the row's note).
  EXPENSE_LIST_DATA_TYPE_GENERAL = 1;
  // EXPENSE: the full expense row the list renders.
  EXPENSE_LIST_DATA_TYPE_EXPENSE = 2;
}

// ExpenseRowSort is the sort selection paired with the EXPENSE (row) slice.
enum ExpenseRowSort {
  EXPENSE_ROW_SORT_UNSPECIFIED = 0;
  // By the date the cost BELONGS TO (the legacy default, DESC).
  EXPENSE_ROW_SORT_OCCURRED_AT = 1;
  EXPENSE_ROW_SORT_AMOUNT = 2;
  EXPENSE_ROW_SORT_CREATED_AT = 3;
}

// ExpenseListFilter carries the NON-scope filters (the scoped team_id stays top-level on the request).
message ExpenseListFilter {
  // THE PERIOD, inclusive, as YYYY-MM-DD. Both empty = every expense ever. Server-side: the list is
  // paginated, so a client-side date filter would narrow the loaded page only and leave the totals
  // beside it unfiltered — a confidently-wrong headline figure.
  string from = 1 [(buf.validate.field).string.max_len = 10];
  string to = 2 [(buf.validate.field).string.max_len = 10];
  // One kind, or UNSPECIFIED for all of them.
  ExpenseKind kind = 3 [(buf.validate.field).enum.defined_only = true];
  // One shop, or 0 for all of them.
  uint64 shop_id = 4;
}

message ExpenseListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    warehouse.common.v1.GeneralSort general = 2;
    ExpenseRowSort expense = 3;
  }
}

message ExpenseListRequest {
  // Read: the same managers. Money out is not customer service's business.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (warehouse.role_base.v1.use_scope) = true,
    (buf.validate.field).uint64.gt = 0
  ];

  ExpenseListFilter filter = 2;
  ExpenseListFilterSort sort = 3;
  repeated ExpenseListDataType data_request = 4;

  // Grows with every expense ever recorded, so it pages (HARD RULE 9).
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

// What the filtered period cost, by kind and in total.
message ExpenseTotals {
  // The sum over EVERY row the filter matched, not the page — the same split RevenueTotals uses
  // (#78). A page total is a different number wearing the same label.
  int64 total = 1;

  // Per kind, so the summary cards need no second call. A kind with no expenses in the period is simply
  // absent rather than reported as 0 — absent and zero read the same on a card, and building the
  // absent ones would mean this message knowing the enum's members.
  map<int32, int64> by_kind = 2;
}

// ExpenseRowItem is the EXPENSE slice — the fields the expense list renders (mirrors ExpenseRecord).
message ExpenseRowItem {
  uint64 id = 1;
  uint64 team_id = 2;
  uint64 shop_id = 3;
  ExpenseKind kind = 4;
  int64 amount = 5;
  string occurred_at = 6;
  string note = 7;
  uint64 created_by = 8;
  reserved 9;
  reserved "voided";
  int64 created_at_unix = 10;
  // As on ExpenseRecord: 0 on an expense, the corrected expense on an adjustment.
  uint64 adjusts_expense_id = 11;
  // As on ExpenseRecord: an expense's amount after every adjustment of it; 0 on an adjustment.
  int64 net_amount = 12;
  // As on ExpenseRecord: the account that paid; 0 on an expense made before Paid from; an adjustment carries its
  // expense's.
  uint64 finance_account_id = 13;
}

message ExpenseRowMapItem {
  map<uint64, ExpenseRowItem> map_data = 1;
}

message ExpenseListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    ExpenseRowMapItem expense = 2;
  }
}

message ExpenseListResponse {
  repeated ExpenseListResponseItem items = 1;
  // The expense ids in sorted (page) order.
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
  // The period's totals (whole filtered set, not the page) — an additive aggregate the UI needs.
  ExpenseTotals totals = 4;
}

// ── The DAILY STATEMENT's expense half ────────────────────────────────────────────────────────────
//
// The mirror of RevenueDaily, and deliberately the same shape: the statement screen puts the two
// series side by side and subtracts them, so a difference in how they page, bound or bucket would land
// on the reader as an unexplainable gap in one column.
//
// ⚠ NOT PAGINATED for the same reason (HARD RULE 9): the response size is `to − from`, which the
// caller states and the server CAPS at 366 days. Both bounds are required here, unlike ExpenseList
// where they are optional and a page carries the risk instead.
//
// ⚠ SPARSE: a day nobody spent anything on is ABSENT, not a zero row. The client owns the date spine
// because it must build one to merge these days with revenue's.
//
// The one place it is NOT a mirror is bucketing, and that difference is the point of the field it uses.
// A cost is filed under `occurred_at` — the day the person said it BELONGS to — while revenue is filed
// under the moment its order was placed. Payroll paid on the 5th for last month lands in last month
// here, which is the whole reason `occurred_at` exists as a separate column from `created_at`.
message ExpenseDailyFilter {
  // THE PERIOD, inclusive at both ends, as YYYY-MM-DD. REQUIRED on both sides — see the cap above.
  string from = 1 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  string to = 2 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  // One kind, or UNSPECIFIED for all of them — the same "any kind" convention ExpenseList uses (#170).
  ExpenseKind kind = 3 [(buf.validate.field).enum.defined_only = true];
  // One shop, or 0 for all of them.
  uint64 shop_id = 4;
}

message ExpenseDailyRequest {
  // Read: the managers ExpenseList admits — money out is not customer service's business — PLUS the
  // WAREHOUSE roles, which ExpenseList does not carry.
  //
  // ⚠ THE DIFFERENCE IS DELIBERATE AND LOAD-BEARING. A warehouse's daily statement subtracts its own
  // expenses from the fees it earned (owner, 2026-08-14), and a warehouse's expenses include every
  // batch it has written off as damaged or lost (#211) — which is the largest number a warehouse
  // manager actually controls. Without these two roles a WAREHOUSE_OWNER gets PermissionDenied on
  // exactly half of their own statement, and the screen would report their fees as pure profit.
  //
  // ExpenseList keeps the narrower set only because no warehouse screen calls it yet. When a warehouse
  // expense list exists it takes these roles too — the policies should differ because of what is built,
  // never because one was forgotten.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (warehouse.role_base.v1.use_scope) = true,
    (buf.validate.field).uint64.gt = 0
  ];

  ExpenseDailyFilter filter = 2 [(buf.validate.field).required = true];
}

// One day's spending.
message ExpenseDayItem {
  // The day this row sums, as YYYY-MM-DD — from `occurred_at`, the day the money BELONGS to.
  //
  // No timezone caveat here, unlike RevenueDayItem: `occurred_at` is a DATE column, chosen by a person.
  // There is no instant to convert and therefore no zone to get wrong.
  string date = 1;

  // How many rows the day's number is made of — its expenses AND the adjustments that correct them, each counting on
  // the corrected expense's day.
  uint64 entries = 2;

  // The day's spending, whole rupiah.
  int64 total = 3;

  // Split by kind, so a day that jumped can be read without opening the list. A kind with nothing that
  // day is ABSENT rather than 0 — the same choice ExpenseTotals makes, and for the same reason: absent
  // and zero read identically, and building the empty ones would mean this message knowing the enum's
  // members.
  map<int32, int64> by_kind = 4;
}

message ExpenseDailyResponse {
  // ASCENDING by date, and SPARSE — see the note on ExpenseDailyFilter.
  repeated ExpenseDayItem days = 1;

  // The same totals ExpenseList reports, over the same period and the same filters. Sent rather than
  // summed in the browser, so the statement's footer and the expense list's headline are one number.
  ExpenseTotals totals = 2;
}

// ExpenseAdjust corrects an expense with a NEW ROW — the one way to correct one
// (every-correction-is-a-signed-adjustment). An expense never changes after it is saved
// (an-expense-is-never-edited), so a mistake and its fix are both on the list, each saying who wrote it and when.
//
// The adjustment copies the expense's team, shop, kind and DAY — never typed — so it counts in the month that holds the
// mistake (an-adjustment-counts-on-the-day-it-fixes). The screen's Batalkan is this call with `amount` = −(what the
// expense still counts for).
//
// ⚠ A MISSING ROW, or another team's, is NotFound: a person clicked a button, and the honest answer is that it is not
// there. Correcting an ADJUSTMENT, or a correction that would sum the expense below 0, is FailedPrecondition.
message ExpenseAdjustRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (warehouse.role_base.v1.use_scope) = true,
    (buf.validate.field).uint64.gt = 0
  ];
  // The EXPENSE corrected — never an adjustment.
  uint64 expense_id = 2 [(buf.validate.field).uint64.gt = 0];

  // The correction, signed, whole rupiah — not the new total. Never 0: a correction of nothing is not one.
  int64 amount = 3 [(buf.validate.field).int64 = {
    not_in: [0]
  }];

  // Why — what was wrong with the expense.
  string note = 4 [(buf.validate.field).string.max_len = 500];
}

message ExpenseAdjustResponse {
  // The new row.
  ExpenseRecord adjustment = 1;
  // The expense it corrects, its net_amount after this adjustment.
  ExpenseRecord expense = 2;
}
