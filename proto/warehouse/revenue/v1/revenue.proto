syntax = "proto3";

package warehouse.revenue.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/revenue/v1;revenuev1";

// RevenueService owns `order_revenues` (#75) — one row per order, holding what we EXPECTED to make on
// it, frozen when the order was placed.
//
// It is a stored record rather than a calculation, and that is the owner's call (2026-07-20) against a
// genuinely cheaper option: #74 already froze `total`, `cogs` and `shipping_cost` onto the order, so a
// screen could compute the margin with no service at all. What the record buys is a HOME FOR #76 —
// settlement compares what we expected against what the payout actually was, and "actual" has nowhere
// to live without a row beside it.
//
// The cost is a second copy of numbers the order already holds. Two things keep it honest: it is
// written ONCE, at order time, from figures that are themselves frozen — so there is no ongoing sync to
// get wrong — and when the two disagree, the ORDER is the truth for what was charged while this row is
// the truth for what was EXPECTED. They answer different questions, which is why both exist rather
// than one being a cache of the other.
service RevenueService {
  // Record what an order is expected to make. Written when the order is placed.
  rpc RevenueRecord(RevenueRecordRequest) returns (RevenueRecordResponse);
  // What a team's orders were expected to make, newest first.
  rpc RevenueList(RevenueListRequest) returns (RevenueListResponse);
  // The same money, summed PER DAY — the revenue half of the daily statement.
  rpc RevenueDaily(RevenueDailyRequest) returns (RevenueDailyResponse);
  // Stop an order's row counting — it was cancelled (#164).
  rpc RevenueVoid(RevenueVoidRequest) returns (RevenueVoidResponse);
}

// What one order was expected to make.
message OrderRevenue {
  uint64 id = 1;
  // The SELLING team that placed the order, and the order itself. Both opaque — no FK across services.
  uint64 team_id = 2;
  uint64 order_id = 3;

  // The frozen figures, copied from the order at placement. Whole rupiah.
  //
  // They are COPIED rather than referenced on purpose: this row must still read correctly if the order
  // is later edited or the rule that produced its cost changes (#74's cost rule is explicitly
  // replaceable). A revenue record that silently followed the order would stop being a record of what
  // was expected AT THE TIME, which is the only thing it is for.
  int64 revenue = 4; // what the buyer paid — the order's `total`
  int64 cogs = 5; // what the goods cost us
  int64 shipping_cost = 6;

  // revenue − cogs − shipping_cost, computed once and stored.
  //
  // Stored rather than derived on read because #76 will compare it against an ACTUAL, and a number you
  // are reconciling against has to be the number you actually promised — not one recomputed later from
  // inputs that may since have been corrected.
  int64 expected_margin = 7;

  // ⚠ 0 cogs means the goods' cost was UNKNOWN, not free (#74) — a product that was never restocked
  // has no recorded cost. The margin on such a row therefore reads as pure profit and is NOT to be
  // trusted. Kept rather than refused, because refusing would mean an order with no revenue row at all,
  // which is a worse kind of missing.
  bool cost_known = 8;

  int64 created_at_unix = 9;

  // Whether this row still counts (#164). An order cancelled after it was placed earned nothing, so
  // its row is VOIDED — kept, but excluded from every total.
  //
  // Kept rather than deleted because a deleted row cannot tell you an order was placed and then
  // cancelled, and that is a thing somebody looking at the money wants to see.
  bool voided = 10;
}

message RevenueRecordRequest {
  // Write: the same selling-team roles that place orders — recording what an order is expected to make
  // is part of placing it. Scoped to the SELLING team, which is the team the order belongs to.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN,
      ROLE_TEAM_CUSTOMER_SERVICE
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 order_id = 2 [(buf.validate.field).uint64.gt = 0];

  int64 revenue = 3 [(buf.validate.field).int64.gte = 0];
  int64 cogs = 4 [(buf.validate.field).int64.gte = 0];
  int64 shipping_cost = 5 [(buf.validate.field).int64.gte = 0];

  // Whether `cogs` is a real figure or a stand-in for "we do not know" (#74). The caller knows this and
  // this service cannot work it out — 0 is a legitimate cost as well as the unknown marker.
  bool cost_known = 6;
}

message RevenueRecordResponse {
  OrderRevenue revenue = 1;
}

// ── The guideline list shape for revenue (guidelines/service-guideline.md) ────────────────────────

// RevenueListDataType selects which slices the response carries per revenue row.
enum RevenueListDataType {
  REVENUE_LIST_DATA_TYPE_UNSPECIFIED = 0;
  REVENUE_LIST_DATA_TYPE_GENERAL = 1;
  // REVENUE: the full expected-money row the list renders.
  REVENUE_LIST_DATA_TYPE_REVENUE = 2;
}

// RevenueRowSort is the sort selection paired with the REVENUE (row) slice.
enum RevenueRowSort {
  REVENUE_ROW_SORT_UNSPECIFIED = 0;
  REVENUE_ROW_SORT_CREATED_AT = 1;
  REVENUE_ROW_SORT_EXPECTED_MARGIN = 2;
  REVENUE_ROW_SORT_REVENUE = 3;
}

// RevenueListFilter carries the NON-scope filters (the scoped team_id stays top-level on the request).
message RevenueListFilter {
  // THE PERIOD, inclusive at both ends, as YYYY-MM-DD (#171). Both empty = every order ever. Server-
  // side: this list is paginated, so a client-side date filter narrows the loaded page only and leaves
  // the TOTALS beside it unfiltered. A revenue row is dated by its `created_at` (order placement, #153).
  string from = 1 [(buf.validate.field).string.max_len = 10];
  string to = 2 [(buf.validate.field).string.max_len = 10];
}

message RevenueListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    warehouse.common.v1.GeneralSort general = 2;
    RevenueRowSort revenue = 3;
  }
}

message RevenueListRequest {
  // Read: money is a manager's view. Customer service places orders but does not need the margin on
  // them, so it is deliberately absent here even though it may call Record.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  RevenueListFilter filter = 2;
  RevenueListFilterSort sort = 3;
  repeated RevenueListDataType data_request = 4;

  // Grows with every order, so it pages (HARD RULE 9).
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

// RevenueRowItem is the REVENUE slice — the fields the revenue list renders (mirrors OrderRevenue).
message RevenueRowItem {
  uint64 id = 1;
  uint64 team_id = 2;
  uint64 order_id = 3;
  int64 revenue = 4;
  int64 cogs = 5;
  int64 shipping_cost = 6;
  int64 expected_margin = 7;
  bool cost_known = 8;
  int64 created_at_unix = 9;
  bool voided = 10;
}

message RevenueRowMapItem {
  map<uint64, RevenueRowItem> map_data = 1;
}

message RevenueListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    RevenueRowMapItem revenue = 2;
  }
}

message RevenueListResponse {
  repeated RevenueListResponseItem items = 1;
  // The revenue-row ids in sorted (page) order.
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;

  // The totals across the WHOLE team, not the loaded page (#78) — an additive aggregate the summary
  // cards need. A page total would be a different number wearing the same label.
  RevenueTotals totals = 4;
}

// The team's expected money, summed over every one of its orders.
message RevenueTotals {
  int64 revenue = 1;
  int64 cogs = 2;
  int64 shipping_cost = 3;
  int64 expected_margin = 4;

  // How many of the summed orders had an UNKNOWN cost (#74) — rows whose margin reads as if the goods
  // were free.
  //
  // The count is reported rather than the rows being excluded, because both alternatives lie: dropping
  // them understates revenue that genuinely happened, and including them silently overstates margin.
  // Naming the number lets a reader judge how much of the total to trust, which is the only honest
  // option while some costs are unknown.
  uint64 unknown_cost_orders = 5;
}

// ── The DAILY STATEMENT's revenue half ────────────────────────────────────────────────────────────
//
// RevenueList already answers "what did this period make" and RevenueTotals sums it. What neither can
// answer is "which DAYS made it" — and that is the question somebody asks the moment a month's margin
// looks wrong, because a month is not a thing that goes wrong, a Tuesday is.
//
// ⚠ IT IS NOT PAGINATED, and that is deliberate rather than an oversight of HARD RULE 9. The rule
// exists because a `repeated` whose size grows WITH THE DATA is a latent out-of-memory bug. This one
// does not: its size is `to − from`, which the CALLER states and the server CAPS at 366 days
// (InvalidArgument beyond that, and both bounds are required). Ten years of orders and one year of
// orders return the same 366 rows. That is the same bargain `SearchUser`'s capped typeahead makes —
// a hard bound satisfies the rule's intent without a cursor — and it is why `from`/`to` are required
// here while they are optional on RevenueList, which pages instead.
//
// ⚠ THE SERIES IS SPARSE: a day with no orders is ABSENT, not a zero row. The client renders the date
// spine, because it has to build one anyway — the statement subtracts this service's days from
// expense_service's days, and two services each generating their own dense calendar is two copies of
// the same arithmetic, free to disagree about what February contains.
message RevenueDailyFilter {
  // THE PERIOD, inclusive at both ends, as YYYY-MM-DD. REQUIRED on both sides — see the cap above.
  string from = 1 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  string to = 2 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
}

message RevenueDailyRequest {
  // Read: the same managers RevenueList admits. A daily breakdown is strictly more detail about the
  // same money, so it cannot be looser than the list it decomposes.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  RevenueDailyFilter filter = 2 [(buf.validate.field).required = true];
}

// One day's expected money.
//
// There is no `data_request` slice oneof here, unlike the list shapes above, and that is on purpose:
// the guideline's slice machinery exists so a caller can skip data that is EXPENSIVE to load. A day is
// six integers and a date. A one-member oneof would be a shape whose second case nobody can name,
// which is harder to read than not having one.
message RevenueDayItem {
  // The day this row sums, as YYYY-MM-DD.
  //
  // ⚠ BUCKETED IN UTC, from `created_at` — the same timezone the period filter already parses its
  // bounds in. Consistency is the reason: the daily rows and the period total sit on one screen, and a
  // series that bucketed in Asia/Jakarta while the total filtered in UTC would not add up to it. The
  // business is UTC+7, so an order placed before 07:00 local lands on the previous day here. That is a
  // real limitation, it predates this RPC, and fixing it means giving the whole service a timezone —
  // which is the owner's call, not this message's.
  string date = 1;

  // How many LIVE orders the day holds. Voided rows (#164) are excluded from every figure below, so
  // this counts what the money is actually made of.
  uint64 orders = 2;

  int64 revenue = 3;
  int64 cogs = 4;
  int64 shipping_cost = 5;
  int64 expected_margin = 6;

  // How many of the day's orders had an UNKNOWN cost (#74) — the day's margin reads as if those goods
  // were free. Reported per day as well as per period, because a single bad Tuesday is invisible in a
  // monthly count.
  uint64 unknown_cost_orders = 7;
}

message RevenueDailyResponse {
  // ASCENDING by date, and SPARSE — see the note on RevenueDailyFilter.
  repeated RevenueDayItem days = 1;

  // The same totals RevenueList reports, over the same period. Sent rather than left to the client to
  // sum, so the statement's footer is the SERVER's answer: a footer summed in the browser would drift
  // from the list screen's total the first time either rounding rule changed.
  RevenueTotals totals = 2;
}

message RevenueVoidRequest {
  // Write: the same selling-team roles that place and cancel orders — voiding is part of cancelling.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN,
      ROLE_TEAM_CUSTOMER_SERVICE
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 order_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message RevenueVoidResponse {
  // The voided row. Absent when the order had no revenue row at all — which is not an error: an order
  // placed before #153, or one whose publish was lost, has nothing to void, and refusing would make a
  // redelivery fail forever.
  OrderRevenue revenue = 1;
}
