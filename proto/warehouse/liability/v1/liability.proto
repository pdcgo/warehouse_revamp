      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  // The CREDITOR again — whoever confirmed is who un-confirms.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  uint64 payment_id = 2 [(buf.validate.field).uint64.gt = 0];

  // Why. Reversing a confirmation says a person got it wrong, and the next person to read the history
  // deserves to know what happened rather than seeing two entries that cancel out for no stated
  // reason.
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

