      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  // The CREDITOR — and the scope. The whole two-phase design rests on this being the team that was
  // paid: a payer who could confirm their own payment could write off any debt they liked.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  uint64 payment_id = 2 [(buf.validate.field).uint64.gt = 0];
