// A CREDITOR'S TERMS toward one debtor — what it charges and how far it will let them run (#189).
//
// One row covers both fees and the limit because they are one relationship: the warehouse that
// charges you 12k an order is the warehouse that caps you at 50m. Splitting them would mean two
// screens and two chances to configure half of it.
message LiabilityTerms {
  // The creditor — the team that SETS these terms.
  uint64 team_id = 1;

  // The debtor they apply to. ⚠ 0 IS THE DEFAULT ROW, applying to every team without one of their
  // own. That is the whole override mechanism, and it is why 0 is not a valid team id anywhere else.
  uint64 counterparty_id = 2;

  // FLAT PER ORDER, whole rupiah, charged by a warehouse for fulfilling it. NO RATE CONFIGURED MEANS
  // CHARGE NOTHING — a warehouse that has set nothing is not silently billing anybody.
  int64 handling_fee = 3 [(buf.validate.field).int64.gte = 0];

  // The markup this team takes when another team sells ITS product, in BASIS POINTS over the cost
  // (2000 = 20%). Basis points rather than a float, for the same reason money is int64: a percentage
  // that cannot be represented exactly is a fee that drifts.
  //
  // The anchor is the order line's frozen `unit_cost` (HPP), NOT the buyer-paid price. A markup on
  // what the buyer paid is a commission model wearing a sale's clothes — on a product that cost
  // 60.000 and sold for 100.000 at 20%, cost+markup owes the owner 72.000 while
  // buyer-paid+markup owes 20.000, and the owner loses 40.000 on their own goods.
  //
  //   product fee (per owning team) = Σ over that team's lines (unit_cost × quantity) × (1 + markup)
  //
  // ⚠ `unit_cost = 0` means UNKNOWN, not free — a product received straight into stock has no
  // recorded cost, and computes a fee of zero. The decision is to POST THE ZERO and let the
  // reconciliation report name it (#187), rather than refuse a real sale over a bookkeeping gap.
  int64 product_markup_bp = 4 [(buf.validate.field).int64.gte = 0];

  // How much this debtor may owe before their next order is refused.
  //
  // ⚠ ABSENT MEANS UNLIMITED. `0` MEANS NO CREDIT AT ALL. They are opposites, and encoding unlimited
  // as 0 is the trap: the day somebody genuinely wants to freeze a team they will type 0 and grant
  // infinite credit instead. Removing a limit means DELETING the terms row, never zeroing this field.
  //
  // The rule is CURRENT debt < limit, so exposure can reach the limit plus one order's fees and the
  // NEXT order is blocked. Friendlier than a hard ceiling — a person is cut off next time rather than
  // rejected mid-order for an amount they cannot see — and it agrees with the eventual-consistency
  // window rather than fighting it.
  optional int64 credit_limit = 5 [(buf.validate.field).int64.gte = 0];
}

enum LiabilityTermsListDataType {
  LIABILITY_TERMS_LIST_DATA_TYPE_UNSPECIFIED = 0;
  LIABILITY_TERMS_LIST_DATA_TYPE_GENERAL = 1;
  LIABILITY_TERMS_LIST_DATA_TYPE_TERMS = 2;
}

message LiabilityTermsListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  repeated LiabilityTermsListDataType data_request = 2;
  warehouse.common.v1.CommonPagination page = 3 [(buf.validate.field).required = true];
}

// The TERMS slice reuses the LiabilityTerms message directly, keyed by counterparty_id
// (0 = the default row).
message LiabilityTermsMapItem {
  map<uint64, LiabilityTerms> map_data = 1;
}

message LiabilityTermsListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    LiabilityTermsMapItem terms = 2;
  }
}

message LiabilityTermsListResponse {
  repeated LiabilityTermsListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message LiabilityTermsSetRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // 0 sets the DEFAULT row — see LiabilityTerms.counterparty_id.
  uint64 counterparty_id = 2;

  int64 handling_fee = 3 [(buf.validate.field).int64.gte = 0];
  int64 product_markup_bp = 4 [(buf.validate.field).int64.gte = 0];
  // Omit for unlimited; send 0 to freeze this team's credit entirely.
  optional int64 credit_limit = 5 [(buf.validate.field).int64.gte = 0];

  // WHY the change — required when the actor is not one of the creditor team's own people, optional
  // when they are. A creditor setting its own terms owes nobody an explanation; somebody else
  // changing them does, and that difference is the entire definition of an override here.
  //
  // ⚠ The ACTOR is not a field. It comes from the token, because a write that names its own author
  // is a write that can lie about it. The server stamps it onto the change log.
  string reason = 6 [(buf.validate.field).string.max_len = 500];
}

message LiabilityTermsSetResponse {
  LiabilityTerms terms = 1;
}

// Removing terms is a DELETE, and that is the point: it is the only way to express "unlimited"
// once a limit has been set, because 0 already means the opposite.
message LiabilityTermsDeleteRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_TEAM_OWNER,
      ROLE_TEAM_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  uint64 counterparty_id = 2;

  // Same rule as LiabilityTermsSetRequest.reason. Deleting a row RAISES the limit to unlimited, so
  // it is the single most consequential write this service has.
  string reason = 3 [(buf.validate.field).string.max_len = 500];
}

message LiabilityTermsDeleteResponse {}

// ─── the change log ────────────────────────────────────────────────────────────────────────────

// LiabilityTermsChange is one recorded change to a creditor's terms toward one debtor.
//
// A log rather than columns on the terms row, for two reasons that both come from decisions already
// made. First, the limit IS the chase instrument: with no settlement cycle a creditor's only lever
// is raising and lowering it, so the current value alone is not a record of that negotiation.
// Second, a RAISE SILENTLY ERASES THE WARNING — a team at 85% whose limit doubles drops to 42% and
// the 80% warning vanishes with nothing anywhere showing it was ever warning.
message LiabilityTermsChange {
  uint64 id = 1;
  uint64 counterparty_id = 2;

  // Who made the change. Resolve the name with UserByIDs — this service does not know it.
  uint64 actor_id = 3;

  // ⚠ BOTH LIMITS ARE OPTIONAL, and that is load-bearing rather than tidy. `absent`, `0` and a
  // number are THREE different acts — no limit at all, frozen entirely, and a real ceiling — and a
  // plain int64 flattens the first into the second, turning "they removed the limit" into "they
  // froze the team". The log has to be able to say which one happened.
  optional int64 old_credit_limit = 4;
  optional int64 new_credit_limit = 5;

  // The other two terms, before and after. No optional here: 0 means "charge nothing" for both, and
  // there is no third state to lose.
  int64 old_handling_fee = 6;
  int64 new_handling_fee = 7;
  int64 old_product_markup_bp = 8;
  int64 new_product_markup_bp = 9;

  string reason = 10;

  // TRUE when the actor was not one of the creditor team's own people — an override. Derived by the
  // server at write time from the actor's membership, never sent by the caller: whether a write was
  // an override is a fact about who made it, and the caller is the one party who cannot be trusted
  // to report it.
  bool override = 11;

  int64 changed_at_unix = 12;
}

message LiabilityTermsChangeMapItem {
  map<uint64, LiabilityTermsChange> map_data = 1;
}

