syntax = "proto3";

package warehouse.team.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/team/v1;teamv1";

// TeamService owns `teams` and `team_infos`.
//
// Its most important RPC is TeamByIds: it is how every OTHER service turns a team_id it stores
// locally into a name and a type WITHOUT touching this service's database. Per-service
// independence forbids a cross-service SQL join; this is the replacement.
service TeamService {
  rpc TeamCreate(TeamCreateRequest) returns (TeamCreateResponse);
  rpc TeamUpdate(TeamUpdateRequest) returns (TeamUpdateResponse);
  // TeamCodeUpdate changes a SELLING team's code, and its products take the new one in the same transaction
  // (a-team-code-change-recomposes-its-product-codes): ABC-SHOE-42 becomes XYZ-SHOE-42, archived products too, each one
  // some warehouse holds stock of tagged `need_reprint_code` and waiting for that warehouse's reprint. A code another team
  // holds — or EVER held — is refused naming that team (a former code stays taken, the decision's Q1 "A"); the team's own
  // former code may be taken back. Its own request message: TeamUpdate's policy also admits warehouse and admin roles.
  rpc TeamCodeUpdate(TeamCodeUpdateRequest) returns (TeamCodeUpdateResponse);
  // TeamCodePreview says what a TeamCodeUpdate to that code WOULD do, before anything is sent — the four-line confirm
  // (the-team-code-and-product-tags-prototype-is-accepted): the refusal the write would give (another team holds the
  // code, or held it once — named), else how many products take the new code with one example, and the warehouses that
  // must reprint. TeamCodeUpdate's policy and scope; it writes nothing.
  rpc TeamCodePreview(TeamCodePreviewRequest) returns (TeamCodePreviewResponse) {
    // A READ — no row, no event, no file (the-admin-team-monitors-read-only reads it by this mark, never by its name).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc TeamDelete(TeamDeleteRequest) returns (TeamDeleteResponse);
  rpc TeamList(TeamListRequest) returns (TeamListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc TeamDetail(TeamDetailRequest) returns (TeamDetailResponse);

  // TeamByIds bulk-resolves teams. Unknown and soft-deleted ids are OMITTED from the map —
  // callers must check for presence, never index blindly.
  rpc TeamByIds(TeamByIdsRequest) returns (TeamByIdsResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc TeamInfoUpdate(TeamInfoUpdateRequest) returns (TeamInfoUpdateResponse);

  // The warehouse PROFILE — location, both weekly grids — moved to warehouse_service's WarehouseInfoService
  // (the-warehouse-profile-lives-in-warehouse-service). This service keeps only what describes a TEAM.
}

// THE canonical TeamType — declared ONCE, here, by the service that owns the teams table.
// Never redeclare it in another package.
//
// The numbers deliberately match no legacy numbering: nothing persists them (the column is
// TEXT with a CHECK), so a raw int carried over from old code produces an obviously wrong
// value rather than a plausible, silently-swapped one.
enum TeamType {
  TEAM_TYPE_UNSPECIFIED = 0;
  TEAM_TYPE_ROOT = 1;
  TEAM_TYPE_ADMIN = 2;
  TEAM_TYPE_WAREHOUSE = 3;
  TEAM_TYPE_SELLING = 4;
}

message TeamInfo {
  uint64 team_id = 1;
  string contact_number = 2;

  // 3–5 were the team's bank — type, holder, number. The team record holds no bank (owner,
  // 2026-09-30): a bank a team holds is a financial account, and kept here too it would be one bank
  // typed in two places.
  reserved 3, 4, 5;
  reserved "bank_type", "bank_owner_name", "bank_account_number";

  // 6–7 were the return warehouse and the return user. The return warehouse lives in the order context's
  // team_return_configurations now (the-return-warehouse-lives-in-team-return-configurations), and the return
  // user was read by nothing (return-user-id-is-dropped).
  reserved 6, 7;
  reserved "return_warehouse_id", "return_user_id";

  // The warehouse this SELLING team ships from by default (#145). 0 = not configured.
  //
  // A convenience, not a rule: the order form pre-selects it and the person may still choose another,
  // and the server keeps refusing an order that names no warehouse (#72). Applying it as a server-side
  // fallback would quietly undo that refusal, which exists so a warehouse-less order cannot reach the
  // database at all.
  uint64 default_warehouse_id = 8;
}

message Team {
  uint64 id = 1;
  TeamType type = 2;
  string name = 3;
  string team_code = 4;
  string description = 5;
  bool deleted = 6;

  // Populated on TeamDetail only. TeamList and TeamByIds leave it unset.
  TeamInfo info = 7;

  // A compact team picture (like a user avatar). Empty when the team has no picture. Set via
  // TeamUpdate after a two-phase document upload; the app shows initials as a fallback.
  string image_url = 8;

  // THE PRIORITY-PRODUCT FEATURE (owner). Set by ROOT, and it applies to the team's WHOLE catalogue:
  // every product this team owns is a priority product to everybody browsing.
  //
  // A flag on the TEAM rather than on the product, and deliberately not a per-viewer curation — so
  // every selling team discovering products sees the same priority set. It is what backs the product
  // picker's *Priority Product* tab.
  //
  // ⚠ NOT settable through TeamInfoUpdate, and that is a policy decision rather than a layout one:
  // that message is callable by SELLING_OWNER, so a capability granted by root must not live in it or a
  // team could grant itself the feature. How root sets it is not designed yet — the column and the
  // read path land first.
  bool priority_product = 9;
}

message TeamCreateRequest {
  // Unscoped on purpose: there is no team to scope to yet.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  TeamType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1
    ]
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 4
    max_len: 128
  }];
  // A code another team holds — or held once, a former code being never given to another team
  // (a-team-code-change-recomposes-its-product-codes) — is AlreadyExists, a TeamCodeTaken detail naming that team.
  string team_code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10
  }];
  string description = 4 [(buf.validate.field).string = {max_len: 300}];

  // The person who becomes the team's first Owner, picked or created on the Create Team form, and granted
  // the team type's Owner role. The person creating the team is NOT made a member: Root and the
  // Administrator reach every team from the switcher's All teams
  // (the-create-team-form-names-the-first-owner, the-pass-1-prototype-is-accepted).
  //
  // An unknown or suspended person is refused, and then no team is created and its code stays free.
  uint64 owner_user_id = 5 [(buf.validate.field).uint64.gt = 0];
}

message TeamCreateResponse {
  Team team = 1;
}

message TeamUpdateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_ADMIN_OWNER,
      ROLE_ADMIN_ADMINISTRATOR
    ]
  };

  // use_scope is LOAD-BEARING: without it, the roles above are evaluated against team 1, and
  // the team/warehouse OWNER and ADMIN entries become dead letters — the policy would claim a
  // team manager may edit their team while the system silently required root/admin.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // Absent = leave alone. `type` is immutable after create; `team_code` changes only through TeamCodeUpdate, whose
  // policy is narrower (a selling team's owner and admin, Root, the Administrator) and which recomposes the products.
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 4
    max_len: 128
  }];
  optional string description = 3 [(buf.validate.field).string = {max_len: 300}];

  // The compact team picture URL (see Team.image_url). Present & empty = clear it.
  optional string image_url = 4 [(buf.validate.field).string.max_len = 1024];
}

message TeamUpdateResponse {
  Team team = 1;
}

// THE TEAM CODE EDIT (backlog #149, a-team-code-change-recomposes-its-product-codes; the screens' design
// the-team-code-and-product-tags-prototype-is-accepted). The selling Owner and Admin on their own team (Settings' Kode tim),
// Root and the Administrator on any selling team (Teams → Edit Team) — the acceptance rows' givens. A warehouse or admin
// team's code is refused (FailedPrecondition): no product is composed from it.
message TeamCodeUpdateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  // use_scope is LOAD-BEARING: the selling roles above are evaluated in this team.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The new code, 1–10 characters as TeamCreate takes it; trimmed of surrounding space (blank is InvalidArgument).
  // The code the team has already is no change: nothing is written and nothing recomposed.
  string team_code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10
  }];
}

message TeamCodeUpdateResponse {
  Team team = 1;
  // false when the code sent is the team's code already — nothing was written.
  bool changed = 2;
  // How many of the team's products took the new code — every one whose code began with the old code and a dash,
  // archived ones too.
  uint32 products_recomposed = 3;
  // How many of them were tagged `need_reprint_code` — those some warehouse holds stock of; one with nothing on a shelf
  // takes the new code untagged.
  uint32 products_tagged = 4;
  // How many of the team's products did NOT begin with the old code and a dash, and were left as they were (rows written
  // before codes were composed); `left_alone_codes` names the first 20 of them.
  uint32 products_left_alone = 5;
  repeated string left_alone_codes = 6;
}

// THE TEAM CODE PREVIEW (backlog #150) — the figures of the confirm Settings' Kode tim card and root's Edit Team open
// BEFORE TeamCodeUpdate is sent (the-team-code-and-product-tags-prototype-is-accepted, *the confirm*): read when the
// confirm opens, never on a page load. TeamCodeUpdate's policy and scope — whoever may change the code may ask first.
message TeamCodePreviewRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  // use_scope is LOAD-BEARING: the selling roles above are evaluated in this team.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The code the person typed, as TeamCodeUpdate takes it: 1–10 characters, trimmed (blank is InvalidArgument).
  string team_code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10
  }];
}

// What a TeamCodeUpdate to the code would do.
enum TeamCodePreviewVerdict {
  TEAM_CODE_PREVIEW_VERDICT_UNSPECIFIED = 0;
  // The team would take the code: the counts below say what follows.
  TEAM_CODE_PREVIEW_VERDICT_CHANGES = 1;
  // The code is the team's own already — the write would change nothing.
  TEAM_CODE_PREVIEW_VERDICT_SAME = 2;
  // Another team holds the code now — the write would be refused AlreadyExists; `holder_team_name` names it.
  TEAM_CODE_PREVIEW_VERDICT_TAKEN = 3;
  // Another team held the code once (a former code is never given to another team) — refused as TAKEN is.
  TEAM_CODE_PREVIEW_VERDICT_FORMER = 4;
}

message TeamCodePreviewResponse {
  TeamCodePreviewVerdict verdict = 1;
  // TAKEN / FORMER: the team that holds the code, or held it — the refusal's words (*SL-01 sudah ada — dipakai Toko
  // Melati*). Empty otherwise.
  string holder_team_name = 2;
  // CHANGES only — everything below is empty for any other verdict.
  // How many of the team's products would take the new code: every one whose code begins with the team's code and a
  // dash, archived ones too (TeamCodeUpdate's rule).
  uint32 products = 3;
  // One of them, old → new (an active product first): SL-03-ANG-001 → ANGR-ANG-001. Empty when there is none.
  string example_old_code = 4;
  string example_new_code = 5;
  // The warehouses holding units of those products on a shelf now — each must reprint their labels, and the products
  // carry `need_reprint_code` until it does. By name, sorted; a product with nothing on a shelf is counted above and
  // names no warehouse.
  repeated string warehouse_names = 6;
}

// TeamCodeTaken rides the AlreadyExists of a TeamCodeUpdate — and of a TeamCreate — whose code another team holds now, or
// held once (a former code is never given to another team). It names that team for the refusal's words
// (*SL-01 sudah ada — dipakai Toko Melati*).
message TeamCodeTaken {
  string team_code = 1;
  string team_name = 2;
  // true: the team held it once and has another code now.
  bool former = 3;
}

message TeamDeleteRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  uint64 team_id = 1 [(buf.validate.field).uint64.gt = 0];
}

message TeamDeleteResponse {}

// ── The guideline list shape for teams (guidelines/service-guideline.md) ──────────────────────────

// TeamListDataType selects which slices the response carries per team.
enum TeamListDataType {
  TEAM_LIST_DATA_TYPE_UNSPECIFIED = 0;
  TEAM_LIST_DATA_TYPE_GENERAL = 1;
  // TEAM: the full team row a list/picker renders (never the `info`, which is TeamDetail-only).
  TEAM_LIST_DATA_TYPE_TEAM = 2;
}

// TeamRowSort is the sort selection paired with the TEAM (row) slice.
enum TeamRowSort {
  TEAM_ROW_SORT_UNSPECIFIED = 0;
  TEAM_ROW_SORT_NAME = 1;
  TEAM_ROW_SORT_TEAM_CODE = 2;
  TEAM_ROW_SORT_ID = 3;
}

// TeamListFilter holds the filters. TeamList is UNSCOPED (the roster is the same for every caller),
// so there is no team_id here at all.
message TeamListFilter {
  string q = 1 [(buf.validate.field).string.max_len = 100];
  TeamType team_type = 2;

  // Only teams that carry the priority-product feature (see Team.priority_product). false = no
  // narrowing, which is the default.
  //
  // This is how the product picker resolves its *Priority Product* tab: it asks team_service WHICH
  // TEAMS are priority, then narrows a product query by those ids. product_service is never told
  // what "priority" means — it filters by a list of team ids it was handed, which is what keeps the
  // two services independent (HARD RULE 3) instead of joining `products` to `teams`.
  bool priority_product_only = 3;
}

message TeamListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    warehouse.common.v1.GeneralSort general = 2;
    TeamRowSort team = 3;
  }
}

message TeamListRequest {
  option (warehouse.role_base.v1.request_policy) = {allow_only_authenticated: true};

  TeamListFilter filter = 1;
  TeamListFilterSort sort = 2;
  repeated TeamListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

// TeamRowItem is the TEAM slice — the fields a list/picker renders (mirrors Team minus `info`).
message TeamRowItem {
  uint64 id = 1;
  TeamType type = 2;
  string name = 3;
  string team_code = 4;
  string description = 5;
  bool deleted = 6;
  string image_url = 7;
  // See Team.priority_product. Carried on the row because the product picker reads the priority
  // TEAM LIST and then narrows a product query by those ids — it never asks per product.
  bool priority_product = 8;
}

message TeamRowMapItem {
  map<uint64, TeamRowItem> map_data = 1;
}

message TeamListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    TeamRowMapItem team = 2;
  }
}

message TeamListResponse {
  repeated TeamListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message TeamDetailRequest {
  option (warehouse.role_base.v1.request_policy) = {allow_only_authenticated: true};

  uint64 team_id = 1 [(buf.validate.field).uint64.gt = 0];
}

message TeamDetailResponse {
  Team team = 1;
}

// TeamByIdsDataType selects which slices the by-ids response carries per team.
enum TeamByIdsDataType {
  TEAM_BY_IDS_DATA_TYPE_UNSPECIFIED = 0;
  TEAM_BY_IDS_DATA_TYPE_GENERAL = 1;
  TEAM_BY_IDS_DATA_TYPE_TEAM = 2;
}

// TeamByIdsFilter carries the ids to resolve. Deliberately UNSCOPED (cross-team bulk lookup), so no
// team_id.
message TeamByIdsFilter {
  repeated uint64 ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

message TeamByIdsRequest {
  // Deliberately UNSCOPED: this is a cross-team bulk lookup. Scoping it would defeat it.
  option (warehouse.role_base.v1.request_policy) = {allow_only_authenticated: true};

  TeamByIdsFilter filter = 1 [(buf.validate.field).required = true];
  // Which slices to load per team. Empty defaults to the TEAM (row) slice.
  repeated TeamByIdsDataType data_request = 2;
}

message TeamByIdsResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    TeamRowMapItem team = 2;
  }
}

message TeamByIdsResponseList {
  repeated TeamByIdsResponseItem items = 1;
}

message TeamByIdsResponse {
  // Keyed by team id. Unknown AND soft-deleted ids are OMITTED — check presence, do not index
  // blindly. The map is never nil, so ranging an empty result is safe.
  map<uint64, TeamByIdsResponseList> items = 1;
}

message TeamInfoUpdateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_ADMIN_OWNER,
      ROLE_ADMIN_ADMINISTRATOR
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // ALL optional — explicit presence. Absent = leave alone. Present = write it, including
  // present-and-zero = clear. Without presence there is no way to say "don't touch this", and
  // a contact-number-only update silently blanks the default warehouse.
  optional string contact_number = 2 [(buf.validate.field).string.max_len = 40];
  // 3–5 were the team's bank — see TeamInfo.
  reserved 3, 4, 5;
  reserved "bank_type", "bank_owner_name", "bank_account_number";
  // 6–7 were the return warehouse and the return user — see TeamInfo.
  reserved 6, 7;
  reserved "return_warehouse_id", "return_user_id";
  optional uint64 default_warehouse_id = 8; // present & 0 = clear to NULL (#145)
}

message TeamInfoUpdateResponse {
  TeamInfo info = 1;
}
