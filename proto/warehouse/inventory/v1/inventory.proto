syntax = "proto3";

package warehouse.inventory.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/inventory/v1;inventoryv1";

// InventoryService owns `stock_movements` (an append-only ledger) and `stock_levels` (a derived
// on-hand snapshot maintained from the ledger in the same transaction). It answers one question —
// how much of a product is at a warehouse, and why did it change.
//
// Everything is scoped by `warehouse_id` (a team of type WAREHOUSE): that is the physical place and
// the thing a worker has a role in. `product_id` is an OPAQUE id owned by product_service — there
// is no cross-service FK; it is resolved over RPC when a name is needed.
service InventoryService {
  rpc StockList(StockListRequest) returns (StockListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc StockHistory(StockHistoryRequest) returns (StockHistoryResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc StockAdjust(StockAdjustRequest) returns (StockAdjustResponse);

  // What an order's take WOULD find — the read half of OrderTransactionCreate, so the order form can show what it is
  // about to take before it takes it (#90): the product's batches in the warehouse, summed.
  rpc StockAvailability(StockAvailabilityRequest) returns (StockAvailabilityResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // WHAT THIS WAREHOUSE CAN SELL — the paginated list behind the order form's product picker.
  //
  // The list is owned HERE rather than by the catalogue because the filter that defines it — "has
  // stock in this building" — is a fact this service owns, and a filter has to be applied where the
  // paging happens. Filtering a catalogue page after it loads would show two rows out of ten while
  // the pager went on counting all ten.
  rpc StockedProductList(StockedProductListRequest) returns (StockedProductListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // What products are WORTH on this warehouse's shelf — the average value of the units held. The rack valuation reads
  // it; no order does any more (an-order-is-costed-at-what-leaves-the-shelf — an order's cost is StockTakeQuote's).
  rpc StockCost(StockCostRequest) returns (StockCostResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // What an order's take WOULD DRAW, before it draws it (an-order-is-costed-at-what-leaves-the-shelf): per line the
  // owner's batches oldest first, their cost, and whether there are enough — the take's own selection, read-only, so
  // the order form's preview and the cost the order freezes cannot be two rules.
  rpc StockTakeQuote(StockTakeQuoteRequest) returns (StockTakeQuoteResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // `WarehouseProductList` (what a warehouse was ASKED to hold, #142) is DELETED (warehouse-product-list-is-deleted):
  // nothing called it once a warehouse's Products became what it holds (WarehouseProductSearch, WarehouseStockList).
  // Its NAME is reserved — never add an rpc by that name; its request and response below keep only `reserved` lines.

  // The WAREHOUSE'S PRODUCT PICKER (a-warehouse-picks-only-what-it-has-held) — Report Found, a count's product plan and
  // a count's found: the products with a batch in this warehouse, any team's, at 0 today or not, searched by name or
  // product code. Inventory knows what has been here; product_service names and searches it.
  rpc WarehouseProductSearch(WarehouseProductSearchRequest) returns (WarehouseProductSearchResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The STOCK SCREEN (the-stock-screen-lists-what-the-warehouse-has-held) — Inventories ▸ Stock: every product with a
  // batch in this warehouse, any team's, at 0 today or not, archived ones flagged, each with its owner team and its units
  // on hand here; searched by name or product code on the server, paged. The same set the picker searches.
  rpc WarehouseStockList(WarehouseStockListRequest) returns (WarehouseStockListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Which shelves already hold a product (#156) — the put-away recommendation.
  rpc ProductPlaces(ProductPlacesRequest) returns (ProductPlacesResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // WHERE TO WALK for an already-committed pick (#151) — the pick list's shelf column.
  rpc StockPickLocations(StockPickLocationsRequest) returns (StockPickLocationsResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The batch reads (#209) — deliveries of stock as cost layers. BatchList backs both the product
  // detail's Batches tab (filtered to one product) and the warehouse-wide batch list.
  rpc BatchList(BatchListRequest) returns (BatchListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The product detail's PRICES tab (#209): on-hand grouped by frozen cost, one row per cost layer.
  rpc CostLayerList(CostLayerListRequest) returns (CostLayerListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The product detail's PLACEMENT tab (#209): where a product sits, per shelf, with the last movement
  // dates that flag a shelf overdue for a count.
  rpc PlacementList(PlacementListRequest) returns (PlacementListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The product detail's INFO tab tiles (#209) in ONE aggregate read — ready & ongoing stock, when it
  // was last counted, the last delivery. One call keeps the header cheap.
  rpc ProductStockSummary(ProductStockSummaryRequest) returns (ProductStockSummaryResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // One batch in full, and where it sits (#209) — the batch-detail screen. Its history is StockHistory
  // filtered by batch, so there is no separate event RPC.
  rpc BatchDetail(BatchDetailRequest) returns (BatchDetailResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc BatchPlacementList(BatchPlacementListRequest) returns (BatchPlacementListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The goods-received receipt for ONE delivery (#219) — every product line that arrived on it.
  rpc BatchReceipt(BatchReceiptRequest) returns (BatchReceiptResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ── The CATALOGUE OWNER's view of its own stock ────────────────────────────────────────────────
  //
  // Every read above answers for a WAREHOUSE: the caller is the building, and team_id is the building's
  // team. These two answer for the SELLING TEAM that owns the goods — "how much of MY product is on a
  // shelf, anywhere, and what is it worth" — which no RPC could answer before.
  //
  // Ownership is not taken on trust and is not a new column: stock arrives through an accepted restock
  // line, so every batch traces batch → restock_request_item → restock_request.requesting_team_id.
  // Both reads join through that chain, which means a caller passing another team's product id gets
  // zeros rather than their numbers.
  rpc OwnerStockByIds(OwnerStockByIdsRequest) returns (OwnerStockByIdsResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc OwnerStockStat(OwnerStockStatRequest) returns (OwnerStockStatResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The owner's three ROW-level reads (#232), behind the product detail's Price, Batch and Stock
  // history tabs. OwnerStockByIds above answers per-product aggregates; these answer what those
  // aggregates are made of, under the same ownership join and the same warehouse lens.
  rpc OwnerCostLayerList(OwnerCostLayerListRequest) returns (OwnerCostLayerListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc OwnerBatchList(OwnerBatchListRequest) returns (OwnerBatchListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc OwnerStockHistory(OwnerStockHistoryRequest) returns (OwnerStockHistoryResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // KOREKSI HARGA — the OWNING team corrects one batch's unit price (the-owning-team-revalues-with-a-reason,
  // the-correct-price-prototype-is-accepted, a-corrected-price-is-above-zero): a typo or a markdown, never a late cost
  // (a-late-cost-is-an-expense-not-a-revaluation). It reprices the units LEFT only — no unit moves, no rack changes — as
  // one `revaluation` transaction (revaluation-and-opname-are-transaction-types), never rolled back
  // (a-rollback-only-undoes-a-take). A WRITE: no monitor and no agent's credential.
  rpc BatchRevalue(BatchRevalueRequest) returns (BatchRevalueResponse);

  // A SUPPLIER'S GOODS — the supplier pages' Terjual and Siap with their last dates, and Gudang terkait's counts
  // (the-supplier-list-shows-sales-and-ready-stock, sales-are-all-time-with-their-last-dates,
  // the-detail-tabs-show-sold-and-ready, the-summary-is-sold-and-ready-with-their-counts). A supplier's goods are the
  // batches minted with its id (a-batch-keeps-its-supplier), from EVERY team — a supplier's figures are not private
  // to the team that bought (every-selling-team-sees-every-teams-figures).
  rpc SupplierGoods(SupplierGoodsRequest) returns (SupplierGoodsResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// MovementKind — why a stock quantity changed. Every ledger row has one.
enum MovementKind {
  MOVEMENT_KIND_UNSPECIFIED = 0;
  MOVEMENT_KIND_RECEIVE = 1;
  MOVEMENT_KIND_ADJUST = 2;
  MOVEMENT_KIND_TRANSFER_OUT = 3;
  MOVEMENT_KIND_TRANSFER_IN = 4;
  MOVEMENT_KIND_PICK = 5; // reserved for the future order/pick flow
  // Stock moved from one place to another INSIDE one warehouse (#136) — shelving what arrived, or
  // re-organising a shelf. The warehouse's total does not change; only where it sits does, which is
  // what makes it a different fact from a receive.
  //
  // ONE kind, not an OUT/IN pair like a transfer. A transfer needs two because its legs are in two
  // WAREHOUSES, and each side only ever sees its own; both legs of a move are in the same warehouse,
  // so a reader sees the pair together and the rack plus the sign already tell the story.
  MOVEMENT_KIND_MOVE = 6;
  // Stock put BACK after a pick was undone (#70/#149) — a cancelled order, or an order write that
  // failed after its stock had already been taken.
  //
  // A distinct kind rather than a positive PICK, because "we took 10 for an order" and "we gave 10
  // back because the order died" are different events, and a ledger that could not tell them apart
  // would make a cancelled order look like a delivery that never happened.
  MOVEMENT_KIND_RETURN = 7;
  // A SAMPLE handed to a person at the warehouse (a-sample-is-handed-over-at-the-warehouse) — the owning team's units
  // leaving with no sale, off the rack staff took them from. Final: never rolled back (a-handed-over-sample-is-final).
  MOVEMENT_KIND_SAMPLE = 8;
  // A batch's PRICE CORRECTED (the-owning-team-revalues-with-a-reason, BatchRevalue) — no unit moved (`delta` 0): the
  // batch's unit price went from `price_unit_before` to `price_unit_after`, and its units left are worth `value_change`
  // more or less; `reason` says why. A batch-ledger row only (no rack row is written), so a batch's history and the
  // owner's show it and a rack's never does. Out of ADJUST, which keeps units found broken, lost or found.
  MOVEMENT_KIND_REVALUATION = 9;
}

// StockLevel — the derived on-hand of a product at a warehouse (the snapshot).
// StockLevel — how much of a product a WAREHOUSE holds. Always the warehouse's TOTAL, summed across
// the product's places (#135): a product on three shelves is one StockLevel holding the lot, because
// "how much of X do we have here?" has never meant "on which shelf". It deliberately carries no rack —
// "what is on rack A-01-3" is a different question with its own screen (#138). A per-place figure is
// reported by the movement that produced it (StockMovement.rack_id / .balance).
message StockLevel {
  uint64 product_id = 1;
  uint64 warehouse_id = 2;
  int64 on_hand = 3;
}

// StockMovement — one row of the ledger. Append-only; `balance` is the on-hand AFTER this movement,
// so the history reads as a running total.
//
// A movement is a statement about ONE PLACE (#135): "this shelf went from 40 to 49". Both `delta` and
// `balance` are that place's, never the warehouse's total for the product — a warehouse total is a SUM
// across places, and reading `balance` as one would under-report every product that sits on more than
// one shelf.
message StockMovement {
  uint64 id = 1;
  uint64 product_id = 2;
  uint64 warehouse_id = 3;
  int64 delta = 4; // signed: + in, - out
  int64 balance = 5; // THIS PLACE's on-hand after this movement
  MovementKind kind = 6;
  string reason = 7;
  string ref = 8; // opaque external reference (e.g. an order id); optional
  uint64 actor_user_id = 9;
  string created_at = 10; // RFC3339

  // The place this movement moved stock onto or off (#135/#139). 0 = the unplaced pile — stock that
  // arrived before anyone shelved it, and every movement written before racks carried stock at all.
  uint64 rack_id = 11;

  // Which batch moved (#209). 0 = a batch-less event — a shelf recount reconciles the whole shelf and
  // shows Batch "—" (#211), even though its delta lands on the oldest batch underneath (FIFO).
  uint64 batch_id = 12;

  // THE MOVE WAS AN OVERRIDE — its inventory transaction's creator was Root or the System Administrator acting inside a team they hold no role in (an-override-is-stamped-in-every-service);
  // the screen shows the shared "by Root team" badge beside the person (an-override-shows-a-platform-badge).
  // From `inventory_transactions.is_override` of the row's transaction; false for a row under no transaction.
  bool is_override = 13;

  // THE BATCH'S PRICE AND VALUE ON THIS ROW — set on a BATCH-ledger row (a history narrowed to a batch); a rack row
  // carries 0 in all three. `value_change` is what the row changed the batch's value by (`batch_logs.change_valuation`),
  // `price_unit_after` the batch's unit price once it applied (batch-logs-carry-price-unit-after). Only a REVALUATION row
  // changes a price: there `price_unit_before` is the price it corrected; on every other row it equals `price_unit_after`.
  double price_unit_before = 14;
  double price_unit_after = 15;
  double value_change = 16;

  // KOREKSI JUMLAH TERIMA — set on an ADJUST row a received-count correction wrote: *Jumlah terima dikoreksi · from →
  // to* and why (a-wrong-stock-in-is-a-received-count-correction). Unset on every other row.
  MovementCountCorrection received_count_correction = 17;
}

// MovementCountCorrection — the restock or transfer line a history row's correction fixed, its count before and after,
// and the reason. One of restock_id / transfer_id is set.
message MovementCountCorrection {
  int64 from_count = 1;
  int64 to_count = 2;
  string reason = 3;
  uint64 restock_id = 4;
  uint64 transfer_id = 5;
}

// -------------------------------------------------------------------------- reads

message StockListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 warehouse_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  repeated StockListDataType data_request = 2;
  warehouse.common.v1.CommonPagination page = 3 [(buf.validate.field).required = true];
}

enum StockListDataType {
  STOCK_LIST_DATA_TYPE_UNSPECIFIED = 0;
  STOCK_LIST_DATA_TYPE_GENERAL = 1;
  STOCK_LIST_DATA_TYPE_STOCK = 2;
}

// The STOCK slice reuses StockLevel, keyed by product_id.
message StockLevelMapItem {
  map<uint64, StockLevel> map_data = 1;
}

message StockListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    StockLevelMapItem stock = 2;
  }
}

message StockListResponse {
  repeated StockListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message StockHistoryRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 warehouse_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  StockHistoryFilter filter = 2 [(buf.validate.field).required = true];
  repeated StockHistoryDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message StockHistoryFilter {
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
  MovementKind kind = 2;
  uint64 batch_id = 3;
  int64 from_unix = 4;
  int64 to_unix = 5;
}

enum StockHistoryDataType {
  STOCK_HISTORY_DATA_TYPE_UNSPECIFIED = 0;
  STOCK_HISTORY_DATA_TYPE_GENERAL = 1;
  STOCK_HISTORY_DATA_TYPE_MOVEMENT = 2;
}

message StockHistoryMapItem {
  map<uint64, StockMovement> map_data = 1;
}

message StockHistoryResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    StockHistoryMapItem movement = 2;
  }
}

message StockHistoryResponse {
  repeated StockHistoryResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// -------------------------------------------------------------------------- writes

// Why a shelf's count is being corrected (#211). The reason drives the model: a RECOUNT reconciles the
// whole shelf (its delta lands on the oldest batch, FIFO), while DAMAGED/LOST/FOUND touch a SPECIFIC
// batch's units. APPEND ONLY.
enum StockAdjustReason {
  // Back-compat: an adjust with no reason is a recount (the original absolute-count behaviour).
  STOCK_ADJUST_REASON_UNSPECIFIED = 0;
  // A stock-take: the shelf now holds `on_hand`. Batch-agnostic on screen ("—"); the delta lands on
  // the oldest batch on the shelf underneath.
  STOCK_ADJUST_REASON_RECOUNT = 1;
  // Units of a SPECIFIC batch went bad, went missing, or turned up — a signed `quantity` on that batch.
  STOCK_ADJUST_REASON_DAMAGED = 2;
  STOCK_ADJUST_REASON_LOST = 3;
  // Units turned up on the rack. REFUSED here (InvalidArgument): a found is reported through
  // FoundRequestService.FoundRequestCreate, the one door (staff-may-report-a-found), and waits for the warehouse Owner
  // or Admin (an-adjust-found-waits-for-the-owner-or-admin). The provisional `adjustment` into a named batch is retired.
  // Kept so the value is never reused.
  STOCK_ADJUST_REASON_FOUND = 4;
}

message StockAdjustRequest {
  // Correcting to a counted figure is a manager action.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 warehouse_id = 1 [
    (warehouse.role_base.v1.use_scope) = true,
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  // For a RECOUNT: the counted on-hand to correct the shelf TO (absolute, not a delta). Ignored for the
  // batch reasons, which carry a signed `quantity` instead.
  int64 on_hand = 3 [(buf.validate.field).int64.gte = 0];
  string reason = 4 [(buf.validate.field).string.max_len = 200];

  // WHY (#211). UNSPECIFIED and RECOUNT both mean "correct the shelf to `on_hand`". DAMAGED/LOST
  // mean "change this batch's units by `quantity`" and REQUIRE `batch_id`. FOUND is refused — it is
  // FoundRequestService.FoundRequestCreate (staff-may-report-a-found).
  StockAdjustReason reason_type = 7 [(buf.validate.field).enum.defined_only = true];
  // The batch affected — required for DAMAGED/LOST, ignored for a recount (its delta is FIFO'd
  // onto the oldest batch). 0 for a recount.
  uint64 batch_id = 8;
  // The magnitude for DAMAGED/LOST (always positive; the reason gives the sign). Ignored for a
  // recount.
  int64 quantity = 9 [(buf.validate.field).int64.gte = 0];

  // WHERE the count was taken (#139). A stock-take is physically a count of a SHELF: someone stands
  // in front of A-01-3 and counts what is on it, and this says which shelf that was.
  //
  // It is a REQUIRED oneof rather than a plain `rack_id` where 0 would mean unplaced, because those
  // two encodings fail differently. With a plain field, a caller that simply FORGOT to say where
  // would silently correct the unplaced pile while the racks hold the rest — the exact bug this
  // field exists to prevent, and it would correct the wrong number quietly, which is worse than
  // failing, because a stock-take is believed. Refuse, do not interpret (cf. the per-line count in
  // RestockRequestFulfill).
  oneof place {
    option (buf.validate.oneof).required = true;

    // The shelf that was counted. Must be a rack of warehouse_id — another warehouse's rack reads as
    // NotFound, like every other cross-scope id here.
    uint64 rack_id = 5 [(buf.validate.field).uint64.gt = 0];

    // The not-yet-shelved pile was counted. A real place, not an absence: it is where stock sits
    // before it is put away — today, everything — and it can be miscounted like any shelf. Only
    // `true` is meaningful; `unplaced: false` would be a way of saying nothing.
    bool unplaced = 6 [(buf.validate.field).bool.const = true];
  }
}

message StockAdjustResponse {
  StockMovement movement = 1;
  StockLevel level = 2;
}

// One end of a move (#136): a shelf, or the not-yet-shelved pile. Both are real PLACES — "unplaced" is
// where stock sits before anyone puts it away, not an absence.
message StockPlace {
  oneof place {
    option (buf.validate.oneof).required = true;

    // Must be a rack of the scoped warehouse — another warehouse's rack reads as NotFound.
    uint64 rack_id = 1 [(buf.validate.field).uint64.gt = 0];
    // The not-yet-shelved pile. Only `true` is meaningful.
    bool unplaced = 2 [(buf.validate.field).bool.const = true];
  }
}

// ── What this warehouse can actually sell ─────────────────────────────────────────────────────────

message StockedProductListFilter {
  // The building. Required — "what is in stock" has no answer until somebody says where.
  uint64 warehouse_id = 1 [(buf.validate.field).uint64.gt = 0];

  // Narrow to these products, if given. 0 entries = no narrowing.
  //
  // This is how SEARCH survives an inventory-owned list: product names and codes live in the
  // catalogue, which this service cannot see and must not join to (HARD RULE 3). So a caller with a
  // search term resolves it against product_service first and passes the matching ids here — the
  // paging still happens HERE, over the intersection, so the count stays true.
  //
  // ⚠ A caller doing that must say when its own resolve was capped. This service reports honestly on
  // whatever set it is given; it cannot know the ids it was handed were the first N of many.
  repeated uint64 product_ids = 2 [(buf.validate.field).repeated = {
    max_items: 500
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

message StockedProductListRequest {
  // Read: the SELLING side, scoped to the caller's own team — StockAvailability's policy exactly, and
  // for the same reason. This answers "what could I put on an order from this warehouse", so anyone
  // who could place that order may ask, and nobody else.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (warehouse.role_base.v1.use_scope) = true,
    (buf.validate.field).uint64.gt = 0
  ];
  StockedProductListFilter filter = 2 [(buf.validate.field).required = true];
  warehouse.common.v1.CommonPagination page = 3 [(buf.validate.field).required = true];
}

message StockedProductListItem {
  uint64 product_id = 1;
  // What a pick would find, summed over every place in the warehouse. Always > 0 here.
  int64 available = 2;
}

message StockedProductListResponse {
  // Only products the warehouse actually HOLDS — `on_hand > 0`, and that is not a filter the caller
  // can turn off. A product with nothing on the shelf is not something this warehouse can sell, and
  // listing it only to have the order form refuse it later is a row that wastes somebody's click.
  repeated StockedProductListItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// ── The READ half of StockPick ────────────────────────────────────────────────────────────────────

message StockAvailabilityRequest {
  // Read, and it carries StockPick's policy and StockPick's scoping EXACTLY — the selling team's
  // people, scoped to their own team, with the warehouse as an ordinary parameter. That is not
  // convenience: this answers "what would a pick from this warehouse find", so anything that could
  // pick must be able to ask, and nothing that could not pick should be able to.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // The SELLING team about to place the order — the caller must have a role here.
  uint64 team_id = 1 [
    (warehouse.role_base.v1.use_scope) = true,
    (buf.validate.field).uint64.gt = 0
  ];

  // The warehouse the order would ship from. An ordinary parameter, exactly as on StockPick.
  uint64 warehouse_id = 2 [(buf.validate.field).uint64.gt = 0];

  repeated uint64 product_ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

message StockAvailabilityItem {
  uint64 product_id = 1;
  // What a pick would find RIGHT NOW: this warehouse's on-hand for the product, summed across every
  // place in it — unplaced and shelved alike, because pickOneLine drains all of them.
  int64 available = 2;
}

message StockAvailabilityResponse {
  // One entry per product ASKED ABOUT, including the ones with nothing — unlike the "absent means
  // zero" convention elsewhere. A screen that is deciding whether it may promise goods to a buyer must
  // not have to infer a zero from a gap, because the same gap is what a partial answer looks like.
  repeated StockAvailabilityItem items = 1;
}

// What one product cost a warehouse, per unit.
message StockCostLine {
  uint64 product_id = 1;
  // Exact rupiah, as stored. 0 means UNKNOWN — the warehouse has no restock history for this product — not free.
  double unit_cost = 2;
}

// The warehouse roles read it too: its one caller is the warehouse product page (/inventories/products/:id), and
// RackDetail and RackStock already answer every warehouse role the same average for a shelf. A warehouse caller reads
// ITS OWN building only — filter.warehouse_id must be its team_id (the handler refuses another).
message StockCostRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  StockCostFilter filter = 2 [(buf.validate.field).required = true];
  repeated StockCostDataType data_request = 3;
}

message StockCostFilter {
  uint64 warehouse_id = 1 [(buf.validate.field).uint64.gt = 0];
  repeated uint64 ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

enum StockCostDataType {
  STOCK_COST_DATA_TYPE_UNSPECIFIED = 0;
  STOCK_COST_DATA_TYPE_GENERAL = 1;
  STOCK_COST_DATA_TYPE_COST = 2;
}

// The COST slice reuses StockCostLine, keyed by product_id.
message StockCostLineMapItem {
  map<uint64, StockCostLine> map_data = 1;
}

message StockCostResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    StockCostLineMapItem cost = 2;
  }
}

message StockCostResponseList {
  repeated StockCostResponseItem items = 1;
}

message StockCostResponse {
  map<uint64, StockCostResponseList> items = 1;
}

// ── What a take WOULD draw ───────────────────────────────────────────────────────────────────────

message StockTakeQuoteRequest {
  // Read: StockCost's policy exactly — whoever may place an order may ask what its lines would cost.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // The ORDERING team — the take's own scope (the-take-names-the-orderer-and-each-owner). Which batches a line draws
  // is decided by the product's OWNER, not by this team.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // The warehouse the order would ship from. An ordinary parameter, as on the take.
  uint64 warehouse_id = 2 [(buf.validate.field).uint64.gt = 0];

  // Each product once, as the take wants them — a product listed twice is refused (InvalidArgument), as the take
  // refuses it. A form holding one product on two lines asks for their sum.
  repeated StockTakeQuoteLine lines = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// StockTakeQuoteLine is one product the order would take, and how many.
message StockTakeQuoteLine {
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
  int64 quantity = 2 [(buf.validate.field).int64.gt = 0];
}

// StockTakeQuoteBatch is one batch the take would draw from: `quantity × unit_cost`.
message StockTakeQuoteBatch {
  int64 quantity = 1;
  // The value per unit this batch would give up — its own, never the shelf's average. Rupiah (rupiah-is-floating-point).
  double unit_cost = 2;
  // quantity × unit_cost, as the take would remove it (the emptying take removes the batch's whole value).
  double total = 3;
}

// StockTakeQuoteItem is one line's answer.
message StockTakeQuoteItem {
  uint64 product_id = 1;
  // Whose batches the take draws — the product's owner. 0 = a product that exists nowhere.
  uint64 owner_team_id = 2;
  // As asked.
  int64 quantity = 3;
  // The units the take could draw for this order: the owner's units in the warehouse. 0 for a line the take would
  // refuse whatever the stock — a product that exists nowhere, another team's private product, or one whose owner is
  // below its reserve.
  int64 available = 4;
  // available >= quantity. When false the take would refuse the line, and draws NOTHING for it.
  bool enough = 5;
  // The value of the units the take would draw, rupiah. ABSENT when `enough` is false — the take draws nothing, so the
  // cost is unknown, never 0.
  optional double total_cost = 6;
  // total_cost ÷ quantity. Absent with it.
  optional double unit_cost = 7;
  // The batches behind total_cost, oldest first. Empty when `enough` is false.
  repeated StockTakeQuoteBatch batches = 8;
}

message StockTakeQuoteResponse {
  // One per line asked, in product id order. The COST, never the markup: the form applies a borrowed product's own
  // cross markup for the invoice, as the take does.
  repeated StockTakeQuoteItem items = 1;
}

// StockPickLocations answers the pick screen's only hard question (#151): WHICH SHELF does the picker
// walk to, when a product can sit on several racks (#135)?
//
// It answers from the LEDGER, not from current stock levels — and that distinction is the whole design.
// The order's stock was already drawn at placement (#149), and StockPick recorded, per rack, exactly how
// much it took from each. Those movements are what this order HOLDS. Current levels are a different
// question ("what is on that shelf now") whose answer keeps moving: another order draws from the same
// rack, a stock-take shifts goods, and a screen built on levels would send the picker to a shelf whose
// goods are earmarked for somebody else. The ledger cannot drift like that, because it is a record of
// what happened rather than a snapshot of what is.
//
// So the shelf column is not a suggestion the screen computes. It is what the system already committed.
message StockPickLocationsRequest {
  // Read: the WAREHOUSE crew — the people who walk to the shelf. Scoped to the warehouse, like the rest
  // of the crew's work (#150), because the crew holds no role in the selling team that placed the order.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 warehouse_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // The take's inventory transaction — the order's `transaction_id`
  // (the-placement-page-reads-racks-by-transaction-id). The take runs before the order exists and is filed under the
  // order's key, so the order keeps the transaction id for exactly this read. Naming the transaction rather than the
  // order keeps inventory_service ignorant of what a selling order IS. Read only within `warehouse_id`: one building
  // never reads another's take.
  uint64 transaction_id = 3 [(buf.validate.field).uint64.gt = 0];

  // `ref` was the pick's string reference — first `order:<id>`, then the order's idempotency key. Replaced by
  // transaction_id (backlog #10 slice 6).
  reserved 2;
  reserved "ref";
}

// One product, on one rack, in the quantity taken FROM THAT RACK for this pick.
//
// A product drawn from two shelves appears TWICE — once per shelf — rather than once with a chosen
// shelf. #151 asked for "a shelf, or all of them with quantities, rather than silently picking one";
// this is the second, and it is the only honest answer when the goods genuinely are in two places. The
// screen groups them under the product.
message StockPickLocation {
  uint64 product_id = 1;

  // The shelf. 0 means UNPLACED — stock that was never shelved (#135), which is a real place in this
  // system and not a missing value. The screen says so in words rather than showing a blank, because a
  // blank reads as "we do not know" when the truth is "it is not on a shelf yet".
  uint64 rack_id = 2;
  string rack_code = 3;

  // How much to take from THIS shelf. Positive.
  int64 quantity = 4;

  // 5 was `counting_session_id`: the pick on a shelf a count held WAITED for it. No order is taken from a counted shelf
  // any more (a-lock-stops-sales-and-cancels-too), so there is nothing to wait for — an order taken before the count
  // began is picked as usual, which the count then reads as a match, not a false surplus.
  reserved 5;
  reserved "counting_session_id";
}

message StockPickLocationsResponse {
  // Ordered product, then the UNPLACED pile, then shelves by label — the same order StockPick drained
  // in (#149), so the list reads as the walk the system already planned.
  //
  // UNPAGINATED, deliberately, and this is the HARD RULE 9 exemption stated out loud: it is bounded by
  // ONE pick's committed movements — an order's lines, each on a handful of shelves — not by a table
  // that grows. It is a detail-of-one-entity read, the same category as RestockRequestDetail's items.
  // The moment it could serve many picks at once it stops being exempt and takes a page filter.
  repeated StockPickLocation locations = 1;
}

// WarehouseProductList — DELETED (warehouse-product-list-is-deleted). The RPC listed what a warehouse was ASKED to
// hold (the `warehouse_products` arrangement a restock or a transfer writes, which stays); no screen called it once a
// warehouse's Products became what it holds. Protobuf cannot reserve a service method or a message NAME, so the two
// messages stay as empty tombstones: their names cannot be defined again, and every field number and name they had is
// reserved. Its `WarehouseProductListDataType` enum and `WarehouseProductListResponseItem` are gone with it.
message WarehouseProductListRequest {
  reserved 1, 2, 3;
  reserved "warehouse_id", "data_request", "page";
}

message WarehouseProductListResponse {
  reserved 1, 2, 3;
  reserved "items", "ids", "page_info";
}

// WarehouseProductSearch — a warehouse picks ONLY what it has held (a-warehouse-picks-only-what-it-has-held).
//
// The set searched is every product with a BATCH in this warehouse — any team's, emptied ones included, since a batch is
// never deleted — which is exactly what a found or a count can take (a-found-never-stocked-here-is-refused-at-the-report,
// a-unit-never-stocked-here-comes-in-by-restock), and nothing the warehouse does not already see on its own shelves.
// ProductDiscover is NOT widened: a warehouse never browses every team's catalogue.
//
// Owned HERE, not by the catalogue, because the filter that defines the set — "has had a batch in this building" — is
// inventory's fact, and the filter has to be applied where the paging happens. The names and codes stay product_service's:
// inventory hands it the held ids in-process and it searches among them, so no id list ever travels from the browser and
// no product name is mirrored here (HARD RULE 3). An archived product is in, flagged — a warehouse still finds what its
// seller archived while units of it sit here (an-archived-product-held-here-can-be-picked).
message WarehouseProductSearchRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 warehouse_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  WarehouseProductSearchFilter filter = 2 [(buf.validate.field).required = true];
  // Which slices to load per product. Empty defaults to the PRODUCT (row) slice.
  repeated WarehouseProductSearchDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message WarehouseProductSearchFilter {
  // A name or a product code, or part of one — matched anywhere, case-insensitive. At least 2 characters after the server
  // trims it: a picker searches only what is typed, and one letter matches most of a warehouse.
  string q = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 100
  }];
}

enum WarehouseProductSearchDataType {
  WAREHOUSE_PRODUCT_SEARCH_DATA_TYPE_UNSPECIFIED = 0;
  WAREHOUSE_PRODUCT_SEARCH_DATA_TYPE_GENERAL = 1;
  WAREHOUSE_PRODUCT_SEARCH_DATA_TYPE_PRODUCT = 2;
}

// WarehouseProductSearchItem is the PRODUCT slice — what a picked product snapshots, and its OWNER, so two teams'
// same-named products are told apart (the code carries the team's code too).
message WarehouseProductSearchItem {
  uint64 id = 1;
  // The selling team that owns it — a warehouse holds other teams' goods. The picker names it through TeamByIds.
  uint64 team_id = 2;
  // As on Product: the composed `<team_code>-<part>`.
  string product_code = 3;
  string name = 4;
  // Its seller archived it. Still offered here (an-archived-product-held-here-can-be-picked): archiving retires it from
  // the catalogue, not its units from the shelf. The picker labels it.
  bool archived = 5;
}

message WarehouseProductSearchMapItem {
  map<uint64, WarehouseProductSearchItem> map_data = 1;
}

message WarehouseProductSearchResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    WarehouseProductSearchMapItem product = 2;
  }
}

message WarehouseProductSearchResponse {
  repeated WarehouseProductSearchResponseItem items = 1;
  // The product ids in order — by name, then product code — the authoritative ordering of the page.
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// WarehouseStockList — the Stock screen lists what the warehouse has held (the-stock-screen-lists-what-the-warehouse-has-held).
//
// The set is WarehouseProductSearch's: every product with a BATCH in this warehouse — any team's, emptied ones included,
// archived ones flagged. A warehouse owns no products (the selling teams do), so its own catalogue is not the list; what it
// holds and has held is. A product emptied to 0 stays on the list, so it can still be found and adjusted.
//
// Two halves, each over its own rows (HARD RULE 3): inventory reads which products have been here and their units on hand
// (the placement ledger, summed as StockList sums it); product_service names, searches and orders them among the held
// ids, in-process — so the page, its order and its total are one statement's, and no product name is mirrored here.
message WarehouseStockListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 warehouse_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  WarehouseStockListFilter filter = 2;
  // Which slices to load per product. Empty defaults to the PRODUCT and STOCK slices — a row of the screen.
  repeated WarehouseStockListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message WarehouseStockListFilter {
  // A name or a product code, or part of one — matched anywhere, case-insensitive. EMPTY lists every product held here;
  // otherwise at least 2 characters after the server trims it (else InvalidArgument), as the picker's term.
  string q = 1 [(buf.validate.field).string.max_len = 100];
}

enum WarehouseStockListDataType {
  WAREHOUSE_STOCK_LIST_DATA_TYPE_UNSPECIFIED = 0;
  WAREHOUSE_STOCK_LIST_DATA_TYPE_GENERAL = 1;
  // WarehouseProductSearchItem per product: id, its OWNER team, product code, name, archived.
  WAREHOUSE_STOCK_LIST_DATA_TYPE_PRODUCT = 2;
  // StockLevel per product: its units on hand in this warehouse — its rows on every rack, summed; 0 when none.
  WAREHOUSE_STOCK_LIST_DATA_TYPE_STOCK = 3;
}

message WarehouseStockListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    WarehouseProductSearchMapItem product = 2;
    StockLevelMapItem stock = 3;
  }
}

message WarehouseStockListResponse {
  repeated WarehouseStockListResponseItem items = 1;
  // The product ids in order — by name, then product code, then id — the authoritative ordering of the page.
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// ProductPlaces answers "WHICH SHELVES ALREADY HOLD THIS PRODUCT, and how many are on each" (#156).
//
// It is the Accept screen's recommendation: a person putting a delivery away should add to the shelf
// the product already lives on rather than starting a second pile of the same thing in a different
// aisle. Two piles of one product is how a warehouse ends up walking past stock it has.
//
// The inverse of RackStock (#138), which asks "what is on A-01-3". Neither existing read answers this:
// StockList is per product SUMMED across racks and deliberately carries no rack (#135), and
// StockPickLocations reads the LEDGER for one pick rather than current levels.
message ProductPlacesRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 warehouse_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  ProductPlacesFilter filter = 2 [(buf.validate.field).required = true];
  repeated ProductPlacesDataType data_request = 3;
}

message ProductPlacesFilter {
  repeated uint64 ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
  }];
}

enum ProductPlacesDataType {
  PRODUCT_PLACES_DATA_TYPE_UNSPECIFIED = 0;
  PRODUCT_PLACES_DATA_TYPE_GENERAL = 1;
  PRODUCT_PLACES_DATA_TYPE_PLACE = 2;
}

// A product sits on several racks, so the PLACE slice maps by rack_id within each product entry.
message ProductPlaceMapItem {
  map<uint64, ProductPlace> map_data = 1;
}

message ProductPlacesResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    ProductPlaceMapItem place = 2;
  }
}

message ProductPlacesResponseList {
  repeated ProductPlacesResponseItem items = 1;
}

// One product, on one shelf, and how many sit there right now.
message ProductPlace {
  uint64 product_id = 1;

  // 0 means the UNPLACED PILE (#135) — and it belongs in this answer as much as any shelf. "There are
  // already 12 of these unshelved" is exactly what stops someone starting a second pile.
  uint64 rack_id = 2;
  string rack_code = 3;

  int64 on_hand = 4;
}

message ProductPlacesResponse {
  map<uint64, ProductPlacesResponseList> items = 1;
}

// A batch as the batch screens read it (#209) — one product's units from one delivery, a cost layer.
// The identity/receipt/supplier come from the delivery it was accepted on; product code/name are the line's
// snapshot; Ready/Used are derived from the shelf_batch rows.
message StockBatch {
  uint64 id = 1;
  // The delivery's display number (the restock request id) and receipt (GRN), searchable together.
  uint64 delivery_id = 2;
  string receipt_no = 3;

  uint64 product_id = 4;
  string product_code = 5;
  string name = 6;
  // The delivery's supplier — opaque id; 0 when none was recorded. Name resolved client-side.
  uint64 supplier_id = 7;

  // ⚠ Frozen HPP. `cost_known = false` means UNKNOWN, not free (#74) — `unit_cost` is then 0 and every
  // value below is 0, which a screen must render as "Unknown" rather than a real Rp 0.
  double unit_cost = 8;
  bool cost_known = 9;

  // Arrived = broken + lost + used + ready. Ready = Σ shelf_batch.qty; used = the remainder. Damaged
  // stock is split into two reasons (#218): broken (physically damaged) and lost (missing/shrinkage).
  int64 arrived = 10;
  int64 broken = 11;
  int64 used = 12;
  int64 ready = 13;
  int64 lost = 21;

  // What ARRIVED was worth at the price the batch was ACCEPTED at (the supplier invoice) — a price correction since never
  // reprices it (a-late-cost-is-an-expense-not-a-revaluation: it changes the units left only) — and what is still on the
  // shelf is worth now (`batches.stock_valuation`, at the current `unit_cost`).
  double line_cost = 14;
  double ready_value = 15;

  // 0 = does not expire (perishables only). The screen flags amber when it is within the soon window.
  int64 expires_on_unix = 16;

  int64 created_at_unix = 17;
  int64 accepted_at_unix = 18;
  uint64 created_by = 19;
  uint64 accepted_by = 20;

  // How this batch came to exist (#218): a normal restock delivery, or stock coming BACK as a return.
  // UNSPECIFIED reads as a restock (the default origin) until the projection sets it.
  BatchOrigin origin = 22;

  // WHICH BUILDING holds it (#232). The warehouse's own lists never needed it — they are scoped to one
  // warehouse, so every row's answer is the same. The OWNER's list spans every warehouse holding its
  // goods, and there "which delivery" is only half a location.
  uint64 warehouse_id = 23;
}

// Where a batch's units originated (#218) — a restock delivery, or a return.
enum BatchOrigin {
  BATCH_ORIGIN_UNSPECIFIED = 0; // treated as RESTOCK by the UI
  BATCH_ORIGIN_RESTOCK = 1;
  BATCH_ORIGIN_RETURN = 2;
}

// Narrows a batch list by expiry (#209) — the warehouse list's "Expiring ≤ 30 days / No expiry" filter.
enum BatchExpiryFilter {
  BATCH_EXPIRY_FILTER_UNSPECIFIED = 0;
  BATCH_EXPIRY_FILTER_EXPIRING_SOON = 1;
  BATCH_EXPIRY_FILTER_NO_EXPIRY = 2;
}

message BatchListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  BatchListFilter filter = 2;
  repeated BatchListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message BatchListFilter {
  uint64 product_id = 1;
  string search = 2;
  uint64 supplier_id = 3;
  BatchExpiryFilter expiry = 4 [(buf.validate.field).enum.defined_only = true];
  BatchDateField date_field = 5 [(buf.validate.field).enum.defined_only = true];
  int64 from_unix = 6;
  int64 to_unix = 7;
}

enum BatchListDataType {
  BATCH_LIST_DATA_TYPE_UNSPECIFIED = 0;
  BATCH_LIST_DATA_TYPE_GENERAL = 1;
  BATCH_LIST_DATA_TYPE_BATCH = 2;
}

message BatchMapItem {
  map<uint64, StockBatch> map_data = 1;
}

message BatchListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    BatchMapItem batch = 2;
  }
}

// Which date a BatchList date range applies to (#217).
enum BatchDateField {
  BATCH_DATE_FIELD_UNSPECIFIED = 0; // no date range
  BATCH_DATE_FIELD_ARRIVED = 1; // when the delivery was accepted
  BATCH_DATE_FIELD_EXPIRING = 2; // the batch's expiry date
}

message BatchListResponse {
  repeated BatchListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
  double ready_value_total = 4;
  uint64 expiring_soon_count = 5;
}

// One row of the PRICES tab (#209) — stock value by cost price. Batches that froze the same unit cost
// form one cost layer; FIFO draws the oldest batch, but the value view groups by price.
message CostLayer {
  // ⚠ cost_known = false is UNKNOWN, not free (#74): unit_cost is then 0 and amount is 0, which the
  // screen renders "Unknown" — a real Rp 0 layer cannot happen (a batch with no cost has no value).
  double unit_cost = 1;
  bool cost_known = 2;
  // Ready units carrying this cost, across every shelf.
  int64 on_hand = 3;
  // on_hand × unit_cost, exact.
  double amount = 4;
}

message CostLayerListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  CostLayerListFilter filter = 2 [(buf.validate.field).required = true];
  repeated CostLayerListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message CostLayerListFilter {
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
}

enum CostLayerListDataType {
  COST_LAYER_LIST_DATA_TYPE_UNSPECIFIED = 0;
  COST_LAYER_LIST_DATA_TYPE_GENERAL = 1;
  COST_LAYER_LIST_DATA_TYPE_LAYER = 2;
}

// CostLayer has no id of its own; the response keys layers by 1-based FIFO position and ids carries
// that order.
message CostLayerMapItem {
  map<uint64, CostLayer> map_data = 1;
}

message CostLayerListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    CostLayerMapItem layer = 2;
  }
}

message CostLayerListResponse {
  repeated CostLayerListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
  double total_value = 4;
}

// One row of the PLACEMENT tab (#209) — a product on one shelf, and when it last moved. The dates flag
// a shelf overdue for a stock-take: a stale Last opname is amber on screen.
message ProductPlacement {
  // 0 = the unplaced/holding pile (#135). The frontend resolves the rack CODE.
  uint64 rack_id = 1;
  int64 on_hand = 2;

  // Last time stock LEFT this shelf, arrived ON it, and was COUNTED on it (unix; 0 = never).
  int64 last_out_unix = 3;
  int64 last_in_unix = 4;
  int64 last_opname_unix = 5;
}

message PlacementListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  PlacementListFilter filter = 2 [(buf.validate.field).required = true];
  repeated PlacementListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message PlacementListFilter {
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
}

enum PlacementListDataType {
  PLACEMENT_LIST_DATA_TYPE_UNSPECIFIED = 0;
  PLACEMENT_LIST_DATA_TYPE_GENERAL = 1;
  PLACEMENT_LIST_DATA_TYPE_PLACEMENT = 2;
}

// The PLACEMENT slice reuses ProductPlacement, keyed by rack_id.
message ProductPlacementMapItem {
  map<uint64, ProductPlacement> map_data = 1;
}

message PlacementListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    ProductPlacementMapItem placement = 2;
  }
}

message PlacementListResponse {
  repeated PlacementListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message ProductStockSummaryRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// The Info tab's stat tiles (#209). The tiles this service can answer on its own — order and return
// links belong to other services and are resolved by the page separately.
message ProductStockSummaryResponse {
  // READY — on hand now, across every shelf, and its value (known-cost layers only, #74).
  int64 ready_qty = 1;
  double ready_value = 2;

  // ONGOING — inbound on pending restocks not yet accepted, and the estimated cost of those lines.
  int64 ongoing_qty = 3;
  double ongoing_value_est = 4;

  // When the product was last counted on any shelf here (last ADJUST); 0 = never counted.
  int64 last_counted_unix = 5;

  // The most recent delivery of this product (its restock/delivery id); 0 = never delivered here.
  uint64 last_restock_id = 6;
}

message BatchDetailRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 batch_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message BatchDetailResponse {
  StockBatch batch = 1;

  // Return summary for this batch (#218) — how many of its units came BACK (RETURN movements) and when
  // the last one did. `returned_qty` 0 / `last_return_unix` 0 = nothing has been returned. Aggregated
  // server-side over the batch's RETURN movements (the ledger is paginated, so the client cannot total
  // it itself).
  int64 returned_qty = 2;
  int64 last_return_unix = 3;

  // WHAT EACH FIGURE WAS WORTH, from its own rows — never re-priced at today's `unit_cost`: a price correction reprices
  // only the units left (a-late-cost-is-an-expense-not-a-revaluation). Rusak and Hilang are the door's problem rows'
  // totals (`restock_problem_items.total`, the landed price); Terpakai is what the batch's own rows took out, each unit
  // at the price it left at (the accepted value, plus every correction, less what is left).
  double broken_value = 4;
  double lost_value = 5;
  double used_value = 6;

  // THE PRICE WAS CORRECTED (BatchRevalue) — the batch's newest correction's price BEFORE it: the screen's *dikoreksi dari
  // Rp …* under the unit price. `price_corrected` false = never corrected (a batch may be accepted at Rp 0).
  bool price_corrected = 7;
  double price_corrected_from = 8;
}

// Where a batch's ready units sit right now (#209) — the batch-detail Placements tab.
message BatchShelf {
  uint64 rack_id = 1; // 0 = unplaced
  int64 qty = 2;
  // When this shelf was last COUNTED (last ADJUST on it); unix, 0 = never. A stale value flags a shelf
  // overdue for a stock-take (opname) — amber on screen, the same rule as the product placement tab.
  int64 last_opname_unix = 3;
}

message BatchPlacementListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  BatchPlacementListFilter filter = 2 [(buf.validate.field).required = true];
  repeated BatchPlacementListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message BatchPlacementListFilter {
  uint64 batch_id = 1 [(buf.validate.field).uint64.gt = 0];
}

enum BatchPlacementListDataType {
  BATCH_PLACEMENT_LIST_DATA_TYPE_UNSPECIFIED = 0;
  BATCH_PLACEMENT_LIST_DATA_TYPE_GENERAL = 1;
  BATCH_PLACEMENT_LIST_DATA_TYPE_SHELF = 2;
}

// The SHELF slice reuses BatchShelf, keyed by rack_id (0 = unplaced).
message BatchShelfMapItem {
  map<uint64, BatchShelf> map_data = 1;
}

message BatchPlacementListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    BatchShelfMapItem shelf = 2;
  }
}

message BatchPlacementListResponse {
  repeated BatchPlacementListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// The goods-received receipt for one DELIVERY (#219) — the printable document behind a batch. A
// delivery spans several products, so the receipt lists them all; a batch's "Print receipt" opens this
// with that product's line highlighted (the frontend does the highlight from `batch_id`).
//
// It is assembled from the delivery's batches (stock_batches grouped by delivery_id): the stock service
// owns the acceptance/cost projection, so it owns the receipt. Bounded by one delivery's product count,
// so it does NOT paginate.
message BatchReceiptRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The delivery = the restock request id (the batch's delivery_id).
  uint64 delivery_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// One product line on the receipt. Accepted = arrived − damaged: only accepted units entered stock and
// froze their cost; damaged units never became stock. Line cost is what the supplier invoiced.
message BatchReceiptLine {
  uint64 batch_id = 1;
  uint64 product_id = 2;
  string product_code = 3;
  string name = 4;
  int64 arrived = 5;
  int64 damaged = 6;
  int64 accepted = 7; // arrived − damaged
  double unit_cost = 8;
  bool cost_known = 9; // false → cost UNKNOWN, render "Unknown" not Rp 0 (#74)
  double line_cost = 10; // arrived × unit_cost
  // Where this batch's units were put away — 0 = the unplaced pile. A line can span shelves.
  repeated uint64 rack_ids = 11;
}

message BatchReceiptResponse {
  uint64 delivery_id = 1;
  string receipt_no = 2;
  uint64 supplier_id = 3; // name resolved client-side
  uint64 warehouse_id = 4; // the destination warehouse (a team) — name resolved client-side
  int64 arrived_at_unix = 5; // when the delivery was accepted
  // The two distinct actors: who RAISED the restock, and who ACCEPTED the delivery. Names client-side.
  uint64 created_by = 6;
  uint64 accepted_by = 7;
  repeated BatchReceiptLine lines = 8;
  int64 total_accepted = 9; // Σ accepted
  double total_value = 10; // Σ line_cost over known-cost lines only (#74)
}

// ── OwnerStock — the selling team's own stock, across the warehouses holding it ───────────────────

// OwnerStockItem is everything the owner's product list shows for ONE product. Read together because
// they are read together: a row that had to make five calls to fill itself would make five hundred on
// a page of a hundred.
message OwnerStockItem {
  // READY — units on a shelf, sellable now, and what they COST US (`ready_value`). Value counts
  // known-cost layers only (#74): a batch whose cost never got recorded adds units without adding
  // money, because valuing it at 0 would quietly understate the stock.
  int64 ready_qty = 1;
  double ready_value = 2;

  // ONGOING — ordered on restocks the warehouse has not accepted yet, and what those lines are
  // expected to cost. An ESTIMATE until the goods land: the cost settles on what actually arrives
  // (#74), which is why it is never added to ready_value.
  int64 ongoing_qty = 3;
  double ongoing_value_est = 4;

  // The HPP SPREAD of the ready units — cheapest and dearest unit cost still on a shelf. A range, not
  // an average, because the same product genuinely arrives at different prices and the average is
  // exactly what hides that.
  //
  // `cost_known` is false when NO ready unit has a recorded cost; the two figures are then 0 and mean
  // nothing. Without it a caller cannot tell "we do not know" from "it cost nothing".
  double cost_min = 5;
  double cost_max = 6;
  bool cost_known = 7;

  // When the OLDEST units still on a shelf arrived. 0 = nothing on hand. This is what finds stock that
  // has stopped moving, so it is the oldest batch with READY units, not the oldest batch ever.
  int64 oldest_batch_unix = 8;

  // When stock last ARRIVED for this product. 0 = never.
  int64 last_restock_unix = 9;
}

message OwnerStockMapItem {
  map<uint64, OwnerStockItem> map_data = 1;
}

enum OwnerStockDataType {
  OWNER_STOCK_DATA_TYPE_UNSPECIFIED = 0;
  // STOCK: the OwnerStockItem above — the only slice so far, and the default.
  OWNER_STOCK_DATA_TYPE_STOCK = 1;
}

// OwnerStockByIdsFilter carries the NON-scope inputs. The scoped team_id stays top-level.
message OwnerStockByIdsFilter {
  // The products to answer for — the ids the caller already holds from its own ProductList. It does
  // not page for the same reason ProductByIds does not: the caller supplies the set, so the response
  // can never exceed the ask, and max_items is what stops this becoming a bulk export.
  repeated uint64 product_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];

  // The WAREHOUSE LENS. 0 = every warehouse holding this team's goods (the total). Set it and every
  // figure describes that one building — which is the honest reading, because stock is held per
  // warehouse and a total can never tell you whether ONE of them can fill an order.
  uint64 warehouse_id = 2;
}

message OwnerStockByIdsRequest {
  // Read: the SELLING side. A warehouse is deliberately absent — it has its own screens for what it
  // holds, and this one answers "what do I own", which is not a question a warehouse asks.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // The OWNING team — both the authorization scope and the filter. Unlike ProductByIds, where team_id
  // only authorizes, here it also decides which stock is yours: the join runs through
  // restock_requests.requesting_team_id, so this is the same team twice on purpose.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  OwnerStockByIdsFilter filter = 2 [(buf.validate.field).required = true];
  // Which slices to load per product. Empty defaults to STOCK.
  repeated OwnerStockDataType data_request = 3;
}

message OwnerStockByIdsResponseItem {
  oneof d {
    OwnerStockMapItem stock = 1;
  }
}

message OwnerStockByIdsResponseList {
  repeated OwnerStockByIdsResponseItem items = 1;
}

message OwnerStockByIdsResponse {
  // Keyed by product id. A product with no stock anywhere is ABSENT rather than a row of zeros — the
  // caller already knows which ids it asked about, and "nothing to say" travels lighter.
  map<uint64, OwnerStockByIdsResponseList> items = 1;
}

// OwnerStockPreview is the STAT above the product list — the same facts as OwnerStockItem, summed
// over the whole catalogue rather than per product.
//
// The cost SPREAD is deliberately absent: cheapest-to-dearest across every product in a catalogue is
// a number about nothing.
message OwnerStockPreview {
  int64 ready_qty = 1;
  double ready_value = 2;
  int64 ongoing_qty = 3;
  double ongoing_value_est = 4;
  // The last time ANY of this team's stock arrived. 0 = never.
  int64 last_restock_unix = 5;
}

message OwnerStockStatFilter {
  // Same lens as the list — 0 = every warehouse.
  uint64 warehouse_id = 1;
}

message OwnerStockStatRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OwnerStockStatFilter filter = 2;
}

message OwnerStockStatResponse {
  OwnerStockPreview preview = 1;
}

// ── The owner's row-level reads (#232) ────────────────────────────────────────────────────────────
//
// Three lists behind the product detail's Price, Batch and Stock history tabs. Each mirrors a
// warehouse-side read — CostLayerList, BatchList, StockHistory — with two differences that are the
// whole point:
//
//  1. `team_id` is the SELLING team, and it both authorizes and filters. Ownership runs through
//     stock_batches → restock_request_items → restock_requests.requesting_team_id, so another team's
//     product id matches no rows rather than returning their numbers.
//  2. A `warehouse_id` LENS instead of a warehouse scope. 0 = every building holding these goods,
//     which is the reading an owner actually wants: the warehouse-side reads can only ever answer for
//     the building the caller stands in.

message OwnerCostLayerListFilter {
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
  // 0 = every warehouse. Set it and the layers describe one building's shelves.
  uint64 warehouse_id = 2;
}

message OwnerCostLayerListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OwnerCostLayerListFilter filter = 2 [(buf.validate.field).required = true];
  repeated OwnerCostLayerListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

enum OwnerCostLayerListDataType {
  OWNER_COST_LAYER_LIST_DATA_TYPE_UNSPECIFIED = 0;
  OWNER_COST_LAYER_LIST_DATA_TYPE_GENERAL = 1;
  OWNER_COST_LAYER_LIST_DATA_TYPE_LAYER = 2;
}

message OwnerCostLayerListResponse {
  // Reuses CostLayer — an owner's layer and a warehouse's layer are the same fact about the same
  // units, and giving the owner its own near-identical message is how two screens start disagreeing
  // about what a cost layer is. Keyed by 1-based position, dearest first, Unknown last.
  repeated CostLayerListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
  // Values the KNOWN-cost layers only (#74) — an unknown layer is worth "Unknown", never 0.
  double total_value = 4;
}

message OwnerBatchListFilter {
  uint64 product_id = 1;
  // 0 = every warehouse.
  uint64 warehouse_id = 2;
}

message OwnerBatchListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OwnerBatchListFilter filter = 2 [(buf.validate.field).required = true];
  repeated OwnerBatchListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

enum OwnerBatchListDataType {
  OWNER_BATCH_LIST_DATA_TYPE_UNSPECIFIED = 0;
  OWNER_BATCH_LIST_DATA_TYPE_GENERAL = 1;
  OWNER_BATCH_LIST_DATA_TYPE_BATCH = 2;
}

message OwnerBatchListResponse {
  // Reuses StockBatch, whose warehouse_id (#232) carries the building each delivery landed in.
  repeated BatchListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
  // Over the whole filtered set, not the page. Known-cost batches only (#74).
  double ready_value_total = 4;
}

// OwnerMovement is one line of the owner's ledger (#232).
//
// It is deliberately NOT StockMovement. That message answers for a SHELF — its `balance` is the rack's
// running total and its `rack_id` is the point of the row — and an owner's lens has no racks in it: a
// shelf-to-shelf move inside one building changes nothing they own, and a rack's running total printed
// under a Warehouse column states a fact about a shelf as though it were about the building.
message OwnerMovement {
  uint64 id = 1;
  // The ledger row this projects. Stable across a rebuild of the projection.
  uint64 movement_id = 2;
  uint64 product_id = 3;
  uint64 warehouse_id = 4;
  // 0 = a batch-less event — a shelf recount reconciles the whole shelf and names no batch, though its
  // delta lands on the oldest batch underneath (FIFO). Those count as the owner's when the team owns
  // any batch of that product in that warehouse.
  uint64 batch_id = 5;
  MovementKind kind = 6;
  int64 delta = 7; // signed: + in, - out
  // The owner's on-hand of THIS PRODUCT IN THIS WAREHOUSE after the movement — a running sum over the
  // owner's own ledger, computed at read time rather than stored, so it can never drift from the rows
  // it is made of.
  int64 balance = 8;
  string reason = 9;
  string ref = 10;
  uint64 actor_user_id = 11;
  int64 created_at_unix = 12;
  // THE MOVE WAS AN OVERRIDE — as StockMovement.is_override: `inventory_transactions.is_override` of `movement_id`.
  bool is_override = 13;

  // THE BATCH'S PRICE AND VALUE ON THIS ROW — as StockMovement's three: the row's value change, the batch's unit price
  // after it, and before it (different only on a REVALUATION row — a price correction, BatchRevalue).
  double price_unit_before = 14;
  double price_unit_after = 15;
  double value_change = 16;

  // KOREKSI JUMLAH TERIMA — as StockMovement.received_count_correction.
  MovementCountCorrection received_count_correction = 17;
}

message OwnerStockHistoryFilter {
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
  // 0 = every warehouse.
  uint64 warehouse_id = 2;
  MovementKind kind = 3 [(buf.validate.field).enum.defined_only = true];
  int64 from_unix = 4;
  int64 to_unix = 5;
}

message OwnerStockHistoryRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OwnerStockHistoryFilter filter = 2 [(buf.validate.field).required = true];
  repeated OwnerStockHistoryDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

enum OwnerStockHistoryDataType {
  OWNER_STOCK_HISTORY_DATA_TYPE_UNSPECIFIED = 0;
  OWNER_STOCK_HISTORY_DATA_TYPE_GENERAL = 1;
  OWNER_STOCK_HISTORY_DATA_TYPE_MOVEMENT = 2;
}

message OwnerMovementMapItem {
  map<uint64, OwnerMovement> map_data = 1;
}

message OwnerStockHistoryResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    OwnerMovementMapItem movement = 2;
  }
}

message OwnerStockHistoryResponse {
  repeated OwnerStockHistoryResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// -------------------------------------------------------------------------- Koreksi Harga

// BatchRevalueRequest corrects one batch's unit price. WHO (the-owning-team-revalues-with-a-reason): the Owner or Admin of
// the team that OWNS the batch — `team_id`, scoped — plus Root and the System Administrator, stamped an override when
// outside it (an-override-is-stamped-in-every-service). Never the warehouse holding it, never CS, never a monitor.
// Another team's batch, or no such batch, is NotFound.
//
// Refused, nothing written: a reason that is empty or only spaces (InvalidArgument); a new price at or below Rp 0
// (a-corrected-price-is-above-zero, InvalidArgument); and, under the batch's row lock, a batch with no units left, a
// price that moved since the form showed `expected_price_unit` (someone corrected it first), or the same price
// (FailedPrecondition each, naming the batch).
message BatchRevalueRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  // The OWNING team — the batch's `team_id` (a-batch-carries-its-owner), not the warehouse holding it.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 batch_id = 2 [(buf.validate.field).uint64.gt = 0];
  // The price the form SHOWED — an optimistic check: a batch whose price is no longer this (within 4 places) is refused,
  // so two people correcting at once cannot overwrite each other unseen. It also refuses a retry of a correction that
  // already landed.
  double expected_price_unit = 3 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // The new unit price — above Rp 0 (a-corrected-price-is-above-zero); a fraction is kept (rupiah-is-floating-point).
  double new_price_unit = 4 [(buf.validate.field).double = {
    gt: 0
    finite: true
  }];
  // WHY — required, at most 200 (trimmed on the server); written to the transaction and both log rows' `description`,
  // where the warehouse holding the batch reads it.
  string reason = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

message BatchRevalueResponse {
  // The `revaluation` transaction the correction wrote.
  uint64 transaction_id = 1;
  double price_unit_before = 2;
  double price_unit_after = 3;
  // units × (after − before): what the units left are worth more (or less, negative) — batch.md §Change Price Flow.
  double value_change = 4;
  // The units left, each repriced — unchanged by the correction.
  int64 units = 5;
}

// SupplierGoodsGroup — what one row of SupplierGoods is about: a supplier, one of its stores, or one warehouse its
// goods were received at.
enum SupplierGoodsGroup {
  SUPPLIER_GOODS_GROUP_UNSPECIFIED = 0;
  // One row per supplier — the supplier list and Discover.
  SUPPLIER_GOODS_GROUP_SUPPLIER = 1;
  // One row per supplier and store (store_id; 0 = a line that named the supplier and no store) — the Toko tab.
  SUPPLIER_GOODS_GROUP_STORE = 2;
  // One row per supplier and warehouse — Gudang terkait.
  SUPPLIER_GOODS_GROUP_WAREHOUSE = 3;
}

message SupplierGoodsRequest {
  // Read: the selling side, as the supplier pages are (only-a-selling-team-has-suppliers). The figures are every
  // team's, so team_id only authorizes — it never narrows them (every-selling-team-sees-every-teams-figures).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // The suppliers on screen — a list page, or the one supplier of a detail page.
  repeated uint64 supplier_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];

  SupplierGoodsGroup group = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// SupplierGoods — what one supplier's goods did, over all time, in one group. Bounded: a supplier has few stores and
// few warehouses, and the ids are capped at 100, so the response is not paged.
message SupplierGoods {
  uint64 supplier_id = 1;
  // The store, under SUPPLIER_GOODS_GROUP_STORE; 0 otherwise.
  uint64 store_id = 2;
  // The warehouse, under SUPPLIER_GOODS_GROUP_WAREHOUSE; 0 otherwise.
  uint64 warehouse_id = 3;

  // Terjual — every unit that went out on an order, all time; a cancelled order's units are counted back, since the
  // cancel puts them back into the batch they came from.
  int64 sold_units = 4;
  // The orders those units went out on (a cancelled one not counted) — "dari N transaksi".
  int64 orders = 5;
  // The newest order that took any of them and was not cancelled; 0 = none.
  int64 last_order_unix = 6;

  // Siap — units on a shelf now.
  int64 ready_units = 7;
  // Accepted restocks that received this supplier's goods; 0 = never (a transfer-in is not a restock).
  int64 restocks = 8;
  // The newest of them; 0 = never.
  int64 last_restock_unix = 9;
}

message SupplierGoodsResponse {
  // Only what has a figure: a supplier (store, warehouse) none of whose goods ever arrived is absent.
  repeated SupplierGoods rows = 1;
}
