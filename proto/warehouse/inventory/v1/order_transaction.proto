syntax = "proto3";

package warehouse.inventory.v1;

import "buf/validate/validate.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/inventory/v1;inventoryv1";

// OrderTransactionService is inventory's side of an order (docs/business/inventory/order.md §Inventory Service Flow When
// Order Created Called Our `OrderTransactionCreate`): the order's TAKE on the decided ledgers, and its RELEASE by the
// idempotency key.
//
// It is called by the order service while it creates an order, before the order exists, so inventory never learns an
// order id: the take and its release are found by the key K the order form minted for this submit
// (every-submit-mints-a-new-key, every-release-goes-by-the-key).
service OrderTransactionService {
  // The take: K looked up first (a used key is refused), the products read (a borrowed private product, or one whose
  // owner's total stock is below its reserve, is refused), then ONE transaction — batches oldest first, racks holding
  // the fewest first — that claims K. One order is ONE inventory transaction, of the ORDERING team, even across owners
  // (an-order-is-one-inventory-transaction, an-order-transaction-is-the-ordering-teams).
  //
  // A refusal is ONE error with one reason, naming every refused line (a-refusal-names-its-reason-and-every-line): the
  // Connect error carries an OrderTransactionRefusal detail.
  rpc OrderTransactionCreate(OrderTransactionCreateRequest) returns (OrderTransactionCreateResponse);

  // The release by K, for an order cancelled or a create that failed after the take (the-key-is-claimed-in-its-own-table):
  // K claimed with a transaction → that transaction is rolled back, once · claimed with none → nothing · not claimed
  // yet → claimed with none, so a take arriving late is refused.
  rpc OrderTransactionRelease(OrderTransactionReleaseRequest) returns (OrderTransactionReleaseResponse);

  // THE RETURN (return_decision.md): an order's returned parcel, accepted at the selling team's return warehouse
  // (only-the-return-warehouse-accepts-a-return), back on its shelves. ONE `return` transaction of the ORDERING team at
  // the return warehouse, per take, once (a second call answers the first one's transaction, posted = false):
  //
  //   sound     one batch minted per batch the take drew from, price, expiry and supplier kept — a borrowed line at the
  //             markup the team paid, under its mapped own product (a-return-mints-one-batch-per-batch-the-order-took) —
  //             onto the named racks of the return warehouse, its products linked there
  //   missing   a door row, off the NEWEST layer first (a-short-return-is-missing-at-the-door)
  //   broken    a door row, thrown away (a-broken-returned-unit-is-thrown-away-at-the-door)
  //
  // Door rows carry the crew's note (a-return-door-row-carries-an-optional-note) and are the selling team's: never the
  // warehouse's payable, never claimable, never Inventory Lost. A rack a stock count holds the product on, or a rack
  // that is not the return warehouse's, refuses the whole return (a-lock-stops-sales-and-cancels-too).
  rpc OrderTransactionReturn(OrderTransactionReturnRequest) returns (OrderTransactionReturnResponse);
}

// OrderTransactionLine is one product the order wants from the warehouse.
message OrderTransactionLine {
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
  int64 quantity = 2 [(buf.validate.field).int64.gt = 0];
}

message OrderTransactionCreateRequest {
  // Write: the SELLING team placing the order, the same roles that may create one. Scoped to the ORDERING team — any
  // team may draw stock from any warehouse, so the question is "are you a member of the team placing this order?".
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // The ORDERING team (the-take-names-the-orderer-and-each-owner) — the transaction's team.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // K, minted by the order form for this submit (every-submit-mints-a-new-key). Claimed once, in its own table.
  string idempotency_key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  uint64 warehouse_id = 3 [(buf.validate.field).uint64.gt = 0];

  // Each product once.
  repeated OrderTransactionLine lines = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
  }];
}

// OrderTransactionItem is one product as the take priced it.
message OrderTransactionItem {
  uint64 product_id = 1;
  // The product's OWNER — whose batches gave the units (an-item-carries-its-owning-team).
  uint64 owner_team_id = 2;
  int64 quantity = 3;
  // What the units cost — the value the owner's batches gave up, per unit.
  double unit_cost = 4;
  // For a borrowed line, the cost with the owner's markup (inventory-computes-the-markup); equal to unit_cost for the
  // ordering team's own product.
  double unit_cost_with_markup = 5;
  // total − unit_cost × quantity.
  double markup_total = 6;
  // unit_cost_with_markup × quantity.
  double total = 7;
}

message OrderTransactionCreateResponse {
  uint64 transaction_id = 1;
  uint64 warehouse_id = 2;
  // Σ items' total.
  double total = 3;
  repeated OrderTransactionItem items = 4;
}

// Why a take was refused — exactly one per refusal.
enum OrderTransactionRefusalReason {
  ORDER_TRANSACTION_REFUSAL_REASON_UNSPECIFIED = 0;
  // K was already claimed — by an earlier take or by a release that came first.
  ORDER_TRANSACTION_REFUSAL_REASON_KEY_USED = 1;
  // A borrowed line on a private product, an owner whose total stock is below its reserve, or a product that exists
  // nowhere.
  ORDER_TRANSACTION_REFUSAL_REASON_NOT_ALLOWED = 2;
  // The warehouse holds fewer units than a line wants.
  ORDER_TRANSACTION_REFUSAL_REASON_NOT_ENOUGH_STOCK = 3;
  // The warehouse holds enough, but a stock count holds some of them, and the racks no count holds cannot fill the line
  // (a-lock-stops-sales-and-cancels-too). The error's message names each count, who started it and when.
  ORDER_TRANSACTION_REFUSAL_REASON_BEING_COUNTED = 4;
}

// OrderTransactionRefusedLine is one line a refusal names.
message OrderTransactionRefusedLine {
  uint64 product_id = 1;
  int64 wanted = 2;
  // For NOT_ENOUGH_STOCK, the units the owner holds in this warehouse; for BEING_COUNTED, the units on racks no count
  // holds; 0 otherwise.
  int64 available = 3;
  // For BEING_COUNTED, the count holding the rest of the line; 0 otherwise.
  uint64 counting_session_id = 4;
}

// OrderTransactionRefusal rides on the Connect error of a refused take.
message OrderTransactionRefusal {
  OrderTransactionRefusalReason reason = 1;
  // Every line refused for that reason; empty for KEY_USED.
  repeated OrderTransactionRefusedLine lines = 2;
}

message OrderTransactionReleaseRequest {
  // Write: the order's selling team — a cancel, or the create's own compensation.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  string idempotency_key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message OrderTransactionReleaseResponse {
  // The transaction rolled back, 0 when K had none — taken by nothing, or released before any take.
  uint64 transaction_id = 1;
  // True when this call rolled it back; false when there was nothing to roll back or it already was.
  bool released = 2;
}

message OrderTransactionReturnRequest {
  // Write: the RETURN warehouse's crew, the people holding the parcel (only-the-return-warehouse-accepts-a-return).
  // Called in process by the order's return accept, which has run its own policy and checked the warehouse.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The RETURN warehouse — where the parcel is, and where the sound units are minted and shelved.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // The ORDERING team — the return transaction's team and every minted batch's owner, borrowed lines too
  // (a-returned-borrowed-unit-is-relabelled-at-the-accept).
  uint64 selling_team_id = 2 [(buf.validate.field).uint64.gt = 0];

  // The order's take (orders.transaction_id): its batch rows are the layers the return mints from, and it is the
  // once-only key — one return per take.
  uint64 take_transaction_id = 3 [(buf.validate.field).uint64.gt = 0];

  // Every product the take drew, once.
  repeated OrderTransactionReturnLine lines = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
  }];

  // Written on the transaction, e.g. "return of order #12".
  string description = 5 [(buf.validate.field).string.max_len = 200];
}

// OrderTransactionReturnLine is one product of the take as the return warehouse's crew counted it. sound + broken +
// missing is what the take drew of it.
message OrderTransactionReturnLine {
  // The product the take drew — the order line's.
  uint64 product_id = 1 [(buf.validate.field).uint64.gt = 0];
  // The product the units come back as: product_id itself for the team's own, the team's mapped own product for a
  // borrowed line (a-return-never-clones-a-product).
  uint64 return_product_id = 2 [(buf.validate.field).uint64.gt = 0];
  // The markup the team paid on a borrowed line, as a fraction of its cost (0.2 = 20 %) — the line's frozen
  // markup_total over its cost. 0 on the team's own line. Each layer is minted at its price × (1 + markup_rate).
  double markup_rate = 3 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  int64 sound = 4 [(buf.validate.field).int64.gte = 0];
  int64 broken = 5 [(buf.validate.field).int64.gte = 0];
  int64 missing = 6 [(buf.validate.field).int64.gte = 0];
  // The crew's note on the broken and missing units (a-return-door-row-carries-an-optional-note); kept on the line's
  // door rows. Ignored when both are 0.
  string note = 7 [(buf.validate.field).string.max_len = 200];
  // Where the sound units went — together exactly `sound`, racks of the return warehouse.
  repeated OrderTransactionReturnPlacement placements = 8 [(buf.validate.field).repeated.max_items = 50];
}

message OrderTransactionReturnPlacement {
  uint64 placement_id = 1 [(buf.validate.field).uint64.gt = 0];
  int64 quantity = 2 [(buf.validate.field).int64.gt = 0];
}

// What happened to a returned unit that did not go back on a shelf.
enum OrderTransactionReturnProblemType {
  ORDER_TRANSACTION_RETURN_PROBLEM_TYPE_UNSPECIFIED = 0;
  // In the parcel, too damaged to sell — thrown away (a-broken-returned-unit-is-thrown-away-at-the-door).
  ORDER_TRANSACTION_RETURN_PROBLEM_TYPE_BROKEN = 1;
  // Not in the parcel (a-short-return-is-missing-at-the-door).
  ORDER_TRANSACTION_RETURN_PROBLEM_TYPE_MISSING = 2;
}

// OrderTransactionReturnProblem is one door row: one product's broken or missing units, priced from the layers they
// came off, newest first, at what the team paid.
message OrderTransactionReturnProblem {
  // The product the take drew — the order line's.
  uint64 product_id = 1;
  OrderTransactionReturnProblemType type = 2;
  int64 count = 3;
  double total = 4;
  string note = 5;
}

message OrderTransactionReturnResponse {
  // The take's one `return` transaction.
  uint64 transaction_id = 1;
  // True when this call wrote it; false when the take was already returned — the answer is then what was written.
  bool posted = 2;
  // The door rows, broken before missing per product.
  repeated OrderTransactionReturnProblem problems = 3;
}
