syntax = "proto3";

package warehouse.inventory.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/inventory/v1/received_count.proto";
import "warehouse/inventory/v1/restock_resolution.proto";
import "warehouse/inventory/v1/restock_tag.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/inventory/v1;inventoryv1";

// RestockRequestService — a SELLING team restocks a product into a WAREHOUSE.
//
// The design is docs/business/inventory/restock.md and its 43 decisions in restock_decision.md. This file was
// REWRITTEN IN PLACE to that design (the-restock-contract-changes-in-place): a restock is ONE PARCEL
// (a-restock-is-one-parcel) that moves ongoing → arrived → accepted, or ends lost or cancelled. The warehouse signs
// for the box and accepts it; the selling team does everything else
// (the-warehouse-signs-and-accepts-the-team-does-the-rest).
//
// MONEY IS `double` (money-is-double-in-the-api-too): a landed price of 11.714,2857… reaches the screen as it is stored,
// and the screen rounds it for display. Amounts are compared at 4 digits, never with ==.
service RestockRequestService {
  // The selling team raises a restock — the restock and its lines in one transaction, then Restock Created
  // (a-created-restock-tells-the-financial-account). A resi or an Order ID another restock of the team holds, not
  // cancelled, is ALREADY_EXISTS with RestockReferenceInUse (a-reference-in-use-stops-the-restock-form).
  rpc RestockRequestCreate(RestockRequestCreateRequest) returns (RestockRequestCreateResponse);
  // Both sides list: a team sees restocks it raised and restocks coming to it as a warehouse.
  rpc RestockRequestList(RestockRequestListRequest) returns (RestockRequestListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The people a "who" filter offers (a-who-filter-lists-the-people-on-its-rows).
  rpc RestockActorList(RestockActorListRequest) returns (RestockActorListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // One restock in full, with its lines and its trail. Same two-sided scope as List.
  rpc RestockRequestDetail(RestockRequestDetailRequest) returns (RestockRequestDetailResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The selling team edits — everything while ongoing, only the lines while arrived
  // (the-lines-stay-editable-until-accepted). An ongoing edit to a resi or an Order ID another restock of the team holds
  // is ALREADY_EXISTS with RestockReferenceInUse, as for Create.
  rpc RestockRequestUpdate(RestockRequestUpdateRequest) returns (RestockRequestUpdateResponse);
  // The warehouse signs for the box: ongoing or lost → arrived (a-late-lost-box-is-signed-for-as-arrived).
  rpc RestockRequestArrive(RestockRequestArriveRequest) returns (RestockRequestArriveResponse);
  // The warehouse counts the box in: ongoing or arrived → accepted, under a lock on the restock row
  // (accept-locks-the-restock).
  rpc RestockRequestAccept(RestockRequestAcceptRequest) returns (RestockRequestAcceptResponse);
  // The selling team gives the parcel up: ongoing → lost (lost-is-set-only-before-the-box-arrives).
  rpc RestockRequestMarkLost(RestockRequestMarkLostRequest) returns (RestockRequestMarkLostResponse);
  // The selling team calls it off: ongoing → cancelled (a-restock-is-cancelled-only-while-ongoing).
  rpc RestockRequestCancel(RestockRequestCancelRequest) returns (RestockRequestCancelResponse);
  // The printable shelf labels for an ACCEPTED restock — one per placement the good units went to.
  rpc RestockRequestLabels(RestockRequestLabelsRequest) returns (RestockRequestLabelsResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The headline over the warehouse's inbound queue: what is still on its way or at the door.
  rpc RestockInboundStat(RestockInboundStatRequest) returns (RestockInboundStatResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // THE COD THE WAREHOUSE PAID (the-warehouse-sees-the-cod-it-paid): the courier's charge it handed over at the door
  // (`warehouse_additional_cost`) on the restocks it accepted in a window, summed, and how many carried one.
  rpc RestockCodPaidStat(RestockCodPaidStatRequest) returns (RestockCodPaidStatResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // THE SELLING RESTOCK LIST'S STATISTICS (the-restock-statistics-count-transactions-under-the-tabs): the team's restocks
  // under the list's own filter, counted per status and in all, with what was ordered and paid — and the value per
  // paying account for Rincian. Read only while the statistics are open (the-statistics-are-shut-and-read-when-opened).
  rpc RestockSellingStat(RestockSellingStatRequest) returns (RestockSellingStatResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // THE SELLING RESTOCK LIST AS A FILE (the-restock-list-exports-and-filters-by-courier, on
  // one-export-is-the-list-as-a-file and a-report-export-is-the-whole-view-as-a-file): exactly the restocks the list holds
  // with this filter — the list's one predicate, the status tab and the courier included — every page of them, in the
  // list's order and the screen's columns, as .xlsx. A server stream: every step a message with the progress, the
  // expiring link to the stored file on the last. NOT a read — it stores a file — so the admin team's monitor and an
  // agent's credential are refused (monitoring-keeps-what-only-reads).
  rpc RestockRequestExport(RestockRequestExportRequest) returns (stream RestockRequestExportResponse);
  // SEVERAL RESTOCKS IN ONE READ, for Cetak Label (the-labels-mark-their-one-by-one-read): each restock with its lines,
  // and an accepted one's labels, by id — the guideline's ByIds shape, one call for every restock on the print.
  rpc RestockRequestByIds(RestockRequestByIdsRequest) returns (RestockRequestByIdsResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The restock's own warehouse opens its label photo (`receipt_file`) to match the box at its door
  // (the-restocks-warehouse-opens-its-label-photo): checked here, signed by document_service in-process, no share.
  rpc RestockReceiptPhoto(RestockReceiptPhotoRequest) returns (RestockReceiptPhotoResponse) {
    // A READ — it writes no row and moves no file; it signs a link (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // THE PHOTOS TAKEN AT THE DOOR, for both detail pages (the-detail-pages-show-the-broken-photo,
  // the-detail-pages-show-the-slip-and-the-broken-rack): the courier's slip and each line's broken units, as the receiving
  // warehouse kept them at Terima — for the restock's selling team and its warehouse, checked here, signed by
  // document_service in-process (the label photo's door), no share.
  rpc RestockDoorPhotos(RestockDoorPhotosRequest) returns (RestockDoorPhotosResponse) {
    // A READ — it writes no row and moves no file; it signs links (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // KOREKSI JUMLAH TERIMA — the receiving warehouse corrects an ACCEPTED restock's received count
  // (the-warehouse-corrects-a-wrong-stock-in-alone), under the restock row's lock; see received_count.proto.
  rpc RestockReceivedCountCorrect(RestockReceivedCountCorrectRequest) returns (RestockReceivedCountCorrectResponse);
  // The selling team writes ITS NOTE on the restock alone, in EVERY status (the-note-is-edited-in-any-status) — on its
  // way, at the door, and once accepted, lost or cancelled — under the restock row's lock; nothing else of the restock
  // moves. The note's own writer and time are kept with it (the-notes-are-one-per-writer), and the trail gets an edit's
  // row saying what the note was and now is (edits-are-in-the-same-trail).
  rpc RestockRequestNoteSet(RestockRequestNoteSetRequest) returns (RestockRequestNoteSetResponse);
  // The RECEIVING WAREHOUSE writes ITS OWN NOTE on the restock (the-warehouse-writes-its-own-note) — its one writer
  // (three-notes-one-writer-each, the-notes-are-one-per-writer), under the restock row's lock; nothing else moves. Kept
  // with its own writer and time, and the trail gets an edit's row saying what it was and now is
  // (edits-are-in-the-same-trail). The selling team reads it, never writes it.
  rpc RestockRequestWarehouseNoteSet(RestockRequestWarehouseNoteSetRequest) returns (RestockRequestWarehouseNoteSetResponse);

  // RESTOCK TAGS (backlog #87; messages in restock_tag.proto) — one app-wide list, unique names, a SYSTEM tag the
  // admins' and the app's, a CUSTOM tag anyone's who may tag (custom-tags-are-shared-system-tags-are-the-admins-and-the-apps).
  // The app-wide list, for the Tag filter and the add box.
  rpc RestockTagList(RestockTagListRequest) returns (RestockTagListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The admins' Kelola tag list — the same tags, each with how many restocks carry it.
  rpc RestockTagManageList(RestockTagManageListRequest) returns (RestockTagManageListResponse) {
    // A READ — it writes nothing.
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A custom tag; a name already on the list answers that tag, never a twin.
  rpc RestockTagCreate(RestockTagCreateRequest) returns (RestockTagCreateResponse);
  // A system tag, by an admin; the same one-name-one-tag answer.
  rpc RestockTagSystemCreate(RestockTagSystemCreateRequest) returns (RestockTagSystemCreateResponse);
  // Rename, the admins' alone; never the app's own tags.
  rpc RestockTagRename(RestockTagRenameRequest) returns (RestockTagRenameResponse);
  // Delete, the admins' alone — off every restock too; never the app's own tags.
  rpc RestockTagDelete(RestockTagDeleteRequest) returns (RestockTagDeleteResponse);
  // A custom tag on / off a restock — either side, every role but a monitor, every status.
  rpc RestockRequestTagAdd(RestockRequestTagAddRequest) returns (RestockRequestTagAddResponse);
  rpc RestockRequestTagRemove(RestockRequestTagRemoveRequest) returns (RestockRequestTagRemoveResponse);
  // An admin's system tag on / off a restock — never the app's own.
  rpc RestockRequestSystemTagAdd(RestockRequestSystemTagAddRequest) returns (RestockRequestSystemTagAddResponse);
  rpc RestockRequestSystemTagRemove(RestockRequestSystemTagRemoveRequest) returns (RestockRequestSystemTagRemoveResponse);

  // RESTOCK RESOLUTIONS (backlog #101; messages in restock_resolution.proto) — the selling team settles a problem restock
  // (Diterima carrying a problem tag) or a lost one (Hilang) by resolution rows (a-restock-problem-is-settled-by-
  // resolution-rows). One row per call, under the restock row's lock: a REFUND (amount + account, posted to the account
  // after commit by RestockRefunded), a RETURN (links an existing outbound reship of this restock — a new one is made with
  // its row by CustomShipmentCreate's `resolution`), a RESHIPPING (creates its inbound parcel in the same transaction).
  // Also on a SETTLED restock, which stays settled; never a RETURN on a Hilang one.
  rpc RestockResolutionCreate(RestockResolutionCreateRequest) returns (RestockResolutionCreateResponse);
  // *Tandai Selesai* — the settled mark on the restock, its problem tags (*Barang kurang* / *Barang rusak*) off, in one
  // transaction under the restock row's lock. A settled restock is refused (already settled).
  rpc RestockRequestSettle(RestockRequestSettleRequest) returns (RestockRequestSettleResponse);
}

// Where a restock is. APPEND ONLY, like every enum here — the values were renamed in place
// (PENDING → ONGOING, FULFILLED → ACCEPTED) and keep their numbers.
enum RestockRequestStatus {
  RESTOCK_REQUEST_STATUS_UNSPECIFIED = 0;
  // On its way. The selling team may edit anything, cancel it, or give it up as lost.
  RESTOCK_REQUEST_STATUS_ONGOING = 1;
  // Counted in by the warehouse. Its good units are stock.
  RESTOCK_REQUEST_STATUS_ACCEPTED = 2;
  // Called off by the selling team while it was ongoing.
  RESTOCK_REQUEST_STATUS_CANCELLED = 3;
  // The warehouse signed for the box; it is in the building, not yet counted. The selling team may still edit the
  // lines (the-lines-stay-editable-until-accepted).
  RESTOCK_REQUEST_STATUS_ARRIVED = 4;
  // The parcel never came. Only from ongoing; a late box is signed for as arrived.
  RESTOCK_REQUEST_STATUS_LOST = 5;
}

// How a restock raised BEFORE paying accounts was paid for. READ-ONLY history: restocks already made keep it
// (a-restock-must-name-the-account-that-paid), and new ones name `finance_account_id` instead.
enum RestockPaymentType {
  RESTOCK_PAYMENT_TYPE_UNSPECIFIED = 0;
  RESTOCK_PAYMENT_TYPE_SHOPEE_PAY = 1;
  RESTOCK_PAYMENT_TYPE_BANK_ACCOUNT = 2;
}

// What went wrong with units at the door. The TABLE says it happened at receiving, so the selling team bears it
// (a-loss-is-named-by-where-it-happened); a loss on a rack is batch_logs', the warehouse's. APPEND ONLY.
enum RestockProblemType {
  RESTOCK_PROBLEM_TYPE_UNSPECIFIED = 0;
  // In the box, not sellable — crushed, torn, soaked. Typed by the warehouse.
  RESTOCK_PROBLEM_TYPE_BROKEN = 1;
  // Ordered, not in the box (a-short-unit-at-the-door-is-missing). WORKED OUT, never typed: count − received.
  // Renamed in place from LOST, which meant the same and collided with a rack loss.
  RESTOCK_PROBLEM_TYPE_MISSING = 2;
}

// RestockProblemItem — units of one line that did not become stock (restock_problem_items).
message RestockProblemItem {
  RestockProblemType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  int64 count = 2 [(buf.validate.field).int64.gt = 0];
  // What they were worth, FILLED BY THE SYSTEM and never editable by the warehouse
  // (the-problem-price-is-filled-by-the-system): the landed unit price, the same as a good unit's
  // (all-qty-is-every-unit-ordered). total = price_unit × count.
  double price_unit = 3;
  double total = 4;
  // The WAREHOUSE's note on this row — "box crushed". Optional (a-broken-reason-is-optional); its one writer is the
  // warehouse (three-notes-one-writer-each).
  string note = 5 [(buf.validate.field).string.max_len = 200];
  // THE BROKEN UNITS' PHOTO (a-broken-product-carries-a-photo) — a BROKEN row only, one per line, optional: the document
  // id of the receiving warehouse's upload at Terima, "" = none. A missing row never carries one. Opened through
  // RestockDoorPhotos, never by this id (the-detail-pages-show-the-broken-photo).
  string photo_file = 6 [(buf.validate.field).string.max_len = 500];
}

// RestockPlacement — how many of a line's good units went to ONE placement. Every unit in stock is on a placement
// (there-is-no-unplaced-pile), so there is no "unplaced" option; a staging area is an ordinary placement.
message RestockPlacement {
  // A placement of the ACCEPTING warehouse — another warehouse's reads as NotFound. Renamed in place from rack_id.
  uint64 placement_id = 1 [(buf.validate.field).uint64.gt = 0];
  // 2 was `unplaced` — removed with the unplaced pile.
  reserved 2;
  reserved "unplaced";
  int64 quantity = 3 [(buf.validate.field).int64.gt = 0];
}

// One line of a restock: one product, from one store, at one price (a-product-appears-once-per-restock).
message RestockRequestItem {
  uint64 id = 1;
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  // product code/name snapshot at raise time (the product may live in another team's catalogue).
  // At most 75: a team code (10) + "-" + the team's part (64) — the composed code (the-field-is-product-code-composed-on-write).
  string product_code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 75
  }];
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // How many were ORDERED. Renamed in place from `quantity`.
  int64 count = 5 [(buf.validate.field).int64.gt = 0];
  // The line's TOTAL, as the invoice prints it (a-line-is-typed-as-its-total) — the truth. Renamed in place from
  // `total_price`. Zero is legitimate (a sample).
  double total = 6 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // total ÷ count, for display — never typed. Stored beside the total and rewritten whenever either changes; ignored on
  // a create or an update.
  double price_unit = 11;

  // 7 was `received_quantity`, the SELLABLE units only. Replaced by received_count, which includes the broken ones
  // (any-warehouse-member-counts-what-arrived).
  reserved 7;
  reserved "received_quantity";
  // What arrived in the box, broken units included. 0 until accepted. Read-only here; the accept writes it.
  int64 received_count = 12;

  // Where the good units went, and what went wrong — both written by the accept, read-only here.
  repeated RestockPlacement placements = 9;
  // Renamed in place from `damaged`. Broken rows are typed at accept; missing rows are worked out.
  repeated RestockProblemItem problems = 10;

  // KOREKSI JUMLAH TERIMA (received_count.proto). DETAIL ONLY. `received_count` above is the corrected count; this is
  // the accept's, set once the line was corrected (*18 · dikoreksi dari 20*).
  optional int64 corrected_from = 16;
  // Units the corrections took out of the line's batch, net — the *Kurang (koreksi)* part of missing; negative when
  // more went back in. 0 = never corrected.
  int64 missing_by_correction = 17;
  // What those units are worth at the batch price — the selling team's *senilai … ditanggung tim penjual*. Set for the
  // OWNING team only (a-warehouse-sees-no-seller-money).
  optional double missing_by_correction_total = 18;
  // The correction form's facts for this line — set for the RECEIVING warehouse on an accepted restock only.
  ReceivedCountLineFacts correction_facts = 19;

  // Who sold it, and from which store — both optional; a stall has a supplier and no store
  // (a-line-may-name-a-supplier-without-a-channel). Any team's supplier, picked from the Connect Supplier Channel
  // popup (a-line-connects-to-any-teams-supplier-from-a-popup). A store, when given, must be that supplier's.
  uint64 supplier_id = 13;
  uint64 supplier_channel_id = 14;

  // The SELLING team's note on the line — "extra stock" (extra-units-are-added-by-the-selling-teams-edit).
  string note = 15 [(buf.validate.field).string.max_len = 200];

  // 8 was `received_rack_id`, long superseded by placements.
  reserved 8;
  reserved "received_rack_id";
}

// One row of a restock's trail (every-status-change-is-logged, edits-are-in-the-same-trail): a status change, or an
// edit where from and to are the same status and the description says what changed.
message RestockLog {
  uint64 id = 1;
  RestockRequestStatus from_status = 2;
  RestockRequestStatus to_status = 3;
  // user_service id; 0 = not recorded. Resolved to a name at read time, never snapshotted.
  uint64 actor_user_id = 4;
  // Why, or what changed — "Kaos Hitam 10 → 12, extra stock".
  string description = 5;
  int64 at_unix = 6;
  // THIS ROW'S ACTOR WAS AN OVERRIDE — Root or the System Administrator wrote it inside a team they hold no role in (an-override-is-stamped-in-every-service);
  // the screen shows the shared "by Root team" badge beside the person (an-override-shows-a-platform-badge).
  // From `restock_logs.is_override`.
  bool is_override = 7;
  // WHAT AN EDIT CHANGED, field by field, before and after (edits-are-in-the-same-trail) — *Kaos 10 → 12, extra stock*.
  // Set on an edit's row only (from = to), in the order the edit wrote them: the restock's own fields first, then the
  // lines. EMPTY on a status row, on an edit that changed nothing, and on every edit written before the changes were
  // kept (its `description` is the bare "edited"): nothing is made up for those. From `restock_log_changes` (00049).
  // A RESOLUTION or REOPENED row (`kind`) carries its own facts here too (RESOLUTION, PARCEL, PARCEL_SHORT,
  // PARCEL_BROKEN).
  repeated RestockLogChange changes = 8;
  // WHAT THE ROW RECORDS when it is not a status change, the create or an edit (backlog #101 — the owner's 🔄 on
  // a-restock-problem-is-settled-by-resolution-rows: the Riwayat gets REAL entries, one per resolution, per settle and per
  // reopen, written when each happens and never rewritten, so settled → reopened → settled reads all three). Such a row
  // keeps the status (from = to), as an edit's does; this is what tells it from one. UNSPECIFIED on every other row — read
  // from its statuses as before. From `restock_logs.description` (the row's stored word).
  RestockLogKind kind = 9;
}

// The trail rows a restock's settlement writes (backlog #101), each in the transaction of what it records.
enum RestockLogKind {
  // A status change, the create or an edit — what the statuses say.
  RESTOCK_LOG_KIND_UNSPECIFIED = 0;
  // A resolution recorded (RestockResolutionCreate, or CustomShipmentCreate's `resolution`) — its actor is who recorded
  // it; one change, RESOLUTION, names the row (`restock_resolutions.id`), which the detail's `resolutions` carries.
  RESTOCK_LOG_KIND_RESOLUTION = 1;
  // *Tandai Selesai* (RestockRequestSettle) — who marked it settled, and when. No change under it.
  RESTOCK_LOG_KIND_SETTLED = 2;
  // A settled restock reopened by its inbound parcel's Terima with short or broken units (CustomShipmentReceive) — its
  // actor is the warehouse member who counted; its changes name the parcel (PARCEL) and, per product, what was short
  // (PARCEL_SHORT) and broken (PARCEL_BROKEN).
  RESTOCK_LOG_KIND_REOPENED = 3;
}

// What one field of a restock read before an edit and after it. APPEND ONLY.
enum RestockLogChangeField {
  RESTOCK_LOG_CHANGE_FIELD_UNSPECIFIED = 0;

  // The restock's own fields — changeable only while ongoing (a-restock-is-edited-only-while-ongoing).
  // The receiving warehouse, a team id.
  RESTOCK_LOG_CHANGE_FIELD_WAREHOUSE = 1;
  // The courier's tracking number, the resi.
  RESTOCK_LOG_CHANGE_FIELD_RECEIPT = 2;
  // The label photo, a document id — the screen says it was added, replaced or removed, never the id.
  RESTOCK_LOG_CHANGE_FIELD_RECEIPT_FILE = 3;
  // The courier, a shipment channel id.
  RESTOCK_LOG_CHANGE_FIELD_SHIPMENT = 4;
  // The store's Order ID.
  RESTOCK_LOG_CHANGE_FIELD_INVOICE_REF = 5;
  // The paying account, a financial account id.
  RESTOCK_LOG_CHANGE_FIELD_FINANCE_ACCOUNT = 6;
  // The shipping the selling team paid, an amount.
  RESTOCK_LOG_CHANGE_FIELD_SHIPMENT_COST = 7;
  // The selling team's note on the restock.
  RESTOCK_LOG_CHANGE_FIELD_NOTE = 8;

  // A line — `product_id` and `product_name` say which.
  // Added by the edit: `after` is its count; its total, note, supplier and store, when given, follow as their own
  // changes with no `before` (a-line-added-after-arrival-names-its-supplier).
  RESTOCK_LOG_CHANGE_FIELD_LINE_ADDED = 9;
  // Removed by the edit (ongoing only): `before` is its count.
  RESTOCK_LOG_CHANGE_FIELD_LINE_REMOVED = 10;
  // How many were ordered.
  RESTOCK_LOG_CHANGE_FIELD_LINE_COUNT = 11;
  // The line's total, an amount.
  RESTOCK_LOG_CHANGE_FIELD_LINE_TOTAL = 12;
  // The selling team's note on the line — *extra stock*.
  RESTOCK_LOG_CHANGE_FIELD_LINE_NOTE = 13;
  // The line's supplier, a supplier id.
  RESTOCK_LOG_CHANGE_FIELD_LINE_SUPPLIER = 14;
  // The line's store, a supplier channel id.
  RESTOCK_LOG_CHANGE_FIELD_LINE_STORE = 15;

  // The RECEIVING WAREHOUSE's own note on the restock (the-warehouse-writes-its-own-note) — a field of the restock
  // itself, written by RestockRequestWarehouseNoteSet alone, never by the selling team's edit.
  RESTOCK_LOG_CHANGE_FIELD_WAREHOUSE_NOTE = 16;

  // A RESOLUTION row's (RestockLogKind): `after` = the resolution's id (`restock_resolutions.id`); no product.
  RESTOCK_LOG_CHANGE_FIELD_RESOLUTION = 17;
  // A REOPENED row's: `after` = the inbound parcel whose Terima reopened it (`custom_shipments.id`); no product.
  RESTOCK_LOG_CHANGE_FIELD_PARCEL = 18;
  // A REOPENED row's, per product the parcel came short of: `after` = the units short (sent − received).
  RESTOCK_LOG_CHANGE_FIELD_PARCEL_SHORT = 19;
  // A REOPENED row's, per product with broken units in the parcel: `after` = the units broken.
  RESTOCK_LOG_CHANGE_FIELD_PARCEL_BROKEN = 20;
}

// ONE THING AN EDIT CHANGED (edits-are-in-the-same-trail). The values are TEXT as stored: a count or an amount in
// decimal, an id in decimal, words verbatim; "" is none — no before for an added line or a newly named supplier, no
// after for a removed line or a cleared note. Ids are named at read time by the screen, like the row's person.
message RestockLogChange {
  RestockLogChangeField field = 1;
  // The line it is about; 0 for a field of the restock itself.
  uint64 product_id = 2;
  // The line's name as the restock carried it at the edit — its own snapshot, so a line removed since still reads.
  // "" for a field of the restock itself.
  string product_name = 3;
  string before = 4;
  string after = 5;
}

message RestockRequest {
  uint64 id = 1;
  uint64 requesting_team_id = 2;
  uint64 warehouse_id = 3;
  RestockRequestStatus status = 9;
  int64 created_at_unix = 10;

  // The lines. At least one.
  repeated RestockRequestItem items = 11;

  // The parcel — what finds the box at the door (the-receipt-is-the-tracking-number).
  // The courier's tracking number (resi). Empty = none yet.
  string receipt = 13;
  // A photo of the label.
  string receipt_file = 29;
  // The courier — a shipment channel.
  uint64 shipment_id = 28;

  // The money — what the selling team paid when it raised it.
  // The store's invoice or order number; one per restock (a-restock-has-one-invoice). Renamed in place from
  // `order_ref`.
  string invoice_ref_id = 15;
  // The operational account that paid (a-restock-names-its-paying-account).
  uint64 finance_account_id = 27;
  // History only — see RestockPaymentType.
  RestockPaymentType payment_type = 17;
  // Freight the selling team paid. Renamed in place from `shipping_cost`.
  double shipment_cost = 16;
  // Σ line totals. Stored, written by every create and edit.
  double subtotal = 30;
  // subtotal + shipment_cost — and NOT the courier's charge (the-couriers-charge-stays-out-of-total). Stored.
  double total = 31;

  // The courier's charge at the door — paid by the warehouse on the spot, compensated by the selling team
  // (the-warehouse-cost-is-the-couriers-charge-at-the-door). One per restock, with its note
  // (the-courier-is-paid-once-per-restock). Noted at Tandai Tiba or entered at Terima, FINAL at Terima — whose figure
  // replaces Tiba's (the-courier-charge-is-noted-at-tiba-and-final-at-terima); 0 until one of them sets it.
  double warehouse_additional_cost = 38;
  string warehouse_additional_cost_note = 39;
  // THE COURIER'S SLIP (the-courier-slip-has-an-optional-photo) — a photo of it, optional, kept with the charge at Tiba or
  // Terima: the document id of the receiving warehouse's upload, "" = none (always "" while there is no charge). Opened through
  // RestockDoorPhotos, never by this id (the-detail-pages-show-the-slip-and-the-broken-rack).
  string warehouse_additional_cost_file = 47;

  // The SELLING team's note on the restock as a whole (three-notes-one-writer-each).
  string note = 18;
  // WHO WROTE THAT NOTE, AND WHEN (the-notes-are-one-per-writer) — the note's OWN writer, never the restock's last edit:
  // set at the raise (the note is written then, empty or not), and by an edit or a note set that CHANGES the note; an
  // edit that changes only a line, the resi or the money leaves them. A user_service id (0 = not recorded), unix
  // seconds (0 = not recorded), and whether that writer was Root or the System Administrator acting from outside the
  // team (an-override-shows-a-platform-badge). 0 / 0 / false on a restock whose note was last written before they were
  // kept (00050): nothing is invented for it — the screen says it falls back to the restock's last raise or edit.
  uint64 note_by_user_id = 44;
  int64 note_at_unix = 45;
  bool note_by_is_override = 46;

  // THE RECEIVING WAREHOUSE'S OWN NOTE on the restock as a whole (the-warehouse-writes-its-own-note) — its one writer is
  // the warehouse (three-notes-one-writer-each, the-notes-are-one-per-writer); the selling team reads it. "" = none.
  string warehouse_note = 48;
  // WHO WROTE IT, AND WHEN — stamped by RestockRequestWarehouseNoteSet when it CHANGES the note, never by anything else:
  // a user_service id (0 = never written), unix seconds (0 = never written), and whether that writer was Root or the
  // System Administrator acting from outside the warehouse (an-override-shows-a-platform-badge).
  uint64 warehouse_note_by_user_id = 49;
  int64 warehouse_note_at_unix = 50;
  bool warehouse_note_by_is_override = 51;

  // The inventory transaction the accept made; 0 until accepted.
  uint64 transaction_id = 32;

  // Who did what, and when — user_service ids, 0 = not yet or not recorded; unix seconds, 0 = not yet.
  uint64 created_by_user_id = 20;
  uint64 arrived_by_user_id = 35;
  uint64 accepted_by_user_id = 21;
  uint64 lost_by_user_id = 36;
  uint64 cancelled_by_user_id = 24;
  int64 arrived_at_unix = 33;
  int64 accepted_at_unix = 22;
  int64 lost_at_unix = 34;
  int64 cancelled_at_unix = 23;

  // THE CREATE WAS AN OVERRIDE — Root or the System Administrator raised it inside a team they hold no role in
  // (an-override-is-stamped-in-every-service); the list's created-by cell shows the shared "by Root team" badge beside
  // the creator (an-override-shows-a-platform-badge). The restock itself is not stamped: this is its trail's FIRST row's
  // `restock_logs.is_override`, the create's. LIST ONLY — Detail carries the trail, whose first row says it.
  bool created_by_is_override = 40;

  // THE SAME FOR THE TWO STEPS THE LISTS NAME A PERSON FOR — who signed for the box (`arrived_by_user_id`) and who
  // counted it in (`accepted_by_user_id`): each step's trail row's `restock_logs.is_override`. A box counted straight
  // from ongoing was signed for by that count, so its arrive reads the accept's row. LIST ONLY, like the one above.
  bool arrived_by_is_override = 41;
  bool accepted_by_is_override = 42;

  // The trail, oldest first. DETAIL ONLY — List leaves it empty.
  repeated RestockLog logs = 37;

  // KOREKSI JUMLAH TERIMA — every line's correction, oldest first, beside the trail: its own kind, never a status row
  // (a correction must not read as the selling team's edit). DETAIL ONLY.
  repeated ReceivedCountCorrection count_corrections = 43;

  // ITS TAGS (backlog #87, restock_tag.proto) — one set, the same on both sides' lists and details
  // (custom-tags-are-shared-system-tags-are-the-admins-and-the-apps): the system's first, then by name. On List, Detail
  // and every write that answers the restock; `restock_count` is 0 here.
  repeated RestockTag tags = 52;

  // RESOLUTIONS (backlog #101, restock_resolution.proto) — its resolution rows, oldest first: DETAIL ONLY (List leaves
  // it empty and sends the count). A warehouse reader gets them without a refund's amount or account
  // (a-warehouse-sees-no-seller-money).
  repeated RestockResolution resolutions = 53;
  // How many resolution rows it has — List and Detail.
  uint32 resolution_count = 54;
  // THE SETTLED MARK (*Tandai Selesai*) — 0 = not settled. Lifted again (0) when an inbound parcel's Terima finds short
  // or broken units (a-restock-problem-is-settled-by-resolution-rows, 🔄 A: a late shortfall reopens it). List and
  // Detail.
  int64 settled_at_unix = 55;
  uint64 settled_by_user_id = 56;
  bool settled_by_is_override = 57;

  // Removed in the rewrite.
  reserved 4, 5, 6, 7, 8, 12, 14, 19, 25, 26;
  reserved "product_id", "sku", "name", "quantity", "shipping_code", "order_id", "supplier_id", "cod_shipping_fee",
    "events", "cost_lines";
}

message RestockRequestCreateRequest {
  // The SELLING team's managers and customer service raise a restock.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 warehouse_id = 2 [(buf.validate.field).uint64.gt = 0];

  // At least one line, each product once; `id` on each is ignored.
  repeated RestockRequestItem items = 8 [(buf.validate.field).repeated.min_items = 1];

  string receipt = 10 [(buf.validate.field).string.max_len = 100];
  string receipt_file = 18 [(buf.validate.field).string.max_len = 500];
  uint64 shipment_id = 17;
  string invoice_ref_id = 12 [(buf.validate.field).string.max_len = 100];
  // REQUIRED — every restock names the account that paid (a-restock-must-name-the-account-that-paid).
  uint64 finance_account_id = 16 [(buf.validate.field).uint64.gt = 0];
  // Zero is legitimate (free shipping).
  double shipment_cost = 13 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  string note = 15 [(buf.validate.field).string.max_len = 1000];

  reserved 3, 4, 5, 6, 7, 9, 11, 14;
  reserved "product_id", "sku", "name", "quantity", "shipping_code", "order_id", "supplier_id", "payment_type";
}

message RestockRequestCreateResponse {
  RestockRequest request = 1;
}

// Which of a restock's two references a refusal names (a-reference-in-use-stops-the-restock-form). APPEND ONLY.
enum RestockReference {
  RESTOCK_REFERENCE_UNSPECIFIED = 0;
  // The courier's tracking number — `receipt`, the resi.
  RESTOCK_REFERENCE_RECEIPT = 1;
  // The store's Order ID — `invoice_ref_id`.
  RESTOCK_REFERENCE_INVOICE_REF = 2;
}

// One reference of the refused save, and the restock that already holds it.
message RestockReferenceHeld {
  RestockReference reference = 1;
  // The other restock of the same team holding it — never a cancelled one — and its status.
  uint64 holder_id = 2;
  RestockRequestStatus holder_status = 3;
}

// RestockReferenceInUse rides on the ALREADY_EXISTS of a create or an ongoing edit refused because its resi or its Order
// ID — each on its own, exact, letter case and the spaces around it aside — is on another restock of the same team that
// is not cancelled (a-reference-in-use-stops-the-restock-form). The database's unique index refuses it, so two saves of
// one value at the same second cannot both pass. One entry per reference held — never none.
message RestockReferenceInUse {
  repeated RestockReferenceHeld held = 1;
}

message RestockRequestListRequest {
  // Either side — the selling team that raised it, or the warehouse it is coming to.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  RestockRequestListFilter filter = 2;
  repeated RestockRequestListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message RestockRequestListFilter {
  // ONE status; UNSPECIFIED = all of them. Server-side.
  RestockRequestStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  // Only restocks carrying THIS product on a line. 0 = no filter.
  uint64 product_id = 2;
  // Only restocks going to THIS warehouse; 0 = every warehouse. Selling side only.
  uint64 warehouse_id = 3;
  // The period, and WHICH date it is about — each field reads its own column (created_at, accepted_at,
  // cancelled_at, arrived_at, lost_at). Both bounds 0 = every restock. A row without that date is excluded:
  // "arrived last week" cannot be true of a box that has not arrived.
  RestockDateField date_field = 4 [(buf.validate.field).enum.defined_only = true];
  int64 from_unix = 5;
  int64 to_unix = 6;
  // Free text over its number (a whole id only), the tracking number, the invoice reference, and a line's product code or
  // name.
  string q = 7 [(buf.validate.field).string.max_len = 100];
  // Only restocks raised BY THIS TEAM; 0 = every team. Warehouse side only.
  uint64 requesting_team_id = 8;
  // By person: who raised it, who accepted it. 0 = anybody; both set = AND.
  uint64 created_by_user_id = 9;
  uint64 accepted_by_user_id = 10;
  // Only restocks THIS COURIER brought — the restock's `shipment_id`, a shipment channel id
  // (the-restock-list-exports-and-filters-by-courier). 0 = any courier; a restock that names none (0) is read only
  // then — no pick asks for "no courier".
  uint64 shipment_id = 11;
  // Only restocks carrying ANY of these tags (the-restock-tags-prototype-is-accepted: several tags, any of them —
  // *Barang kurang* + *Barang rusak* together is the problem list). Empty = any tag or none. Inside the list's one
  // predicate, so its statistics and its export narrow alike.
  repeated uint64 tag_ids = 12 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      uint64: {gt: 0}
    }
  }];
  // By the settled mark (backlog #101): the seller's Hilang tab is status LOST + UNSETTLED — a settled lost restock
  // leaves it and stays under Semua (the-restock-resolutions-prototype-is-accepted). UNSPECIFIED = either. Inside the
  // list's one predicate, so its statistics and its export narrow alike.
  RestockSettledFilter settled = 13 [(buf.validate.field).enum.defined_only = true];
}

// Which of a restock's dates a range filter is about. APPEND ONLY.
enum RestockDateField {
  // Reads as CREATED.
  RESTOCK_DATE_FIELD_UNSPECIFIED = 0;
  RESTOCK_DATE_FIELD_CREATED = 1;
  RESTOCK_DATE_FIELD_ACCEPTED = 2;
  RESTOCK_DATE_FIELD_CANCELLED = 3;
  // When the warehouse signed for the box — a supplier's lead time is measured to it.
  RESTOCK_DATE_FIELD_ARRIVED = 4;
  RESTOCK_DATE_FIELD_LOST = 5;
}

enum RestockRequestListDataType {
  RESTOCK_REQUEST_LIST_DATA_TYPE_UNSPECIFIED = 0;
  RESTOCK_REQUEST_LIST_DATA_TYPE_GENERAL = 1;
  RESTOCK_REQUEST_LIST_DATA_TYPE_RESTOCK_REQUEST = 2;
}

message RestockRequestMapItem {
  map<uint64, RestockRequest> map_data = 1;
}

message RestockRequestListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    RestockRequestMapItem restock_request = 2;
  }
}

message RestockRequestListResponse {
  repeated RestockRequestListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message RestockRequestDetailRequest {
  // Either side, as List. A restock that is neither reads as NotFound.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message RestockRequestDetailResponse {
  RestockRequest request = 1;
}

// ── Who appears on the restocks (a-who-filter-lists-the-people-on-its-rows) ──────────────────────────────────────

// Which act the person did on the restock. APPEND ONLY.
enum RestockActorRole {
  RESTOCK_ACTOR_ROLE_UNSPECIFIED = 0;
  RESTOCK_ACTOR_ROLE_CREATED = 1;
  RESTOCK_ACTOR_ROLE_ACCEPTED = 2;
}

enum RestockActorListDataType {
  RESTOCK_ACTOR_LIST_DATA_TYPE_UNSPECIFIED = 0;
  RESTOCK_ACTOR_LIST_DATA_TYPE_ACTOR = 1;
}

enum RestockActorSort {
  RESTOCK_ACTOR_SORT_UNSPECIFIED = 0;
  // When they last did it, newest first.
  RESTOCK_ACTOR_SORT_LAST_AT = 1;
}

message RestockActorListFilter {
  RestockActorRole role = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message RestockActorListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    RestockActorSort actor = 2;
  }
}

message RestockActorListRequest {
  // Exactly RestockRequestList's roles (whoever-reads-a-list-may-filter-it).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
