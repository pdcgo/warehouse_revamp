syntax = "proto3";

package warehouse.inventory.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/inventory/v1;inventoryv1";

// RestockRequestService — a SELLING team restocks a product into a WAREHOUSE.
//
// The design is docs/business/inventory/restock.md and its 43 decisions in restock_decision.md. This file was
// REWRITTEN IN PLACE to that design (the-restock-contract-changes-in-place): a restock is ONE PARCEL
// (a-restock-is-one-parcel) that moves ongoing → arrived → accepted, or ends lost or cancelled. The warehouse signs
// for the box and accepts it; the selling team does everything else
// (the-warehouse-signs-and-accepts-the-team-does-the-rest).
//
// ⚠ Until the backend step: fields with no database column yet are ACCEPTED BUT NOT STORED, and RestockRequestArrive
// / RestockRequestMarkLost answer Unimplemented. Each such field says so.
service RestockRequestService {
  // The selling team raises a restock — the restock and its lines in one transaction, then Restock Created
  // (a-created-restock-tells-the-financial-account).
  rpc RestockRequestCreate(RestockRequestCreateRequest) returns (RestockRequestCreateResponse);
  // Both sides list: a team sees restocks it raised and restocks coming to it as a warehouse.
  rpc RestockRequestList(RestockRequestListRequest) returns (RestockRequestListResponse);
  // The people a "who" filter offers (a-who-filter-lists-the-people-on-its-rows).
  rpc RestockActorList(RestockActorListRequest) returns (RestockActorListResponse);
  // One restock in full, with its lines and its trail. Same two-sided scope as List.
  rpc RestockRequestDetail(RestockRequestDetailRequest) returns (RestockRequestDetailResponse);
  // The selling team edits — everything while ongoing, only the lines while arrived
  // (the-lines-stay-editable-until-accepted).
  rpc RestockRequestUpdate(RestockRequestUpdateRequest) returns (RestockRequestUpdateResponse);
  // The warehouse signs for the box: ongoing or lost → arrived (a-late-lost-box-is-signed-for-as-arrived).
  rpc RestockRequestArrive(RestockRequestArriveRequest) returns (RestockRequestArriveResponse);
  // The warehouse counts the box in: ongoing or arrived → accepted, under a lock on the restock row
  // (accept-locks-the-restock).
  rpc RestockRequestAccept(RestockRequestAcceptRequest) returns (RestockRequestAcceptResponse);
  // The selling team gives the parcel up: ongoing → lost (lost-is-set-only-before-the-box-arrives).
  rpc RestockRequestMarkLost(RestockRequestMarkLostRequest) returns (RestockRequestMarkLostResponse);
  // The selling team calls it off: ongoing → cancelled (a-restock-is-cancelled-only-while-ongoing).
  rpc RestockRequestCancel(RestockRequestCancelRequest) returns (RestockRequestCancelResponse);
  // The printable shelf labels for an ACCEPTED restock — one per placement the good units went to.
  rpc RestockRequestLabels(RestockRequestLabelsRequest) returns (RestockRequestLabelsResponse);
  // The headline over the warehouse's inbound queue: what is still on its way or at the door.
  rpc RestockInboundStat(RestockInboundStatRequest) returns (RestockInboundStatResponse);
}

// Where a restock is. APPEND ONLY, like every enum here — the values were renamed in place
// (PENDING → ONGOING, FULFILLED → ACCEPTED) and keep their numbers.
enum RestockRequestStatus {
  RESTOCK_REQUEST_STATUS_UNSPECIFIED = 0;
  // On its way. The selling team may edit anything, cancel it, or give it up as lost.
  RESTOCK_REQUEST_STATUS_ONGOING = 1;
  // Counted in by the warehouse. Its good units are stock.
  RESTOCK_REQUEST_STATUS_ACCEPTED = 2;
  // Called off by the selling team while it was ongoing.
  RESTOCK_REQUEST_STATUS_CANCELLED = 3;
  // The warehouse signed for the box; it is in the building, not yet counted. The selling team may still edit the
  // lines (the-lines-stay-editable-until-accepted).
  RESTOCK_REQUEST_STATUS_ARRIVED = 4;
  // The parcel never came. Only from ongoing; a late box is signed for as arrived.
  RESTOCK_REQUEST_STATUS_LOST = 5;
}

// How a restock raised BEFORE paying accounts was paid for. READ-ONLY history: restocks already made keep it
// (a-restock-must-name-the-account-that-paid), and new ones name `finance_account_id` instead.
enum RestockPaymentType {
  RESTOCK_PAYMENT_TYPE_UNSPECIFIED = 0;
  RESTOCK_PAYMENT_TYPE_SHOPEE_PAY = 1;
  RESTOCK_PAYMENT_TYPE_BANK_ACCOUNT = 2;
}

// What went wrong with units at the door. The TABLE says it happened at receiving, so the selling team bears it
// (a-loss-is-named-by-where-it-happened); a loss on a rack is batch_logs', the warehouse's. APPEND ONLY.
enum RestockProblemType {
  RESTOCK_PROBLEM_TYPE_UNSPECIFIED = 0;
  // In the box, not sellable — crushed, torn, soaked. Typed by the warehouse.
  RESTOCK_PROBLEM_TYPE_BROKEN = 1;
  // Ordered, not in the box (a-short-unit-at-the-door-is-missing). WORKED OUT, never typed: count − received.
  // Renamed in place from LOST, which meant the same and collided with a rack loss.
  RESTOCK_PROBLEM_TYPE_MISSING = 2;
}

// RestockProblemItem — units of one line that did not become stock (restock_problem_items).
message RestockProblemItem {
  RestockProblemType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  int64 count = 2 [(buf.validate.field).int64.gt = 0];
  // What they were worth, FILLED BY THE SYSTEM from the line and never editable by the warehouse
  // (the-problem-price-is-filled-by-the-system): line total × count ÷ line count.
  int64 price_unit = 3;
  int64 total = 4;
  // The WAREHOUSE's note on this row — "box crushed". Optional (a-broken-reason-is-optional); its one writer is the
  // warehouse (three-notes-one-writer-each). ⚠ Not stored until the backend step.
  string note = 5 [(buf.validate.field).string.max_len = 200];
}

// RestockPlacement — how many of a line's good units went to ONE placement. Every unit in stock is on a placement
// (there-is-no-unplaced-pile), so there is no "unplaced" option; a staging area is an ordinary placement.
message RestockPlacement {
  // A placement of the ACCEPTING warehouse — another warehouse's reads as NotFound. Renamed in place from rack_id.
  uint64 placement_id = 1 [(buf.validate.field).uint64.gt = 0];
  // 2 was `unplaced` — removed with the unplaced pile.
  reserved 2;
  reserved "unplaced";
  int64 quantity = 3 [(buf.validate.field).int64.gt = 0];
}

// One line of a restock: one product, from one store, at one price (a-product-appears-once-per-restock).
message RestockRequestItem {
  uint64 id = 1;
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  // sku/name snapshot at raise time (the product may live in another team's catalogue).
  string sku = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // How many were ORDERED. Renamed in place from `quantity`.
  int64 count = 5 [(buf.validate.field).int64.gt = 0];
  // The line's TOTAL, whole rupiah, as the invoice prints it (a-line-is-typed-as-its-total). Renamed in place from
  // `total_price`. Zero is legitimate (a sample).
  int64 total = 6 [(buf.validate.field).int64.gte = 0];
  // total ÷ count, for display only — never typed, never stored as the truth. Set on read.
  int64 price_unit = 11;

  // 7 was `received_quantity`, the SELLABLE units only. Replaced by received_count, which includes the broken ones
  // (any-warehouse-member-counts-what-arrived).
  reserved 7;
  reserved "received_quantity";
  // What arrived in the box, broken units included. 0 until accepted. Read-only here; the accept writes it.
  int64 received_count = 12;

  // Where the good units went, and what went wrong — both written by the accept, read-only here.
  repeated RestockPlacement placements = 9;
  // Renamed in place from `damaged`. Broken rows are typed at accept; missing rows are worked out.
  repeated RestockProblemItem problems = 10;

  // Who sold it, and from which store — both optional; a stall has a supplier and no store
  // (a-line-may-name-a-supplier-without-a-channel). Any team's supplier, picked from the Connect Supplier Channel
  // popup (a-line-connects-to-any-teams-supplier-from-a-popup). A store, when given, must be that supplier's.
  // ⚠ Not stored until the backend step.
  uint64 supplier_id = 13;
  uint64 supplier_channel_id = 14;

  // The SELLING team's note on the line — "extra stock" (extra-units-are-added-by-the-selling-teams-edit). ⚠ Not
  // stored until the backend step.
  string note = 15 [(buf.validate.field).string.max_len = 200];

  // 8 was `received_rack_id`, long superseded by placements.
  reserved 8;
  reserved "received_rack_id";
}

// One row of a restock's trail (every-status-change-is-logged, edits-are-in-the-same-trail): a status change, or an
// edit where from and to are the same status and the description says what changed.
message RestockLog {
  uint64 id = 1;
  RestockRequestStatus from_status = 2;
  RestockRequestStatus to_status = 3;
  // user_service id; 0 = not recorded. Resolved to a name at read time, never snapshotted.
  uint64 actor_user_id = 4;
  // Why, or what changed — "Kaos Hitam 10 → 12, extra stock".
  string description = 5;
  int64 at_unix = 6;
}

message RestockRequest {
  uint64 id = 1;
  uint64 requesting_team_id = 2;
  uint64 warehouse_id = 3;
  RestockRequestStatus status = 9;
  int64 created_at_unix = 10;

  // The lines. At least one.
  repeated RestockRequestItem items = 11;

  // The parcel — what finds the box at the door (the-receipt-is-the-tracking-number).
  // The courier's tracking number (resi). Empty = none yet.
  string receipt = 13;
  // A photo of the label. ⚠ Not stored until the backend step.
  string receipt_file = 29;
  // The courier — a shipment channel. ⚠ Not stored until the backend step.
  uint64 shipment_id = 28;

  // The money — what the selling team paid when it raised it.
  // The store's invoice or order number; one per restock (a-restock-has-one-invoice). Renamed in place from
  // `order_ref`.
  string invoice_ref_id = 15;
  // The operational account that paid (a-restock-names-its-paying-account). ⚠ Not stored until the backend step.
  uint64 finance_account_id = 27;
  // History only — see RestockPaymentType.
  RestockPaymentType payment_type = 17;
  // Freight the selling team paid. Renamed in place from `shipping_cost`.
  int64 shipment_cost = 16;
  // Σ line totals. Set on read.
  int64 subtotal = 30;
  // subtotal + shipment_cost — and NOT the courier's charge (the-couriers-charge-stays-out-of-total). Set on read.
  int64 total = 31;

  // The courier's charge at the door — paid by the warehouse on the spot, compensated by the selling team
  // (the-warehouse-cost-is-the-couriers-charge-at-the-door). One per restock, with its note
  // (the-courier-is-paid-once-per-restock). Entered at accept; 0 until then.
  int64 warehouse_additional_cost = 38;
  string warehouse_additional_cost_note = 39;

  // The SELLING team's note on the restock as a whole (three-notes-one-writer-each).
  string note = 18;

  // The inventory transaction the accept made; 0 until accepted. ⚠ Not stored until the backend step.
  uint64 transaction_id = 32;

  // Who did what, and when — user_service ids, 0 = not yet or not recorded; unix seconds, 0 = not yet.
  uint64 created_by_user_id = 20;
  uint64 arrived_by_user_id = 35;
  uint64 accepted_by_user_id = 21;
  uint64 lost_by_user_id = 36;
  uint64 cancelled_by_user_id = 24;
  int64 arrived_at_unix = 33;
  int64 accepted_at_unix = 22;
  int64 lost_at_unix = 34;
  int64 cancelled_at_unix = 23;

  // The trail, oldest first. DETAIL ONLY — List leaves it empty.
  repeated RestockLog logs = 37;

  // Removed in the rewrite.
  reserved 4, 5, 6, 7, 8, 12, 14, 19, 25, 26;
  reserved "product_id", "sku", "name", "quantity", "shipping_code", "order_id", "supplier_id", "cod_shipping_fee",
    "events", "cost_lines";
}

message RestockRequestCreateRequest {
  // The SELLING team's managers and customer service raise a restock.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 warehouse_id = 2 [(buf.validate.field).uint64.gt = 0];

  // At least one line, each product once; `id` on each is ignored.
  repeated RestockRequestItem items = 8 [(buf.validate.field).repeated.min_items = 1];

  string receipt = 10 [(buf.validate.field).string.max_len = 100];
  string receipt_file = 18 [(buf.validate.field).string.max_len = 500];
  uint64 shipment_id = 17;
  string invoice_ref_id = 12 [(buf.validate.field).string.max_len = 100];
  // REQUIRED — every restock names the account that paid (a-restock-must-name-the-account-that-paid).
  uint64 finance_account_id = 16 [(buf.validate.field).uint64.gt = 0];
  // Whole rupiah; zero is legitimate (free shipping).
  int64 shipment_cost = 13 [(buf.validate.field).int64.gte = 0];
  string note = 15 [(buf.validate.field).string.max_len = 1000];

  reserved 3, 4, 5, 6, 7, 9, 11, 14;
  reserved "product_id", "sku", "name", "quantity", "shipping_code", "order_id", "supplier_id", "payment_type";
}

message RestockRequestCreateResponse {
  RestockRequest request = 1;
}

message RestockRequestListRequest {
  // Either side — the selling team that raised it, or the warehouse it is coming to.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  RestockRequestListFilter filter = 2;
  repeated RestockRequestListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message RestockRequestListFilter {
  // ONE status; UNSPECIFIED = all of them. Server-side.
  RestockRequestStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  // Only restocks carrying THIS product on a line. 0 = no filter.
  uint64 product_id = 2;
  // Only restocks going to THIS warehouse; 0 = every warehouse. Selling side only.
  uint64 warehouse_id = 3;
  // The period, and WHICH date it is about. Both bounds 0 = every restock. A row without that date is excluded:
  // "arrived last week" cannot be true of a box that has not arrived.
  RestockDateField date_field = 4 [(buf.validate.field).enum.defined_only = true];
  int64 from_unix = 5;
  int64 to_unix = 6;
  // Free text over its number (a whole id only), the tracking number, the invoice reference, and a line's SKU or
  // name.
  string q = 7 [(buf.validate.field).string.max_len = 100];
  // Only restocks raised BY THIS TEAM; 0 = every team. Warehouse side only.
  uint64 requesting_team_id = 8;
  // By person: who raised it, who accepted it. 0 = anybody; both set = AND.
  uint64 created_by_user_id = 9;
  uint64 accepted_by_user_id = 10;
}

// Which of a restock's dates a range filter is about. APPEND ONLY.
enum RestockDateField {
  // Reads as CREATED.
  RESTOCK_DATE_FIELD_UNSPECIFIED = 0;
  RESTOCK_DATE_FIELD_CREATED = 1;
  RESTOCK_DATE_FIELD_ACCEPTED = 2;
  RESTOCK_DATE_FIELD_CANCELLED = 3;
  // When the warehouse signed for the box — a supplier's lead time is measured to it.
  RESTOCK_DATE_FIELD_ARRIVED = 4;
  RESTOCK_DATE_FIELD_LOST = 5;
}

enum RestockRequestListDataType {
  RESTOCK_REQUEST_LIST_DATA_TYPE_UNSPECIFIED = 0;
  RESTOCK_REQUEST_LIST_DATA_TYPE_GENERAL = 1;
  RESTOCK_REQUEST_LIST_DATA_TYPE_RESTOCK_REQUEST = 2;
}

message RestockRequestMapItem {
  map<uint64, RestockRequest> map_data = 1;
}

message RestockRequestListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    RestockRequestMapItem restock_request = 2;
  }
}

message RestockRequestListResponse {
  repeated RestockRequestListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message RestockRequestDetailRequest {
  // Either side, as List. A restock that is neither reads as NotFound.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message RestockRequestDetailResponse {
  RestockRequest request = 1;
}

// ── Who appears on the restocks (a-who-filter-lists-the-people-on-its-rows) ──────────────────────────────────────

// Which act the person did on the restock. APPEND ONLY.
enum RestockActorRole {
  RESTOCK_ACTOR_ROLE_UNSPECIFIED = 0;
  RESTOCK_ACTOR_ROLE_CREATED = 1;
  RESTOCK_ACTOR_ROLE_ACCEPTED = 2;
}

enum RestockActorListDataType {
  RESTOCK_ACTOR_LIST_DATA_TYPE_UNSPECIFIED = 0;
  RESTOCK_ACTOR_LIST_DATA_TYPE_ACTOR = 1;
}

enum RestockActorSort {
  RESTOCK_ACTOR_SORT_UNSPECIFIED = 0;
  // When they last did it, newest first.
  RESTOCK_ACTOR_SORT_LAST_AT = 1;
}

message RestockActorListFilter {
  RestockActorRole role = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message RestockActorListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    RestockActorSort actor = 2;
  }
}

message RestockActorListRequest {
  // Exactly RestockRequestList's roles (whoever-reads-a-list-may-filter-it).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  RestockActorListFilter filter = 2 [(buf.validate.field).required = true];
  RestockActorListFilterSort sort = 3;
  repeated RestockActorListDataType data_request = 4;
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

message RestockActorItem {
  uint64 user_id = 1;
  int64 last_at_unix = 2;
}

message RestockActorMapItem {
  map<uint64, RestockActorItem> map_data = 1;
}

message RestockActorListResponseItem {
  oneof d {
    RestockActorMapItem actor = 1;
  }
}

message RestockActorListResponse {
  repeated RestockActorListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// RestockInboundPreview — what is still ON ITS WAY OR AT THE DOOR for this warehouse: ongoing and arrived restocks.
// Server-side totals over the whole queue, never over the visible page.
message RestockInboundPreview {
  // Deliveries — not products, not pieces.
  int64 restock_count = 5;
  // Distinct products.
  int64 product_count = 1;
  // Pieces ORDERED — nobody has counted them yet.
  int64 unit_count = 2;
  // The line totals, whole rupiah. Freight and the courier's charge are not the goods' worth.
  int64 amount = 3;
  // When the longest-waiting one was raised, unix seconds; 0 when nothing is waiting.
  int64 oldest_pending_unix = 4;
}

message RestockInboundStatFilter {
  // 0 = every requesting team.
  uint64 requesting_team_id = 1;
}

message RestockInboundStatRequest {
  // Warehouse side only.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  RestockInboundStatFilter filter = 2;
}

message RestockInboundStatResponse {
  RestockInboundPreview preview = 1;
}

message RestockRequestUpdateRequest {
  // The selling team edits its own restock. The warehouse does not edit what it is sent; it signs and counts.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // Scoped to the RAISING team. A full REPLACE — the edit screen is the create form re-opened.
  //
  //   ongoing  → every field.
  //   arrived  → the LINES only: count, total, note, and new lines may be added but none removed
  //              (the-lines-stay-editable-until-accepted, lines-can-be-added-not-removed-while-arrived). Any other
  //              field that differs is refused.
  //   anything else → FailedPrecondition.
  //
  // An edit that changes the amount sends the difference; one that moves the paying account moves the whole amount
  // (an-edit-sends-the-difference, an-edit-may-move-the-payment-to-another-account). Every edit is a trail row.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];

  uint64 warehouse_id = 3 [(buf.validate.field).uint64.gt = 0];
  repeated RestockRequestItem items = 5 [(buf.validate.field).repeated.min_items = 1];
  string receipt = 6 [(buf.validate.field).string.max_len = 100];
  string receipt_file = 15 [(buf.validate.field).string.max_len = 500];
  uint64 shipment_id = 14;
  string invoice_ref_id = 8 [(buf.validate.field).string.max_len = 100];
  // REQUIRED while ongoing (above 0). While arrived it must EQUAL the stored value — and a restock raised before paying
  // accounts stores 0 — so the rule is the handler's, not a field constraint that would lock such a restock's lines.
  uint64 finance_account_id = 13;
  int64 shipment_cost = 9 [(buf.validate.field).int64.gte = 0];
  string note = 11 [(buf.validate.field).string.max_len = 1000];

  reserved 4, 7, 10, 12;
  reserved "shipping_code", "supplier_id", "payment_type";
}

message RestockRequestUpdateResponse {
  RestockRequest request = 1;
}

message RestockRequestArriveRequest {
  // The WAREHOUSE signs for the box — any member (the-warehouse-signs-and-accepts-the-team-does-the-rest).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The receiving warehouse — must be the restock's.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message RestockRequestArriveResponse {
  RestockRequest request = 1;
}

message RestockRequestAcceptRequest {
  // The receiving WAREHOUSE counts the box in — any member (any-warehouse-member-counts-what-arrived).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The accepting warehouse — must be the restock's. Accept locks the restock and takes it from ongoing or arrived
  // only (accept-locks-the-restock).
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];

  // One entry per line, EVERY line exactly once — accepting IS the count.
  repeated RestockRequestReceivedLine lines = 3 [(buf.validate.field).repeated.min_items = 1];

  // The courier's charge at the door, whole rupiah; 0 = none (the-courier-is-paid-once-per-restock). Its note is
  // REQUIRED when it is above 0 — the handler checks, since a rule across two fields cannot be written here
  // (an-incidental-line-must-say-what-it-was-for).
  int64 warehouse_additional_cost = 6 [(buf.validate.field).int64.gte = 0];
  string warehouse_additional_cost_note = 7 [(buf.validate.field).string.max_len = 200];

  reserved 4, 5;
  reserved "cod_shipping_fee", "cost_lines";
}

// One line's count at the door.
message RestockRequestReceivedLine {
  // The RestockRequestItem being counted.
  uint64 item_id = 1 [(buf.validate.field).uint64.gt = 0];

  // What is IN THE BOX, broken units included. Never above the line's count — more than ordered is the selling
  // team's edit to make first (accept-refuses-more-than-the-line-says). Below it, the difference is written as a
  // MISSING row (a-short-unit-at-the-door-is-missing).
  int64 received_count = 7 [(buf.validate.field).int64.gte = 0];
  // How many of those are broken; never above received_count.
  int64 broken_count = 8 [(buf.validate.field).int64.gte = 0];
  // The warehouse's optional notes on the broken and the missing rows (a-broken-reason-is-optional).
  string broken_note = 9 [(buf.validate.field).string.max_len = 200];
  string missing_note = 10 [(buf.validate.field).string.max_len = 200];

  // Where the GOOD units went — received − broken, exactly. Empty when there are none.
  repeated RestockPlacement placements = 5;

  reserved 2, 3, 4, 6;
  reserved "received_quantity", "rack_id", "unplaced", "place", "damaged";
}

message RestockRequestAcceptResponse {
  RestockRequest request = 1;
}

message RestockRequestMarkLostRequest {
  // The SELLING team gives the parcel up (lost-is-set-only-before-the-box-arrives).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Why — kept on the trail row. Optional.
  string description = 3 [(buf.validate.field).string.max_len = 200];
}

message RestockRequestMarkLostResponse {
  RestockRequest request = 1;
}

message RestockRequestCancelRequest {
  // The SELLING team calls off its own ONGOING restock (a-restock-is-cancelled-only-while-ongoing).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Did the money come back? Yes posts a refund into the paying account; no posts nothing
  // (a-restock-names-its-paying-account).
  bool money_returned = 3;
}

message RestockRequestCancelResponse {
  RestockRequest request = 1;
}

message RestockRequestLabelsRequest {
  // Warehouse side only — printed by the crew that just shelved the restock.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// One printable label = one PLACEMENT of good units. A line split across two placements is two labels sharing one
// batch — one batch per line (one-batch-per-line). Broken and missing units never became stock, so never appear.
message RestockLabel {
  uint64 product_id = 1;
  string sku = 2;
  string name = 3;
  // The batch the line minted.
  uint64 batch_id = 4;
  int64 quantity = 5;
  // The placement's code ("A-01-3"). Renamed in place from rack_code.
  string placement_code = 6;
  // 7 was `unplaced` — every unit is on a placement now.
  reserved 7;
  reserved "unplaced";
  // Per-unit landed price for this restock, the courier's charge included.
  int64 hpp = 8;
}

message RestockRequestLabelsResponse {
  uint64 restock_id = 1;
  int64 received_at_unix = 2;
  repeated RestockLabel labels = 3;
  // Units broken or missing — they never became stock, so got no label.
  int64 excluded_count = 4;
}
