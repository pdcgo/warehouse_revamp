    RestockActorMapItem actor = 1;
  }
}

message RestockActorListResponse {
  repeated RestockActorListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// RestockInboundPreview — what is still ON ITS WAY OR AT THE DOOR for this warehouse: ongoing and arrived restocks.
// Server-side totals over the whole queue, never over the visible page.
message RestockInboundPreview {
  // Deliveries — not products, not pieces.
  int64 restock_count = 5;
  // Distinct products.
  int64 product_count = 1;
  // Pieces ORDERED — nobody has counted them yet.
  int64 unit_count = 2;
  // The line totals. Freight and the courier's charge are not the goods' worth.
  double amount = 3;
  // When the longest-waiting one was raised, unix seconds; 0 when nothing is waiting.
  int64 oldest_pending_unix = 4;
}

message RestockInboundStatFilter {
  // 0 = every requesting team.
  uint64 requesting_team_id = 1;
}

message RestockInboundStatRequest {
  // Warehouse side only.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  RestockInboundStatFilter filter = 2;
}

message RestockInboundStatResponse {
  RestockInboundPreview preview = 1;
}

// RestockCodPaidStatRequest — the warehouse list's *Ongkir COD dibayar* card (the-warehouse-sees-the-cod-it-paid). The
// warehouse's OWN money only: what it handed the courier at the door, entered at accept
// (the-warehouse-cost-is-the-couriers-charge-at-the-door). Never the restock's value, never the selling team's freight —
// what the goods cost is the selling team's business. Warehouse side only, RestockInboundStat's roles: the card sits in
// the same strip, read by whoever reads the queue.
message RestockCodPaidStatRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The warehouse — the scope. Only restocks going TO it count.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The window, on WHEN THE RESTOCK WAS ACCEPTED, unix seconds, both ends inclusive — as the list's accepted-date filter
  // reads its bounds. The screen asks for this Jakarta month: 00:00 WIB of the 1st through 23:59:59 WIB today.
  int64 from_unix = 2 [(buf.validate.field).int64.gt = 0];
  int64 to_unix = 3 [(buf.validate.field).int64.gt = 0];

  option (buf.validate.message).cel = {
    id: "restock_cod_paid_stat.window"
    message: "to_unix must not be before from_unix"
    expression: "this.to_unix >= this.from_unix"
  };
}

// The COD the warehouse paid in the window: the restocks it accepted that carried a courier's charge (above 0), and the
// charges summed. A restock with no charge is not counted — the card's line says how many it PAID on.
message RestockCodPaidStatResponse {
  int64 restock_count = 1;
  // Rupiah, double (money-is-double-in-the-api-too).
  double amount = 2;
}

// ── The selling restock list's statistics (the-restock-statistics-count-transactions-under-the-tabs) ───────────────────

// RestockSellingStatRequest — the cards under the selling team's restock tabs and Rincian's value per paying account.
//
// THE SAME SET AS THE LIST: the list's own filter, read through the list's one predicate, so a card and the rows under it
// cannot disagree about which restocks a filter means. Its `status` is IGNORED — the census answers every status at once
// and the tab picks the pile.
//
// THE SELLING SIDE ONLY: the restocks this team RAISED (`team_id` = the scoped team), never the list's other side, the
// restocks coming to it as a warehouse. No warehouse role — a warehouse sees no restock money
// (the-warehouse-sees-the-cod-it-paid); the selling roles that read the list, Root and the Administrator.
message RestockSellingStatRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The list's filter — every field but `status`, which is ignored.
  RestockRequestListFilter filter = 2;
}

// One pile — a status, or every status (the total). A live census over the filter's restocks, not a window of its own.
message RestockSellingPile {
  // UNSPECIFIED on the total.
  RestockRequestStatus status = 1;
  // Restocks — transactions, not lines.
  int64 restock_count = 2;
  // *Jumlah barang*: the pieces ORDERED on their lines, on every status, an accepted one included
  // (jumlah-barang-counts-the-pieces-ordered) — the rows' *N pcs* summed.
  int64 unit_count = 3;
  // *Jumlah SKU*: DIFFERENT products across the pile's lines, not lines. The total's is counted over every status at
  // once — a product on an ongoing and an accepted restock is one product, never the larger of the piles'.
  int64 product_count = 4;
  // *Nilai barang*: Σ `subtotal`, the lines' totals. Rupiah, double (money-is-double-in-the-api-too).
  double goods_value = 5;
  // Σ `shipment_cost` — the freight the selling team paid, inside `value`.
  double shipment_cost = 6;
  // *Ongkir COD*: Σ `warehouse_additional_cost` — what the warehouse paid the courier at the door
  // (the-warehouse-cost-is-the-couriers-charge-at-the-door). OUTSIDE `value` (the-couriers-charge-stays-out-of-total).
  double courier_charge = 7;
  // *Nilai transaksi*: Σ `total` = goods + shipping — what the paying accounts were charged.
  double value = 8;
}

// One status's restocks paid from one account (a-restock-names-its-paying-account) — Rincian's row. The account is the
// restock's CURRENT one: an edit may move it, and the row reads what the restock says now.
message RestockSellingAccount {
  RestockRequestStatus status = 1;
  // A financial_account_service id. 0 = a restock raised before naming its account was required — kept as a row of its
  // own, so a status's rows add up to its card.
  uint64 finance_account_id = 2;
  int64 restock_count = 3;
  // Σ `total` — goods + shipping, as the card's.
  double value = 4;
}

message RestockSellingStatResponse {
  // Every status at once.
  RestockSellingPile total = 1;
  // One entry per status that HAS restocks under the filter; a status with none is absent rather than a zero row (the
  // OrderStat convention — the caller knows the enum and draws the gaps).
  repeated RestockSellingPile by_status = 2;
  // Per status × paying account; the rows of a status add up to its pile's `restock_count` and `value`.
  repeated RestockSellingAccount by_account = 3;
}

// ── The selling restock list as a file (the-restock-list-exports-and-filters-by-courier) ─────────────────────────────

// RestockRequestExportRequest — Ekspor on the selling restock list. Whoever may read that list may export it (the order
// list's rule, OrderExportRequest): the selling roles, Root and the Administrator. No warehouse role — the file carries
// what the restocks cost, and a warehouse sees no restock money (the-warehouse-sees-the-cod-it-paid).
//
// THE SAME SET AS THE LIST: the list's own filter through the list's one predicate, narrowed — as the statistics are —
// to the restocks this team RAISED. A selling team is never a restock's warehouse, so for one that narrows nothing the
// list shows.
message RestockRequestExportRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The list's own filter — the status tab included.
  RestockRequestListFilter filter = 2;
}

// One message of the stream (code-implementation-guideline.md): a log line, the progress, and — on the last message —
// the file.
message RestockRequestExportResponse {
  // A sentence about the step.
  string message = 1;
  // Restocks written so far, of the total the filter holds.
  int64 done = 2;
  int64 total = 3;
  // Set on the LAST message only: the file's expiring link, and its name.
  string download_url = 4;
  string filename = 5;
}

// ── Several restocks by id (the-labels-mark-their-one-by-one-read) ─────────────────────────────────────────────────

// RestockRequestByIdsRequest — Cetak Label's one read for every restock on the print. Warehouse side only, as
// RestockRequestLabels: the crew that shelved the goods prints them. Each slice keeps the scope of the one-restock read
// it stands for — RESTOCK_REQUEST is Detail's (raised by the team, or going to it), LABELS is Labels' (going to it,
// accepted). An id outside that scope, or unknown, is ABSENT from the answer: the id itself must not confirm it exists.
message RestockRequestByIdsRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  RestockRequestByIdsFilter filter = 2 [(buf.validate.field).required = true];
  // Empty defaults to the RESTOCK_REQUEST slice.
  repeated RestockRequestByIdsDataType data_request = 3;
}

message RestockRequestByIdsFilter {
  // At most 50 — a print holds at most fifty restocks (at-most-fifty-restocks-a-print), so the read is bounded by what
  // its one screen can ask (HARD RULE 9's capped read).
  repeated uint64 ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

enum RestockRequestByIdsDataType {
  RESTOCK_REQUEST_BY_IDS_DATA_TYPE_UNSPECIFIED = 0;
  // The restock as the LIST reads it — its lines, no trail, no problems.
  RESTOCK_REQUEST_BY_IDS_DATA_TYPE_RESTOCK_REQUEST = 1;
  // An ACCEPTED restock's printable labels, exactly as RestockRequestLabels answers them. A restock not accepted has
  // none, so it carries no LABELS item — never an error for the whole read.
  RESTOCK_REQUEST_BY_IDS_DATA_TYPE_LABELS = 2;
}

// One accepted restock's labels — RestockRequestLabelsResponse's figures, without the id the map is keyed by.
message RestockLabelSet {
  int64 received_at_unix = 1;
  repeated RestockLabel labels = 2;
  // Units broken or missing — they never became stock, so got no label.
  int64 excluded_count = 3;
}

message RestockRequestByIdsResponseItem {
  oneof d {
    RestockRequest restock_request = 1;
    RestockLabelSet labels = 2;
  }
}

message RestockRequestByIdsResponseList {
  repeated RestockRequestByIdsResponseItem items = 1;
}

message RestockRequestByIdsResponse {
  // Keyed by restock id; an id outside the caller's scope, or unknown, is absent.
  map<uint64, RestockRequestByIdsResponseList> items = 1;
}

message RestockRequestUpdateRequest {
  // The selling team edits its own restock. The warehouse does not edit what it is sent; it signs and counts.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // Scoped to the RAISING team. A full REPLACE — the edit screen is the create form re-opened.
  //
  //   ongoing  → every field.
  //   arrived  → the LINES only: count, total, note, and new lines may be added but none removed
  //              (the-lines-stay-editable-until-accepted, lines-can-be-added-not-removed-while-arrived). A NEW line
  //              may name its supplier and store; a stored line's stay as stored
  //              (a-line-added-after-arrival-names-its-supplier). Any other field that differs is refused.
  //   anything else → FailedPrecondition.
  //
  // An edit that changes the amount sends the difference; one that moves the paying account moves the whole amount
  // (an-edit-sends-the-difference, an-edit-may-move-the-payment-to-another-account). Every edit is a trail row.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];

  uint64 warehouse_id = 3 [(buf.validate.field).uint64.gt = 0];
  repeated RestockRequestItem items = 5 [(buf.validate.field).repeated.min_items = 1];
  string receipt = 6 [(buf.validate.field).string.max_len = 100];
  string receipt_file = 15 [(buf.validate.field).string.max_len = 500];
  uint64 shipment_id = 14;
  string invoice_ref_id = 8 [(buf.validate.field).string.max_len = 100];
  // REQUIRED while ongoing (above 0). While arrived it must EQUAL the stored value — and a restock raised before paying
  // accounts stores 0 — so the rule is the handler's, not a field constraint that would lock such a restock's lines.
  uint64 finance_account_id = 13;
  double shipment_cost = 9 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  string note = 11 [(buf.validate.field).string.max_len = 1000];

  reserved 4, 7, 10, 12;
  reserved "shipping_code", "supplier_id", "payment_type";
}

message RestockRequestUpdateResponse {
  RestockRequest request = 1;
}

message RestockRequestArriveRequest {
  // The WAREHOUSE signs for the box — any member (the-warehouse-signs-and-accepts-the-team-does-the-rest).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The receiving warehouse — must be the restock's.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];

  // THE COURIER'S CHARGE AT THE DOOR, NOTED AS THE BOX IS SIGNED FOR (the-courier-charge-is-noted-at-tiba-and-final-at-terima):
  // optional, 0 = none — the same three fields as Terima's, under the same rules. Its note is optional
  // (the-couriers-charge-note-is-optional), as Accept's is. Kept on the restock in the
  // columns Terima writes, and shown; Terima opens with it and its figure is FINAL, replacing this one, never adding to it
  // (the-courier-is-paid-once-per-restock). No money moves here: the selling team owes the warehouse only from Terima.
  double warehouse_additional_cost = 3 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  string warehouse_additional_cost_note = 4 [(buf.validate.field).string.max_len = 200];
  // A PHOTO OF THE COURIER'S SLIP, optional (the-courier-slip-has-an-optional-photo): the document id of this warehouse's
  // upload (an order receipt, as at Terima), "" = none. Kept only beside a charge above 0 — with none it is dropped.
  string warehouse_additional_cost_file = 5 [(buf.validate.field).string.max_len = 500];
}

message RestockRequestArriveResponse {
  RestockRequest request = 1;
}

message RestockRequestAcceptRequest {
  // The receiving WAREHOUSE counts the box in — any member (any-warehouse-member-counts-what-arrived).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The accepting warehouse — must be the restock's. Accept locks the restock and takes it from ongoing or arrived
  // only (accept-locks-the-restock).
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];

  // One entry per line, EVERY line exactly once — accepting IS the count.
  repeated RestockRequestReceivedLine lines = 3 [(buf.validate.field).repeated.min_items = 1];

  // The courier's charge at the door; 0 = none (the-courier-is-paid-once-per-restock). Its note is optional
  // (the-couriers-charge-note-is-optional): a charge with no note is accepted.
  double warehouse_additional_cost = 6 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  string warehouse_additional_cost_note = 7 [(buf.validate.field).string.max_len = 200];
  // A PHOTO OF THE COURIER'S SLIP, optional (the-courier-slip-has-an-optional-photo): the document id of this warehouse's
  // upload (document_service, an order receipt — the restock's label photo's type), "" = none. Kept on the restock only
  // beside a charge above 0 — with none there is no slip to keep, and it is dropped.
  string warehouse_additional_cost_file = 8 [(buf.validate.field).string.max_len = 500];

  reserved 4, 5;
  reserved "cod_shipping_fee", "cost_lines";
}

// One line's count at the door.
message RestockRequestReceivedLine {
  // The RestockRequestItem being counted.
  uint64 item_id = 1 [(buf.validate.field).uint64.gt = 0];

  // What is IN THE BOX, broken units included. Never above the line's count — more than ordered is the selling
  // team's edit to make first (accept-refuses-more-than-the-line-says). Below it, the difference is written as a
  // MISSING row (a-short-unit-at-the-door-is-missing).
  int64 received_count = 7 [(buf.validate.field).int64.gte = 0];
  // How many of those are broken; never above received_count.
  int64 broken_count = 8 [(buf.validate.field).int64.gte = 0];
  // The warehouse's optional notes on the broken and the missing rows (a-broken-reason-is-optional).
  string broken_note = 9 [(buf.validate.field).string.max_len = 200];
  string missing_note = 10 [(buf.validate.field).string.max_len = 200];

  // Where the GOOD units went — received − broken, exactly. Empty when there are none.
  repeated RestockPlacement placements = 5;

  // The expiry read off the box (the-warehouse-types-the-expiry-at-the-accept): a Jakarta day, YYYY-MM-DD — optional,
  // empty = none, and a box mixing several printed dates takes the soonest. It goes on the batch this line mints
  // (`batches.expired_at`, that day's Jakarta midnight); a line with no good units mints no batch, so its date is stored
  // nowhere. A past day is allowed — the box says what it says (the-expiry-prototypes-are-accepted).
  string expires_on = 11 [(buf.validate.field).string.pattern = "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"];

  // A PHOTO OF THE BROKEN UNITS, optional, one per line (a-broken-product-carries-a-photo): the document id of this
  // warehouse's upload (document_service, an order receipt — the restock's label photo's type), "" = none. Kept on the
  // line's broken row; a line with no broken unit writes no such row, so its photo is stored nowhere.
  string broken_photo_file = 12 [(buf.validate.field).string.max_len = 500];

  reserved 2, 3, 4, 6;
  reserved "received_quantity", "rack_id", "unplaced", "place", "damaged";
}

message RestockRequestAcceptResponse {
  RestockRequest request = 1;
}

message RestockRequestMarkLostRequest {
  // The SELLING team gives the parcel up (lost-is-set-only-before-the-box-arrives).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Why — kept on the trail row. Optional.
  string description = 3 [(buf.validate.field).string.max_len = 200];
}

message RestockRequestMarkLostResponse {
  RestockRequest request = 1;
}

message RestockRequestCancelRequest {
  // The SELLING team calls off its own ONGOING restock (a-restock-is-cancelled-only-while-ongoing).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Did the money come back? Yes posts a refund into the paying account; no posts nothing
  // (a-restock-names-its-paying-account).
  bool money_returned = 3;
}

message RestockRequestCancelResponse {
  RestockRequest request = 1;
}

message RestockRequestLabelsRequest {
  // Warehouse side only — printed by the crew that just shelved the restock.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// One printable label = one PLACEMENT of good units. A line split across two placements is two labels sharing one
// batch — one batch per line (one-batch-per-line). Broken and missing units never became stock, so never appear.
message RestockLabel {
  uint64 product_id = 1;
  string product_code = 2;
  string name = 3;
  // The batch the line minted.
  uint64 batch_id = 4;
  int64 quantity = 5;
  // The placement's code ("A-01-3"). Renamed in place from rack_code.
  string placement_code = 6;
  // 7 was `unplaced` — every unit is on a placement now.
  reserved 7;
  reserved "unplaced";
  // Per-unit landed price for this restock, the courier's charge included — the batch's price, as stored.
  double hpp = 8;
}

message RestockRequestLabelsResponse {
  uint64 restock_id = 1;
  int64 received_at_unix = 2;
  repeated RestockLabel labels = 3;
  // Units broken or missing — they never became stock, so got no label.
  int64 excluded_count = 4;
}

// The restock's label photo, for the warehouse it is going to (the-restocks-warehouse-opens-its-label-photo). The
// selling team keeps opening its own upload with document_service's GetDownloadUrl, as the file's owner.
message RestockReceiptPhotoRequest {
  // The restock's own warehouse — and Root and the Administrator, who name the warehouse as team_id.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The warehouse — the scope. The restock must be going to it; another warehouse's reads as NotFound.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// A short-lived signed link, minted per call — never stored, never rendered as an href. A restock with no photo (none
// attached, or the file is gone) is FailedPrecondition instead.
message RestockReceiptPhotoResponse {
  string url = 1;
  int64 expires_at_unix = 2;
}

// THE PHOTOS TAKEN AT THE DOOR (the-detail-pages-show-the-broken-photo, the-detail-pages-show-the-slip-and-the-broken-rack)
// — read back on BOTH detail pages, so either side of the restock: its selling team (`team_id` = the restock's team) or
// its receiving warehouse (`team_id` = its `warehouse_id`) — RestockRequestDetail's two sides and roles, exactly. Any
// other team reads NotFound, as an id that does not exist. Root and the Administrator name either side as team_id.
//
// The photos are the WAREHOUSE's uploads (it photographed them at Terima), so document_service is told the restock's
// warehouse owns them — inventory's finding, never the browser's — and signs each from its own table; no share is
// written. A photo whose file is gone is left out of the answer.
message RestockDoorPhotosRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// One line's broken units, photographed — the line is its product (a-product-appears-once-per-restock).
message RestockBrokenPhoto {
  uint64 product_id = 1;
  string url = 2;
}

// Short-lived signed links, minted per call — never stored. Bounded by ONE restock: at most one slip and one photo per
// line, so it is not paged (a restock's lines are not, either).
message RestockDoorPhotosResponse {
  // The courier's slip; "" when the restock keeps none.
  string courier_slip_url = 1;
  // Each line whose broken units were photographed, in product id order; the others are absent.
  repeated RestockBrokenPhoto broken = 2;
  // When the links stop opening (unix seconds); 0 when there are none.
  int64 expires_at_unix = 3;
}

// RestockReceivedCountCorrectRequest — KOREKSI JUMLAH TERIMA on a restock. WHO (the-received-count-prototype-is-accepted):
// the RECEIVING warehouse's Owner or Admin — `team_id`, scoped, the restock's warehouse — plus Root and the System
// Administrator, stamped an override from outside (an-override-is-stamped-in-every-service). Never Staff, never the
// selling team, never a monitor; another warehouse's restock is NotFound.
//
// Refused, nothing written: an empty or space-only reason (InvalidArgument); a line named twice or not on the restock, a
// line with no change, a count below the line's broken units, or above what was ordered — a unit over the line is found
// stock, Adjust › Found (accept-refuses-more-than-the-line-says) (InvalidArgument); a rack of another warehouse
// (NotFound); and under the restock's row lock: a restock not accepted, a stale line (`expected_received_count` is no
// longer its count), more units out than the batch or the named rack still holds (a-shelf-never-goes-below-zero), or a
// product a running stock count holds on that rack (a-lock-stops-sales-and-cancels-too) (FailedPrecondition each).
message RestockReceivedCountCorrectRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  // The RECEIVING warehouse — the restock's `warehouse_id`.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
  // WHY — required, at most 200 (trimmed on the server); on the correction rows, the transaction and its log rows.
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The lines that CHANGE — at least one; a line left as it was is not sent.
  repeated ReceivedCountLine lines = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 500
  }];
}

message RestockReceivedCountCorrectResponse {
  // The restock as Detail reads it for the warehouse — the corrected counts and the new history rows.
  RestockRequest request = 1;
}

// THE SELLING TEAM'S NOTE, ALONE, IN ANY STATUS (owner: "catatan bisa diedit kapanpun", the-note-is-edited-in-any-status).
// Its one writer is the selling team (three-notes-one-writer-each), so the roles are RestockRequestUpdate's and the scope
// is the RAISING team: another team's restock — the receiving warehouse's included — reads NotFound. Every status takes
// it: ongoing, arrived, accepted, lost and cancelled. Only `note` changes; the rest of the restock, its lines and its
// money stay as stored, so no money event is sent. A note equal to the stored one changes nothing and writes nothing.
// A changed one stamps the note's writer and time (RestockRequest.note_by_user_id / note_at_unix) and writes an edit's
// row on the trail — the status unchanged — with ONE change under it, the note before and after
// (edits-are-in-the-same-trail).
message RestockRequestNoteSetRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
  // The whole note as it should now read — the same limit as the raise and the edit; empty clears it.
  string note = 3 [(buf.validate.field).string.max_len = 1000];
}

message RestockRequestNoteSetResponse {
  RestockRequest request = 1;
}

// THE RECEIVING WAREHOUSE'S OWN NOTE (the-warehouse-writes-its-own-note: *"bisa mengubah catatan warehouse"*). Its one
// writer is the warehouse (three-notes-one-writer-each, the-notes-are-one-per-writer), so the roles are the warehouse's —
// any member, as signing for the box is — and the scope is the RECEIVING warehouse: another team's restock, the raising
// selling team's included, reads NotFound. A SEPARATE request from RestockRequestNoteSet because the ACL lives on the
// message: the two notes have different writers and different scopes.
//
// FROM WHICH STATUS the warehouse may write it is NOT decided (the owner: *"aku tidak punya hak untuk memutuskannya"*,
// the-notes-are-one-per-writer) — so no status is refused here: the warehouse's restock page offers its Ubah in every
// status, and this takes it in every status. Only `warehouse_note` changes; nothing else of the restock moves and no
// money event is sent. A note equal to the stored one changes nothing and writes nothing. A changed one stamps its writer
// and time (RestockRequest.warehouse_note_by_user_id / warehouse_note_at_unix) and writes an edit's row on the trail — the
// status unchanged — with ONE change under it, RESTOCK_LOG_CHANGE_FIELD_WAREHOUSE_NOTE before and after.
message RestockRequestWarehouseNoteSetRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The receiving warehouse — must be the restock's.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 request_id = 2 [(buf.validate.field).uint64.gt = 0];
  // The whole note as it should now read — the selling note's limit (both are edited by one editor); empty clears it.
  string note = 3 [(buf.validate.field).string.max_len = 1000];
}

message RestockRequestWarehouseNoteSetResponse {
  RestockRequest request = 1;
}

// The restock as the selling team now reads it — settled, its problem tags off.
message RestockRequestSettleResponse {
  RestockRequest request = 1;
}
