// ── OpnameRowList ────────────────────────────────────────────────────────────────────────────────────────────────

message OpnameRowListRequest {
  // NOT staff: every row carries the book figure, which a counter must not see before counting
  // (a-count-is-blind-then-revealed).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OpnameRowListFilter filter = 2 [(buf.validate.field).required = true];
  repeated OpnameRowListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message OpnameRowListFilter {
  uint64 session_id = 1 [(buf.validate.field).uint64.gt = 0];
  // One rack; 0 = every rack.
  uint64 placement_id = 2;
  // One status; UNSPECIFIED = both.
  OpnameRowStatus status = 3 [(buf.validate.field).enum.defined_only = true];
  // Only rows whose count stands apart from the book.
  bool only_differences = 4;
  // Free text over the product's SKU or name.
  string q = 5 [(buf.validate.field).string.max_len = 100];
}

enum OpnameRowListDataType {
  OPNAME_ROW_LIST_DATA_TYPE_UNSPECIFIED = 0;
  OPNAME_ROW_LIST_DATA_TYPE_GENERAL = 1;
  OPNAME_ROW_LIST_DATA_TYPE_ROW = 2;
}

message OpnameRowMapItem {
  map<uint64, OpnameRow> map_data = 1;
}

message OpnameRowListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    OpnameRowMapItem row = 2;
  }
}

message OpnameRowListResponse {
  repeated OpnameRowListResponseItem items = 1;
  // By rack code, then product name.
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// ── OpnameRowSendBack ────────────────────────────────────────────────────────────────────────────────────────────

message OpnameRowSendBackRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 row_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message OpnameRowSendBackResponse {
  // FailedPrecondition unless the row is counted and its session active.
  OpnameRow row = 1;
}

// ── OpnameFinalizePreview / OpnameSessionFinalize ────────────────────────────────────────────────────────────────

message OpnameFinalizePreviewRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 session_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// What one product's settlement posts. APPEND ONLY.
enum OpnamePostType {
  OPNAME_POST_TYPE_UNSPECIFIED = 0;
  // A broken problem row, claimable 0 — the warehouse pays (broken_good).
  OPNAME_POST_TYPE_BROKEN = 1;
  // A lost problem row, claimable — the warehouse pays (lost_good).
  OPNAME_POST_TYPE_LOST = 2;
  // A surplus claiming an open lost row back into its batch — the warehouse's money returns (found).
  OPNAME_POST_TYPE_CLAIM = 3;
  // A surplus with nothing to claim, minted as a batch at the team's last price here — no money moves.
  OPNAME_POST_TYPE_MINT = 4;
}

// One posting line, per batch (a-shortage-writes-a-row-per-batch, broken-takes-its-batch-before-lost).
message OpnamePostLine {
  OpnamePostType type = 1;
  // The batch taken from, claimed back into, or 0 for a mint.
  uint64 batch_id = 2;
  int64 stock_count = 3;
  // Rupiah: the batch's price; a mint's is the team's newest batch price here (last-price-is-the-teams-newest-batch-here).
  int64 price_unit = 4;
  int64 amount = 5;
  // A claim: the lost problem it claims.
  uint64 problem_id = 6;
}

// One product of the session, settled over all its racks.
message OpnameFinalizeProduct {
  uint64 team_id = 1;
  uint64 product_id = 2;
  string product_sku = 3;
  string product_name = 4;
  // The book, summed over its rows.
  int64 book_count = 5;
  // The counts that stand, summed.
  int64 sellable_count = 6;
  // The drafts' broken, summed — posted as written.
  int64 broken_count = 7;
  // sellable − (book − broken): below 0 lost, above 0 surplus, 0 a move between racks.
  int64 rest_count = 8;
  // How many of its racks change.
  int64 rack_change_count = 9;
  repeated OpnamePostLine lines = 10;
}

// Why finalize is refused for this person now. APPEND ONLY.
enum OpnameFinalizeBlock {
  // Nothing: it may finalize.
  OPNAME_FINALIZE_BLOCK_UNSPECIFIED = 0;
  OPNAME_FINALIZE_BLOCK_NOT_ACTIVE = 1;
  OPNAME_FINALIZE_BLOCK_ROWS_NOT_COUNTED = 2;
  // The caller counted one of its rows (nobody-finalizes-their-own-count).
  OPNAME_FINALIZE_BLOCK_OWN_COUNT = 3;
}

message OpnameFinalizePreviewResponse {
  // Every product with a difference or a rack change, by team then name. A product whose racks all match is left out.
  repeated OpnameFinalizeProduct products = 1;
  // Rupiah: broken + lost — the warehouse owes the teams.
  int64 owed_amount = 2;
  // Rupiah: claims — the teams pay the warehouse back.
  int64 claimed_amount = 3;
  // Rupiah: what the minted batches are worth.
  int64 minted_amount = 4;
  OpnameFinalizeBlock block = 5;
}

message OpnameSessionFinalizeRequest {
  // The warehouse team's Owner or Admin — or Root — and never a counter of the session (nobody-finalizes-their-own-count).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 session_id = 2 [(buf.validate.field).uint64.gt = 0];
}

// One owning team's share of a finalize: one opname transaction per team (a-snapshot-row-names-its-transaction).
message OpnameTransaction {
  uint64 transaction_id = 1;
  uint64 team_id = 2;
}

message OpnameSessionFinalizeResponse {
  // FailedPrecondition for any OpnameFinalizeBlock.
  OpnameSession session = 1;
  repeated OpnameTransaction transactions = 2;
}

// ── OpnameRackList ───────────────────────────────────────────────────────────────────────────────────────────────

message OpnameRackListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OpnameRackListFilter filter = 2 [(buf.validate.field).required = true];
  repeated OpnameRackListDataType data_request = 3;
  warehouse.common.v1.CommonPagination page = 4 [(buf.validate.field).required = true];
}

message OpnameRackListFilter {
  uint64 session_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Free text over the rack's code.
  string q = 2 [(buf.validate.field).string.max_len = 100];
}

enum OpnameRackListDataType {
  OPNAME_RACK_LIST_DATA_TYPE_UNSPECIFIED = 0;
  OPNAME_RACK_LIST_DATA_TYPE_GENERAL = 1;
  OPNAME_RACK_LIST_DATA_TYPE_RACK = 2;
}

// One rack to visit.
message OpnameRack {
  uint64 placement_id = 1;
  string code = 2;
  // 0 for a rack an `all` session lists empty.
  int64 row_count = 3;
  int64 counted_row_count = 4;
}

message OpnameRackMapItem {
  map<uint64, OpnameRack> map_data = 1;
}

message OpnameRackListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    OpnameRackMapItem rack = 2;
  }
}

message OpnameRackListResponse {
  repeated OpnameRackListResponseItem items = 1;
  // By rack code.
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// ── OpnameRackCount ──────────────────────────────────────────────────────────────────────────────────────────────

message OpnameRackCountRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 session_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 placement_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message OpnameRackCountResponse {
  OpnameRack rack = 1;
  // EVERY row on the rack, unpaged: it is bounded by what one shelf holds, not by the data. By product name. A row not
  // yet revealed carries system_stock_count 0 — the counter never sees the book before counting.
  repeated OpnameRow rows = 2;
}

// ── OpnameRowCount ───────────────────────────────────────────────────────────────────────────────────────────────

message OpnameRowCountRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 row_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Sellable units only — a torn one is taken off the rack and not counted (a-count-is-of-sellable-units).
  int64 count = 3 [(buf.validate.field).int64.gte = 0];
}

message OpnameRowCountResponse {
  // Revealed: the book figure, the difference, and the system's draft — lost for the shortage, or surplus for the over.
  // FailedPrecondition once the recount is used, on a counted row, or on a session that is not active.
  OpnameRow row = 1;
}

// ── OpnameRowMarkCounted ─────────────────────────────────────────────────────────────────────────────────────────

message OpnameRowMarkCountedRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 row_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Units taken off this rack and thrown away. No cap: a torn unit in hand is always posted
  // (broken-posts-as-written-the-rest-nets). The lost draft becomes the shortage less this, at least 0.
  int64 broken_count = 3 [(buf.validate.field).int64.gte = 0];
  // Each reason is required when its draft exists — broken above 0, lost above 0, surplus above 0; the handler checks.
  string broken_note = 4 [(buf.validate.field).string.max_len = 500];
  string lost_note = 5 [(buf.validate.field).string.max_len = 500];
  string surplus_note = 6 [(buf.validate.field).string.max_len = 500];
}

message OpnameRowMarkCountedResponse {
  // FailedPrecondition unless revealed and still created; InvalidArgument when a draft lacks its reason.
  OpnameRow row = 1;
}

// ── OpnameRowAddFound ────────────────────────────────────────────────────────────────────────────────────────────

message OpnameRowAddFoundRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 session_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 placement_id = 3 [(buf.validate.field).uint64.gt = 0];
  uint64 product_id = 4 [(buf.validate.field).uint64.gt = 0];
}

message OpnameRowAddFoundResponse {
  // The new row on this rack, at a book figure of 0 — and one on each of the product's other racks not yet in the
  // session. AlreadyExists when the product already has a row here. FailedPrecondition when its team never had a batch
  // of it in this warehouse: it is taken out and restocked by the team, not counted.
  repeated OpnameRow rows = 1;
}
