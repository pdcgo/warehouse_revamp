syntax = "proto3";

package warehouse.product.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/product/v1;productv1";

// PRODUCT TAGS (backlog #147, #141 P1a) — the messages of ProductService's tag RPCs (product.proto), a copy of the order
// tags (selling order_tag.proto, backlog #100) for products, with the restock tags' app-owned system tag. The owner's rules
// (docs/business/product/context_decision.md):
//
//   - products-have-their-own-tag-list: products get a tag list of their OWN, as orders and restocks have theirs — apart
//     from both — under the same rules (custom-tags-are-shared-system-tags-are-the-admins-and-the-apps): a tag is SYSTEM or
//     CUSTOM; ONE product list for every team, a name unique within it; a custom tag is made and used by any user who may
//     WRITE on the product (ProductUpdate's roles: the selling Owner and Admin, Root, the Administrator); system tags and
//     renaming or deleting a tag are the admins' (Root / the Administrator); the Products list filters by tag, ANY of the
//     picked. The first APP-OWNED system tag is `need_reprint_code` (app task "product.code.reprint", seeded by product
//     00010), put on by the team code change (backlog #149) — LOCKED for everyone, admins included, as the restock's
//     problem tags are (a-restock-problem-is-a-system-tag);
//   - its 🔄 *who sees*: a product's tags are seen by the team that OWNS it and by every WAREHOUSE holding its stock — the
//     warehouse's own Products list, the products it has held (a-warehouses-products-is-what-it-holds); other teams on
//     Discover Product see none. So tags ride only on the owner's reads (ProductList rows, ProductDetail), the warehouse's
//     list (inventory's WarehouseStockList rows) and ProductTagsByIds, which answers each side only its own products —
//     NEVER on ProductByIds or ProductDiscover, which every team reads;
//   - its 🔄 *what clears*: the app takes `need_reprint_code` off once every warehouse holding the product's stock has
//     printed its new labels (backlog #151) — never a person;
//   - the-team-code-and-product-tags-prototype-is-accepted: the screens drawn are the design (the product page's Tag card,
//     the warehouse page's read-only chips, both lists' Tag column and filter, the admins' Kelola tag produk).
//
// WHY THE ADMINS' ACTS ARE THEIR OWN MESSAGES — as on order_tag.proto: the ACL lives on the request message, and a handler
// cannot tell a platform admin from the team role it holds (san_auth.GetCallerRole is the SCOPED team's role). So making a
// system tag, putting one on or taking one off, renaming, deleting and the counting list are separate requests whose
// policy is [ROOT, ADMINISTRATOR] — the root-team bypass is the one way in.

// A product tag's kind (a-restock-tag-is-system-or-custom, on the products' list). APPEND ONLY.
enum ProductTagType {
  PRODUCT_TAG_TYPE_UNSPECIFIED = 0;
  // Owned by the system: made, put on and taken off only by Root / the Administrator and the app's own tasks.
  PRODUCT_TAG_TYPE_SYSTEM = 1;
  // Made, put on and taken off by anyone who may write on the product; usable by every team.
  PRODUCT_TAG_TYPE_CUSTOM = 2;
}

// One tag of the products' list.
message ProductTag {
  uint64 id = 1;
  // As kept: trimmed, inner spaces folded to one, the case as first typed. Unique within the products' list, compared
  // case-insensitively.
  string name = 2;
  ProductTagType type = 3;
  // How many products carry it, every team's — ProductTagManageList only (what the admins' delete confirm says); 0
  // elsewhere.
  uint64 product_count = 4;
  // The app's own task that owns this SYSTEM tag — "product.code.reprint" for `need_reprint_code`. "" for an admin's
  // system tag and every custom tag. A tag with one is LOCKED for everyone, admins included: never put on or taken off by
  // hand, never renamed or deleted (FAILED_PRECONDITION).
  string app_task = 5;
}

// THE PRODUCTS' LIST, for the Tag filter and the add box — every team's product tags, the system's first, then by name.
// Paged (a list that grows with the data pages); a picker asks a large first page. Both Products lists filter by it, so a
// warehouse reads it too. A READ, so the admin team's monitor and an agent's credential reach it.
message ProductTagListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The caller's team — the list is the same for every team; the scope only says who asks.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // Only tags whose name contains this, any case, spaces folded; "" = every tag.
  string q = 2 [(buf.validate.field).string.max_len = 100];
  warehouse.common.v1.CommonPagination page = 3 [(buf.validate.field).required = true];
}

message ProductTagListResponse {
  repeated ProductTag tags = 1;
  warehouse.common.v1.PageInfo page_info = 2;
}

// THE ADMINS' LIST (Kelola tag produk) — ProductTagList's tags and order, each with how many products carry it
// (`product_count`, every team's), which the delete's confirm says. Root / the Administrator only.
message ProductTagManageListRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  string q = 1 [(buf.validate.field).string.max_len = 100];
  warehouse.common.v1.CommonPagination page = 2 [(buf.validate.field).required = true];
}

message ProductTagManageListResponse {
  repeated ProductTag tags = 1;
  warehouse.common.v1.PageInfo page_info = 2;
}

// A CUSTOM TAG, made by anyone who may write on a product — ProductUpdate's roles (the selling Owner and Admin, Root, the
// Administrator); never CS, a warehouse or a monitor. ONE NAME, ONE TAG: a name already on the products' list — any case,
// spaces folded — answers THAT tag (`created` false), whatever its type, the app's included, and never makes a twin; two
// makes of one new name at the same second make one tag. An order or restock tag's name is another list's and is free
// here.
message ProductTagCreateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // Trimmed and its inner spaces folded on the server; empty after that is InvalidArgument.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 60
  }];
}

message ProductTagCreateResponse {
  ProductTag tag = 1;
  // False when the name was already taken and the answer is that tag.
  bool created = 2;
}

// A SYSTEM TAG, made by an admin (Root / the Administrator) — the same one-name-one-tag answer as ProductTagCreate. It
// carries no app task: only a migration seeds an app's tag.
message ProductTagSystemCreateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 60
  }];
}

message ProductTagSystemCreateResponse {
  ProductTag tag = 1;
  bool created = 2;
}

// RENAME, the admins' alone, a custom or an admin's system tag — the app's own is FAILED_PRECONDITION (locked). A name
// ANOTHER product tag carries, any case, is ALREADY_EXISTS; an unknown tag NOT_FOUND. A change of letter case alone is a
// rename.
message ProductTagRenameRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  uint64 tag_id = 1 [(buf.validate.field).uint64.gt = 0];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 60
  }];
}

message ProductTagRenameResponse {
  ProductTag tag = 1;
}

// DELETE, the admins' alone: the tag leaves the products' list AND comes off every product that carries it, every team's,
// in one transaction. The app's own tag is FAILED_PRECONDITION (locked); an unknown (or already deleted) tag NOT_FOUND.
message ProductTagDeleteRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  uint64 tag_id = 1 [(buf.validate.field).uint64.gt = 0];
}

message ProductTagDeleteResponse {
  // How many products it came off.
  uint64 product_count = 1;
}

// A CUSTOM TAG ON A PRODUCT — by its writers (ProductUpdate's roles) in the team that OWNS it (team_id = the product's
// team); another team's product reads NOT_FOUND, as ProductUpdate answers. Archived or not (the order tags' "every
// status"). A SYSTEM tag is PERMISSION_DENIED here — an admin puts one on with ProductSystemTagAdd, and the app's own is
// nobody's to move. A tag already on is no change. Nothing else of the product moves.
message ProductTagAddRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 tag_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ProductTagAddResponse {
  // The product's tags now, the system's first, then by name.
  repeated ProductTag tags = 1;
}

// A CUSTOM TAG OFF A PRODUCT — ProductTagAdd's team, roles and states; any writer takes it off, whoever put it on. A
// system tag is PERMISSION_DENIED here. A tag not on is no change.
message ProductTagRemoveRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 tag_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ProductTagRemoveResponse {
  repeated ProductTag tags = 1;
}

// AN ADMIN'S SYSTEM TAG ON A PRODUCT — Root / the Administrator, naming the product's owning team as team_id. A system tag
// only: a custom one is INVALID_ARGUMENT (it goes on with ProductTagAdd); the app's own is FAILED_PRECONDITION (locked,
// admins included).
message ProductSystemTagAddRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 tag_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ProductSystemTagAddResponse {
  repeated ProductTag tags = 1;
}

// AN ADMIN'S SYSTEM TAG OFF A PRODUCT — ProductSystemTagAdd's mirror (the app's own is FAILED_PRECONDITION).
message ProductSystemTagRemoveRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 tag_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ProductSystemTagRemoveResponse {
  repeated ProductTag tags = 1;
}

// THE TAGS OF KNOWN PRODUCTS, for a page that names a product by id and has no owner's read to carry them — the
// warehouse's product page (`/inventories/products/:id`, read-only chips under the code). Each side reads only its own
// (its 🔄 *who sees*): the scoped team's OWN products, and — for a warehouse — the products it has held, every product
// with a batch there, at 0 too, the set its Products list shows (a-warehouses-products-is-what-it-holds; inventory knows
// it, asked in-process). Any other id — another team's product on Discover, an unknown id — is ABSENT, never refused, so
// one id the caller may not see never blanks the rest. A READ.
message ProductTagsByIdsRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The caller supplies the set, so the answer can never exceed it (ProductByIds' cap).
  repeated uint64 product_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    items: {
      uint64: {gt: 0}
    }
  }];
}

// One product's tags, the system's first, then by name — empty when it carries none.
message ProductTagSet {
  repeated ProductTag tags = 1;
}

message ProductTagsByIdsResponse {
  // Keyed by product id: every id the caller may read the tags of, carrying none or some; the rest absent.
  map<uint64, ProductTagSet> items = 1;
}
