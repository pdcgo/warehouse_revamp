syntax = "proto3";

package warehouse.selling.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/role_base/v1/role.proto";
import "warehouse/selling/v1/order.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/selling/v1;sellingv1";

// OrderDraftService owns `order_drafts` + `order_draft_items` (#190) — an INCOMPLETE order pushed in
// by a third-party app,
// which a person in this system finishes and promotes into a real order.
//
// A draft is not a quotation, not a reservation, not an unpaid marketplace order, and not a
// template. It holds no stock, and it NEVER publishes OrderCreatedEvent — placement does (#153) and
// revenue consumes it (#75), so a draft that published would put an unfinished scrape into the
// month's margin.
//
// Team-scoped like the rest of selling_service, and additionally PERSONAL: the handler narrows to
// the author. "Personal" is a handler filter, never a substitute for the scope.
service OrderDraftService {
  // The external app's intake. Create-or-update on (team_id, source, external_id), writing only
  // fields a human has NOT touched.
  rpc OrderDraftPush(OrderDraftPushRequest) returns (OrderDraftPushResponse);

  // Reading drafts (#192) — used by our UI and by the app that pushed them (§6.6). Both narrow to
  // the AUTHOR, in addition to the team scope.
  rpc OrderDraftList(OrderDraftListRequest) returns (OrderDraftListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc OrderDraftDetail(OrderDraftDetailRequest) returns (OrderDraftDetailResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The human edit path (#193). ALWAYS WINS, and marks every field it writes as touched — which is
  // what OrderDraftPush then refuses to overwrite.
  rpc OrderDraftUpdate(OrderDraftUpdateRequest) returns (OrderDraftUpdateResponse);
  // Pruning, which is entirely manual (nothing expires) — so it takes several at once.
  rpc OrderDraftDelete(OrderDraftDeleteRequest) returns (OrderDraftDeleteResponse);

  // The duplicate-ref warning's draft half (the-duplicate-warning-reads-drafts-too, settled in
  // the-duplicate-ref-warning-is-accepted): the TEAM's drafts in one shop carrying any of these marketplace refs —
  // shaped like OrderService.OrderByExternalRefs. ⚠ Team-wide, not the caller's own: a colleague's scrape of the
  // same ref is exactly the double the warning exists to name. The drafts list keeps its own-drafts rule.
  rpc OrderDraftByExternalRefs(OrderDraftByExternalRefsRequest) returns (OrderDraftByExternalRefsResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ⚠ NO PROMOTE. A draft becomes an order through OrderCreate with `order_draft_id`
  // (a-draft-becomes-an-order-through-order-create) — one door into `orders`, so a promoted order cannot skip a
  // field the typed one is held to. OrderDraftPromote was removed for exactly that: it rebuilt the order by hand
  // and never copied the marketplace ref.
}

// One scraped line of a draft — the platform's reference: what the marketplace said, never what we resolved it to.
//
// A DRAFT STORES NO MAPPING (a-draft-stores-no-mapping): a marketplace scraper knows the platform's product TITLE, not
// our product, so the title is stored verbatim and the CS maps it in the order form, straight into the order's lines.
message OrderDraftItem {
  uint64 id = 1;

  // What the app scraped. NEVER overwritten, not even by a person editing the line: it is the
  // evidence of what the buyer actually ordered, and keeping it beside the mapping is what lets
  // somebody tell a wrong mapping from a right one.
  string external_sku = 2 [(buf.validate.field).string.max_len = 128];
  string external_name = 3 [(buf.validate.field).string.max_len = 500];

  // 4 was `product_id`, the stored mapping — dropped by selling 00047 (a-draft-stores-no-mapping).
  reserved 4;
  reserved "product_id";

  // Unconstrained, unlike OrderItem's `quantity >= 1`: a scrape may not have been able to read
  // either. Refusing a whole push over one unreadable line would lose the other nine — promote is
  // where every requirement lands.
  uint32 quantity = 5;
  double unit_price = 6;
}

message OrderDraft {
  uint64 id = 1;
  uint64 team_id = 2;
  // Whoever's login the pushing app runs under. There is no machine identity in this system and this
  // feature does not invent one, so every draft has a human accountable on it.
  uint64 author_user_id = 3;

  // Which app pushed this, and the marketplace's own id for it. UNIQUE together with team_id, which
  // is what makes the push idempotent.
  string source = 4;
  string external_id = 5;

  // The field names a human has edited. OrderDraftPush writes only what is ABSENT from this list, so
  // a background re-scrape can never silently destroy someone's work. Returned so the UI can show
  // which fields the app has stopped being able to change.
  repeated string touched_fields = 6;

  // 0 until known. Opaque cross-service ids with no FK, so either can be deleted underneath a draft —
  // OrderCreate re-checks both when the draft page promotes it.
  uint64 shop_id = 7;
  uint64 warehouse_id = 8;

  // The buyer and the address live in the draft's ONE `order_draft_addresses` row (selling 00046,
  // one-address-per-order-and-per-draft), as NAMES only (an-address-is-plain-names): the address's four `_code` fields
  // are always empty here, and any a caller sends is discarded. Best effort — every part may be empty.
  string customer_name = 9;
  string customer_phone = 10;
  OrderAddress address = 11;
  // 12 was `shipping_code`, the courier CODE — replaced by `shipment_channel_id` (selling 00044).
  reserved 12;
  reserved "shipping_code";

  // 13 was `shipping_cost` — a draft is the platform's header and lines, and an order records no shipping
  // (an-order-records-no-shipping-cost). Selling 00027 dropped the column.
  reserved 13;
  reserved "shipping_cost";

  // The lines — populated by OrderDraftDetail (the list returns a summary without them).
  repeated OrderDraftItem items = 14;

  int64 created_at_unix = 15;
  int64 updated_at_unix = 16;

  // How many lines the draft holds, WITHOUT its lines (#192) — computed by the server on every read, list and detail
  // alike, because the list deliberately returns no items.
  uint32 item_count = 17;
  // 18 was `unmapped_item_count` — a draft stores no mapping, so the list counts none
  // (the-drafts-list-counts-no-mapping).
  reserved 18;
  reserved "unmapped_item_count";

  // WHEN THE BUYER ORDERED on the storefront (platform-created-at-is-required-at-finalize). 0 = not known yet: a draft
  // may hold it empty while it is worked on, and Promote refuses until it is set. Promote copies it onto the order.
  int64 platform_created_at_unix = 19;
  // The marketplace's own SHIP-BY time, its "kirim sebelum" (the-shipment-deadline-is-the-platforms-and-optional).
  // 0 = none, which is allowed all the way through. Promote copies it.
  int64 platform_shipment_deadline_unix = 20;

  // The buyer's username on the marketplace (the-buyers-username-is-optional). "" = none, which is allowed all the
  // way through. Promote copies it.
  string buyer_username = 21;

  // WHAT THE BUYER PAID on the platform, a double (the-backend-never-rounds-money) — the owner's `order_drafts.platform_total`
  // (platform-total-is-required-at-finalize), the figure settlement opens the order's account on. 0 = not known yet: a
  // draft may hold it empty while it is worked on, and Promote refuses until it is set. Promote copies it onto
  // Order.platform_total, exact as the order is placed — a draft keeps what was read or typed, and so does the order.
  double platform_total = 22;

  // THE COURIER, as the app converted it (the-app-converts-the-courier-to-a-channel-id) or a person picked it — a
  // shipment channel's id. 0 = not known: the app could not map the platform's courier, and the person picks it in the
  // order form, where it is required (no-order-without-a-courier).
  uint64 shipment_channel_id = 23;

  // THE ADDRESS PICKER'S PRE-FILL (the-cs-edits-the-whole-address-before-create, *Pre-filled when certain*): when the
  // draft's four region names match EXACTLY ONE region_service place (RegionMatch), that place — codes, the region
  // list's own names, its kode pos; `address_line` empty. Unset when they match none or several, or a level is empty:
  // the form's dropdowns then open empty and the person picks, reading `address` as text. OrderDraftDetail only, worked
  // out on every read and never stored — the draft keeps names (an-address-is-plain-names).
  OrderAddress region_match = 24;

  // THE LAST PUSH WAS AN OVERRIDE — `author_user_id` is Root or the System Administrator and pushed it inside a team they hold no role in (an-override-is-stamped-in-every-service);
  // the screen shows the shared "by Root team" badge beside the person (an-override-shows-a-platform-badge).
  // From `order_drafts.is_override`, which follows the push.
  bool is_override = 25;
}

message OrderDraftListRequest {
  // Read: the same audience as OrderCreate — the app reads back what it pushed, and the person who
  // will finish the draft is one of these people.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // ⚠ THE SCOPE STAYS, even though the list is personal. The handler narrows to the caller's
  // author_user_id ON TOP of this — "personal" is a handler filter, never a replacement for the
  // scope. A team-level role policy on a message with no use_scope field is evaluated against the
  // root team, where almost nobody is a member: it would authorize nobody at all.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // REQUIRED (HARD RULE 9), and not a formality here: drafts never expire, and an app pushing
  // continuously fills this list far faster than a human ever would. It is a list that only grows.
  OrderDraftListFilter filter = 2;
  OrderDraftListFilterSort sort = 3;
  repeated OrderDraftListDataType data_request = 4;
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

message OrderDraftListFilter {
  // Only drafts pushed by THIS app. Empty means all of them. Server-side (the list is paginated).
  string source = 1 [(buf.validate.field).string.max_len = 64];
}

enum OrderDraftListDataType {
  ORDER_DRAFT_LIST_DATA_TYPE_UNSPECIFIED = 0;
  ORDER_DRAFT_LIST_DATA_TYPE_GENERAL = 1;
  ORDER_DRAFT_LIST_DATA_TYPE_ORDER_DRAFT = 2;
}

enum OrderDraftRowSort {
  ORDER_DRAFT_ROW_SORT_UNSPECIFIED = 0;
  ORDER_DRAFT_ROW_SORT_ID = 1;
}

message OrderDraftListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    warehouse.common.v1.GeneralSort general = 2;
    OrderDraftRowSort order_draft = 3;
  }
}

// The ORDER_DRAFT slice reuses the OrderDraft message directly (a list summary leaves items empty,
// but carries item_count).
message OrderDraftRowMapItem {
  map<uint64, OrderDraft> map_data = 1;
}

message OrderDraftListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    OrderDraftRowMapItem order_draft = 2;
  }
}

message OrderDraftListResponse {
  repeated OrderDraftListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
  // How many drafts of the WHOLE filtered set (every page, not this one) have nothing left before Create — the
  // list's own readiness rule (the frontend's draftGaps, the-drafts-list-counts-no-mapping): a shop, a warehouse, a
  // customer, an address line, a courier, at least one line, an order date, a sell price, and not a `manual` draft (its
  // order ref is still to be typed). No mapping: the lines are mapped in the order form at Create. Stock is not in it:
  // only the order form can read the warehouse's availability.
  uint64 ready_count = 4;
}

message OrderDraftDetailRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 draft_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message OrderDraftDetailResponse {
  // WITH its lines (the scraped text the order form shows above its products) and its `region_match`.
  OrderDraft draft = 1;
}

// One line as a PERSON edits it (#193) — a quantity or price correction; a draft stores no mapping
// (a-draft-stores-no-mapping).
//
// The scraped text is deliberately absent. `external_sku` / `external_name` are the evidence of what
// the buyer ordered and are never overwritten by anybody; a request that could carry them would be a
// request that could rewrite the evidence to match a wrong mapping.
message OrderDraftLineEdit {
  // An existing line of this draft. 0 adds a NEW line, which is how a person records something the
  // scrape never saw — such a line has no external text, and its emptiness truthfully says so.
  uint64 id = 1;

  // 2 was `product_id`, the mapping — dropped with the column (a-draft-stores-no-mapping).
  reserved 2;
  reserved "product_id";

  uint32 quantity = 3;
  double unit_price = 4 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
}

// The complete desired set of lines. Its own message so it has PRESENCE: an absent `lines` means
// "leave the lines alone", while a present-but-empty one means "this draft has no lines" — and
// nothing else could tell those apart.
message OrderDraftLines {
  // Lines omitted here are DELETED. A buyer who cancelled one line of three must be able to say so,
  // and without removal the draft would be unpromotable forever over a line nobody wants.
  repeated OrderDraftLineEdit lines = 1;
}

// OrderDraftUpdate is the person's edit, made in our UI (#193) — correcting a line, fixing the address, choosing the
// shop and warehouse. A draft stores no mapping (a-draft-stores-no-mapping).
//
// ⚠ IT ALWAYS WINS, and marks every field it writes as TOUCHED. That mark is what OrderDraftPush
// reads to know what it may not overwrite, so this RPC and that one are two halves of one rule.
//
// Every field is OPTIONAL in the presence sense: a field left unset is not edited and not marked.
// This is not a convenience — a request that could not distinguish "unset" from "set to empty" would
// mark every field touched on every save, and the first edit anybody made would freeze the whole
// draft against the app forever.
message OrderDraftUpdateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 draft_id = 2 [(buf.validate.field).uint64.gt = 0];

  optional uint64 shop_id = 3;
  optional uint64 warehouse_id = 4;
  optional string customer_name = 5 [(buf.validate.field).string.max_len = 200];
  optional string customer_phone = 6 [(buf.validate.field).string.max_len = 40];
  // The address is ONE field, whole. Somebody who corrects a kecamatan has corrected the address.
  OrderAddress address = 7;
  // 8 was `shipping_code`, the courier CODE — replaced by `shipment_channel_id` (selling 00044).
  reserved 8;
  reserved "shipping_code";
  // 9 was `shipping_cost` (an-order-records-no-shipping-cost).
  reserved 9;
  reserved "shipping_cost";

  // The lines, if this edit touches them at all.
  OrderDraftLines items = 10;

  // The two platform dates, as a person read them off the storefront. Set = edited and marked touched, so the app's
  // next push leaves them alone; 0 clears one.
  optional int64 platform_created_at_unix = 11 [(buf.validate.field).int64.gte = 0];
  optional int64 platform_shipment_deadline_unix = 12 [(buf.validate.field).int64.gte = 0];

  // The buyer's marketplace username, as a person read it. Set = edited and marked touched; "" clears it. Trimmed by
  // the handler (the-buyers-username-is-optional).
  optional string buyer_username = 13 [(buf.validate.field).string.max_len = 100];

  // What the buyer paid on the platform, as a person read it or typed it (platform-total-is-required-at-finalize).
  // Set = edited and marked touched, so the app's next push leaves it alone; 0 clears it.
  optional double platform_total = 14 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];

  // The courier, as a person picked it — a shipment channel's id. Set = edited and marked touched, so the app's next push
  // leaves it alone; 0 clears it.
  optional uint64 shipment_channel_id = 15;
}

message OrderDraftUpdateResponse {
  // The draft as it now stands, WITH its lines and its updated `touched_fields` — so a UI can show
  // straight away which fields the app has just lost the right to change.
  OrderDraft draft = 1;
}

// OrderDraftDelete prunes drafts. Nothing expires (§6.7), so this is the only thing standing between
// the list and a graveyard — and an app pushing continuously fills that list far faster than a person
// deletes one at a time. Hence: SEVERAL AT ONCE.
//
// Reachable by the external app too, with an accepted consequence stated plainly in the design: an
// external client can delete a draft a person has partly completed.
message OrderDraftDeleteRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // The drafts to delete. Capped so one request cannot ask to delete an unbounded set — a bulk
  // delete is exactly the request where a runaway client does the most damage, and a page of the
  // list is the largest selection a person can actually make.
  repeated uint64 draft_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

message OrderDraftDeleteResponse {
  // How many were actually deleted. It can be fewer than asked for — an id that is not the caller's,
  // or already gone, is skipped rather than failing the request. Deleting is idempotent by nature,
  // and refusing the whole batch over one stale id would make a bulk prune unusable exactly when the
  // list is long enough to need one.
  uint32 deleted = 1;
}

// OrderDraftPush is the third-party app's intake (#191). CREATE-OR-UPDATE, keyed on
// (team_id, source, external_id) — so a retry after a flaky connection updates the existing draft
// instead of adding a near-identical one nobody can tell apart. Any external caller will retry
// eventually, so this is not an optimisation.
//
// ⚠ IT WRITES UNTOUCHED FIELDS ONLY. A re-scrape must never destroy work a person has already done
// here — mapped lines, a corrected address. Fields named in `touched_fields` are left exactly as
// they are.
//
// ⚠ WHY THIS IS A SEPARATE RPC FROM OrderDraftUpdate. The app and the person authenticate as the
// SAME user (the app logs in as one — there is no machine identity), so identity cannot tell them
// apart. The RPC NAME is what carries the distinction: this one yields to a human, OrderDraftUpdate
// always wins and marks what it wrote. Do not merge them into one handler.
message OrderDraftPushRequest {
  // Write: the same audience as OrderCreate. The app runs under one of these people's logins.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // The external reference, and the ONLY thing a draft is required to have. Everything else about a
  // draft is optional by construction — there is no "New draft" button producing a blank, because
  // every draft traces to a real scrape.
  string source = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string external_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  uint64 shop_id = 4;
  uint64 warehouse_id = 5;

  string customer_name = 6 [(buf.validate.field).string.max_len = 200];
  string customer_phone = 7 [(buf.validate.field).string.max_len = 40];
  OrderAddress address = 8;
  // 9 was `shipping_code`, the courier CODE — replaced by `shipment_channel_id` (selling 00044).
  reserved 9;
  reserved "shipping_code";
  // 10 was `shipping_cost` — an order records no shipping (an-order-records-no-shipping-cost). ⚠ A JSON client still
  // sending `shippingCost` has it DISCARDED silently (Connect ignores unknown JSON fields), never refused.
  reserved 10;
  reserved "shipping_cost";

  // The scraped lines. NO minimum: a push carrying a customer and an address but no readable lines
  // is still worth keeping — refusing it would throw away everything the app COULD see over the one
  // thing it could not.
  //
  // `items` is one field for the touched rule: once a person has edited any line, the app stops
  // rewriting the lines altogether. Per-line merging would need a per-line touched mark, and the
  // rule that matters — a re-scrape never destroys a mapping — is satisfied without it.
  repeated OrderDraftItem items = 11;

  // The two platform dates, as the app read them off the storefront. 0 = the app could not see one. Neither is
  // required here: a draft is allowed to be missing things (platform-created-at-is-required-at-finalize checks the
  // order date at Promote, and the-shipment-deadline-is-the-platforms-and-optional never requires the deadline).
  int64 platform_created_at_unix = 12 [(buf.validate.field).int64.gte = 0];
  int64 platform_shipment_deadline_unix = 13 [(buf.validate.field).int64.gte = 0];

  // The buyer's marketplace username, as the app read it. "" = the app could not see one — never required
  // (the-buyers-username-is-optional). Trimmed by the handler.
  string buyer_username = 14 [(buf.validate.field).string.max_len = 100];

  // What the buyer paid on the platform, as the app read it — JSON `platformTotal`. 0 = the app could not see one. Not
  // required here — a draft may hold it empty; Promote is where it becomes required
  // (platform-total-is-required-at-finalize). Renamed from `marketplace_total` on 2026-10-23 with its number kept, so a
  // binary client is unaffected — ⚠ but a JSON client still sending `marketplaceTotal` has it DISCARDED silently, and
  // its drafts reach Promote with 0.
  double platform_total = 15 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];

  // THE COURIER, converted by the app from the platform's text to our channel id — the app reads ShipmentChannelList and
  // maps onto it (the-app-converts-the-courier-to-a-channel-id). 0 = the app could not map it; the draft keeps none and
  // the person picks one in the order form. Not looked up: a wrong mapping is the app's defect, corrected on the draft.
  uint64 shipment_channel_id = 16;
}

message OrderDraftPushResponse {
  OrderDraft draft = 1;

  // Whether this push CREATED the draft (false = it updated one that already existed). The app is
  // the only caller, and it is the one that cannot otherwise tell a successful retry from a new
  // scrape — the id alone looks identical either way.
  bool created = 2;
}

// ── OrderDraftByExternalRefs ─────────────────────────────────────────────────────────────────────

message OrderDraftByExternalRefsFilter {
  // The shop the order is being created in — another shop's draft on the same ref is not this order's double.
  uint64 shop_id = 1 [(buf.validate.field).uint64.gt = 0];
  // The marketplace refs as the form holds them. A form asks for one; the cap keeps the read bounded.
  repeated string refs = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

enum OrderDraftByExternalRefsDataType {
  ORDER_DRAFT_BY_EXTERNAL_REFS_DATA_TYPE_UNSPECIFIED = 0;
  ORDER_DRAFT_BY_EXTERNAL_REFS_DATA_TYPE_DRAFT_REF = 1;
}

message OrderDraftByExternalRefsRequest {
  // Read: the people who may create orders — the warning runs before OrderCreate, for the same callers.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OrderDraftByExternalRefsFilter filter = 2 [(buf.validate.field).required = true];
  repeated OrderDraftByExternalRefsDataType data_request = 3;
}

// One of the team's drafts carrying the ref, in the asked shop.
message OrderDraftRefItem {
  uint64 draft_id = 1;
  uint64 shop_id = 2;
  // Whose draft it is — the caller can open only their own (OrderDraftDetail narrows to the author).
  uint64 author_user_id = 3;
  int64 created_at_unix = 4;
}

message OrderDraftRefMapItem {
  // Keyed by draft id. One per app (source) at most, since a draft is unique on (team, source, ref).
  map<uint64, OrderDraftRefItem> map_data = 1;
}

message OrderDraftByExternalRefsResponseItem {
  oneof d {
    OrderDraftRefMapItem draft_ref = 1;
  }
}

message OrderDraftByExternalRefsResponseList {
  repeated OrderDraftByExternalRefsResponseItem items = 1;
}

message OrderDraftByExternalRefsResponse {
  // Keyed by ref. A ref no draft of the team in that shop carries is ABSENT. A `manual` draft (saved from the order
  // form) is never answered: its external id is a minted form id, not a marketplace ref.
  map<string, OrderDraftByExternalRefsResponseList> items = 1;
}
