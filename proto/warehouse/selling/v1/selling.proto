syntax = "proto3";

package warehouse.selling.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/marketplace/v1/marketplace.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/selling/v1;sellingv1";

// ShopService owns `shops` — the marketplace storefronts a SELLING team operates (#66). Every RPC
// is team-scoped: `team_id` carries (use_scope), and the handler only ever touches rows with that
// team_id, so one team can never reach another team's shop by id. selling_service will grow to own
// orders too (the #23 decomposition); shops are the first piece.
service ShopService {
  rpc ShopCreate(ShopCreateRequest) returns (ShopCreateResponse);
  rpc ShopList(ShopListRequest) returns (ShopListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ShopDetail(ShopDetailRequest) returns (ShopDetailResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ShopUpdate(ShopUpdateRequest) returns (ShopUpdateResponse);
  // A shop is CLOSED, never deleted (a-shop-is-closed-never-deleted) — there is no ShopDelete. Close stops new selling
  // on it (a-closed-shop-refuses-only-new-selling) and frees its code; Reopen gives it back, refused while an open shop
  // of the team holds the code (a-shop-code-is-unique-among-open-shops).
  rpc ShopClose(ShopCloseRequest) returns (ShopCloseResponse);
  rpc ShopReopen(ShopReopenRequest) returns (ShopReopenResponse);

  // Shop access — which users may work on a shop (#86). Scoped to the shop's team.
  rpc ShopUserList(ShopUserListRequest) returns (ShopUserListResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ShopUserAdd(ShopUserAddRequest) returns (ShopUserAddResponse);
  rpc ShopUserRemove(ShopUserRemoveRequest) returns (ShopUserRemoveResponse);

  // Make primary — moves the shop's primary CS to another of its granted users
  // (the-primary-cs-is-a-flag-on-a-grant).
  rpc ShopUserSetPrimary(ShopUserSetPrimaryRequest) returns (ShopUserSetPrimaryResponse);

  // For other services — the shop, its primary CS, and whether a user may WRITE on it, in one answer
  // (one-call-answers-the-shop-and-the-access). The settlement importer asks it before storing a file;
  // settlement asks it for an imported shop row's primary CS.
  rpc ShopAccessCheck(ShopAccessCheckRequest) returns (ShopAccessCheckResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Shops by id, across teams — the warehouse's order row names each order's shop
  // (the-warehouse-row-fills-from-shop-and-user-by-ids).
  rpc ShopByIds(ShopByIdsRequest) returns (ShopByIdsResponse);
}

message Shop {
  uint64 id = 1;
  uint64 team_id = 2;
  string name = 3;
  string shop_code = 4;
  warehouse.marketplace.v1.Marketplace marketplace = 5;
  string description = 6;
  // `deleted` was replaced by `status` + `closed_at_unix` (a-shop-is-closed-never-deleted).
  reserved 7;
  reserved "deleted";
  // The shop's primary CS — one of its granted users, flagged (the-primary-cs-is-a-flag-on-a-grant).
  // 0 = none: the shop cannot import until someone is made primary.
  uint64 primary_user_id = 8;
  // Open, or closed (a-shop-is-closed-never-deleted). A closed shop takes no new selling but its money still runs
  // (a-closed-shop-refuses-only-new-selling); only its grants and primary CS stay editable
  // (a-closed-shop-locks-all-but-its-grants).
  ShopStatus status = 9;
  // When it closed, unix seconds — 0 for an open shop.
  int64 closed_at_unix = 10;
}

// A shop's life (a-shop-is-closed-never-deleted): created open, closed and reopened, never deleted.
enum ShopStatus {
  SHOP_STATUS_UNSPECIFIED = 0;
  SHOP_STATUS_OPEN = 1;
  SHOP_STATUS_CLOSED = 2;
}

message ShopCreateRequest {
  // Write: the selling team's managers. Team-level roles are legal because team_id carries use_scope.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string shop_code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Required — a shop is always on a marketplace.
  warehouse.marketplace.v1.Marketplace marketplace = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string description = 5 [(buf.validate.field).string = {max_len: 1000}];
}

message ShopCreateResponse {
  Shop shop = 1;
}

message ShopListRequest {
  // Read: anyone in the selling team, including customer service.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  ShopListFilter filter = 2;
  ShopListFilterSort sort = 3;
  repeated ShopListDataType data_request = 4;
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

message ShopListFilter {
  string q = 1 [(buf.validate.field).string.max_len = 100];
  // Only the shops on this marketplace; UNSPECIFIED = every marketplace. A shop's marketplace never changes.
  warehouse.marketplace.v1.Marketplace marketplace = 2 [(buf.validate.field).enum.defined_only = true];
  // Only the shops whose PRIMARY CS is this person (the-primary-cs-is-a-flag-on-a-grant); 0 = anybody.
  uint64 primary_user_id = 3;
  // Only the shops with NO primary CS — the ones that cannot import a statement yet. Asking for a person and for
  // nobody at once is refused (InvalidArgument): the two cannot both hold.
  bool no_primary = 4;
  // Only the shops the CALLER may write on (a-write-needs-a-grant-or-a-manager): every shop for the team's owner or
  // admin and for root or admin, otherwise the shops granted to them. The order form's and the imports' pickers ask
  // it; a filter over orders or reports does not, and still offers every shop.
  bool writable = 5;
  // Which shops by status (a-shop-is-closed-never-deleted, the-close-shop-prototype-is-accepted): UNSPECIFIED is OPEN,
  // the default list; CLOSED the closed ones; ALL both.
  ShopListStatus status = 6 [(buf.validate.field).enum.defined_only = true];
}

// ShopList's status filter. UNSPECIFIED reads as OPEN — a list that does not ask shows the open shops.
enum ShopListStatus {
  SHOP_LIST_STATUS_UNSPECIFIED = 0;
  SHOP_LIST_STATUS_OPEN = 1;
  SHOP_LIST_STATUS_CLOSED = 2;
  SHOP_LIST_STATUS_ALL = 3;
}

enum ShopListDataType {
  SHOP_LIST_DATA_TYPE_UNSPECIFIED = 0;
  SHOP_LIST_DATA_TYPE_GENERAL = 1;
  SHOP_LIST_DATA_TYPE_SHOP = 2;
}

enum ShopRowSort {
  SHOP_ROW_SORT_UNSPECIFIED = 0;
  SHOP_ROW_SORT_ID = 1;
  SHOP_ROW_SORT_NAME = 2;
  SHOP_ROW_SORT_SHOP_CODE = 3;
}

message ShopListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    warehouse.common.v1.GeneralSort general = 2;
    ShopRowSort shop = 3;
  }
}

// The SHOP slice reuses the Shop message directly.
message ShopRowMapItem {
  map<uint64, Shop> map_data = 1;
}

message ShopListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    ShopRowMapItem shop = 2;
  }
}

message ShopListResponse {
  repeated ShopListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

// A shop of the team, OPEN OR CLOSED — a closed shop's page still reads (a-closed-shop-locks-all-but-its-grants).
message ShopDetailRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message ShopDetailResponse {
  Shop shop = 1;
}

// Refused on a CLOSED shop — FailedPrecondition, "reopen the shop first" (a-closed-shop-locks-all-but-its-grants).
message ShopUpdateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];

  // Absent = leave alone. Present = write it.
  optional string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string shop_code = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  optional warehouse.marketplace.v1.Marketplace marketplace = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string description = 6 [(buf.validate.field).string = {max_len: 1000}];
}

message ShopUpdateResponse {
  Shop shop = 1;
}

// --- Close and reopen (a-shop-is-closed-never-deleted) ---

// Closes a shop of the team: `status = closed`, `closed_at` now. Never refused for its drafts — they stay waiting
// (a-close-leaves-the-drafts-waiting). Frees its code (a-shop-code-is-unique-among-open-shops). Idempotent: an already
// closed shop is answered as it is, its close date unchanged. The team's owner and admin, and root or the
// administrator (a-closed-shop-locks-all-but-its-grants).
message ShopCloseRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message ShopCloseResponse {
  Shop shop = 1;
}

// Reopens a closed shop of the team. Refused — FailedPrecondition, naming that shop — while an OPEN shop of the team
// holds its code (a-shop-code-is-unique-among-open-shops): rename one, then reopen. Idempotent: an open shop is answered
// as it is. Same roles as ShopClose.
message ShopReopenRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message ShopReopenResponse {
  Shop shop = 1;
}

// --- Shop access (#86): the users who may work on a shop. user_id is an OPAQUE user_service id. ---

message ShopUserListRequest {
  // Read: anyone in the team (same audience as ShopList).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  ShopUserListFilter filter = 2;
  ShopUserListFilterSort sort = 3;
  repeated ShopUserListDataType data_request = 4;
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

message ShopUserListFilter {
  uint64 shop_id = 1 [(buf.validate.field).uint64.gt = 0];
}

// ShopUserList returns opaque user ids; there is no user entity here, so the only slice is GENERAL
// (id only). Callers resolve names via UserByIDs.
enum ShopUserListDataType {
  SHOP_USER_LIST_DATA_TYPE_UNSPECIFIED = 0;
  SHOP_USER_LIST_DATA_TYPE_GENERAL = 1;
}

message ShopUserListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    warehouse.common.v1.GeneralSort general = 2;
  }
}

message ShopUserListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
  }
}

message ShopUserListResponse {
  // The user ids (opaque; resolve via UserByIDs) in sorted order live in ids.
  repeated ShopUserListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message ShopUserAddRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 user_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ShopUserAddResponse {}

message ShopUserRemoveRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];
  uint64 user_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ShopUserRemoveResponse {}

// --- The primary CS (the-primary-cs-is-a-flag-on-a-grant) ---

message ShopUserSetPrimaryRequest {
  // Write: the managers who give and take grants.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Must already hold a grant on the shop — a primary is never someone without access.
  uint64 user_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ShopUserSetPrimaryResponse {
  Shop shop = 1;
}

// --- ShopAccessCheck (one-call-answers-the-shop-and-the-access) ---
//
// ⚠ Built as shop critique 10 recommends — the owner's §Rpc draft had no team to scope it and message
// names buf refuses — keeping the owner's field name `is_have_access`.

message ShopAccessCheckRequest {
  // Read: the team's own people. The importer asks it under the uploader's token, settlement under the
  // poster's — both CS and up.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Whose access to answer for.
  uint64 user_id = 3 [(buf.validate.field).uint64.gt = 0];
}

message ShopAccessCheckResponse {
  // A shop of the request's team — a CLOSED one included, with its `status`, and each caller decides
  // (a-closed-shop-refuses-only-new-selling): a statement import still passes, a new order does not. Another team's
  // shop, or one that never existed, is NotFound.
  Shop shop = 1;
  // The shop's primary CS — 0 = none (a-shop-with-no-primary-cs-cannot-import).
  uint64 primary_user_id = 2;
  // May the user WRITE on the shop (a-write-needs-a-grant-or-a-manager): granted it, or the team's
  // owner or admin, or root or admin.
  bool is_have_access = 3;
}

// ---------------------------------------------------------------------------- by ids

// SHOPS BY ID, ACROSS TEAMS (the-warehouse-row-fills-from-shop-and-user-by-ids): a warehouse ships other teams'
// orders, and its row names each order's shop and marketplace. One call per page, never one per row.
//
// BASIC FIELDS ONLY — id, name, marketplace, owning team. Never members, grants or settings: an unscoped read must
// not become a way into another team's shop. A CLOSED shop is still returned, so an old order still names its
// shop; an id that never existed is absent.
message ShopByIdsRequest {
  // Deliberately UNSCOPED, like TeamByIds and UserByIDs: a cross-team bulk lookup.
  option (warehouse.role_base.v1.request_policy) = {allow_only_authenticated: true};

  ShopByIdsFilter filter = 1 [(buf.validate.field).required = true];
  // Empty defaults to the BASIC slice.
  repeated ShopByIdsDataType data_request = 2;
}

message ShopByIdsFilter {
  repeated uint64 ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

enum ShopByIdsDataType {
  SHOP_BY_IDS_DATA_TYPE_UNSPECIFIED = 0;
  SHOP_BY_IDS_DATA_TYPE_GENERAL = 1;
  SHOP_BY_IDS_DATA_TYPE_BASIC = 2;
}

// What anyone signed in may know about a shop.
message ShopBasic {
  uint64 id = 1;
  // The owning SELLING team.
  uint64 team_id = 2;
  string name = 3;
  warehouse.marketplace.v1.Marketplace marketplace = 4;
}

message ShopBasicMapItem {
  map<uint64, ShopBasic> map_data = 1;
}

message ShopByIdsResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    ShopBasicMapItem basic = 2;
  }
}

message ShopByIdsResponseList {
  repeated ShopByIdsResponseItem items = 1;
}

// Keyed by shop id.
message ShopByIdsResponse {
  map<uint64, ShopByIdsResponseList> items = 1;
}
