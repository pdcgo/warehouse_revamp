syntax = "proto3";

package warehouse.selling.v1;

import "buf/validate/validate.proto";
import "warehouse/common/v1/page.proto";
import "warehouse/common/v1/list.proto";
import "warehouse/marketplace/v1/marketplace.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/selling/v1;sellingv1";

// OrderService owns `orders` + `order_items` — the SELLING side of an order (#67): who ordered, from
// which shop, the lines, and the money. Fulfillment (pick→pack→ship) is a separate concern that
// waits on the warehouse core, so it is deliberately absent here. Team-scoped
// like the rest of selling_service; OrderCreate does NOT touch inventory (that is #69).
service OrderService {
  rpc OrderCreate(OrderCreateRequest) returns (OrderCreateResponse);
  rpc OrderList(OrderListRequest) returns (OrderListResponse);
  rpc OrderDetail(OrderDetailRequest) returns (OrderDetailResponse);

  // Cancel: PENDING -> CANCEL (terminal), and only the SELLING team (who-may-cancel-a-pending-order). The
  // warehouse hands a processed or picked order back to PENDING first. It returns the stock, publishes
  // OrderCancelled and cancels the sale, which is why it is not one of OrderStatusChange's plain moves.
  rpc OrderCancel(OrderCancelRequest) returns (OrderCancelResponse);

  // EVERY PLAIN MOVE of the status diagram (one-status-change-for-every-plain-move): the warehouse's
  // confirm, pick, hand back and handover, and customer service's shipped, completed, problem, lost and
  // forced return. The server holds the table of who may make which move. Many orders at once — a
  // handover scan of 30 parcels is one call, with a result per order.
  //
  //   pending → processed → picked → shipping → shipped → completed
  //   shipping / shipped / problem / completed → return · shipped / problem / return → lost
  //
  // Cancel and the return accept do more than move a status, so they keep their own RPCs.
  // THE LIST AS A FILE (one-export-is-the-list-as-a-file): the list's own filter, every page, the reader's columns,
  // .xlsx. A server stream — progress, then an expiring link.
  rpc OrderExport(OrderExportRequest) returns (stream OrderExportResponse);
  rpc OrderStatusChange(OrderStatusChangeRequest) returns (OrderStatusChangeResponse);
  // A NOTE ON THE ORDER (a-note-is-a-timeline-row): one order_timeline_logs row with no status, written by either end.
  // Never edited and never deleted — a correction is a new note.
  rpc OrderNoteCreate(OrderNoteCreateRequest) returns (OrderNoteCreateResponse);
  // EDIT RESI (the-seller-edits-the-resi-until-handover): the selling team replaces the tracking number, the label
  // file, or both, while the parcel is still in the building — pending, processed, picked. From shipping on the
  // courier has scanned the number, so it is refused. Each edit leaves a note row naming the old and the new.
  rpc OrderReceiptUpdate(OrderReceiptUpdateRequest) returns (OrderReceiptUpdateResponse);

  // ── What the CATALOGUE has been doing ──────────────────────────────────────────────────────────
  //
  // The selling team's product list asks one question of this service: when did each of these
  // products last SELL? It is the other half of the stock picture — a product with a full shelf and
  // no order in two months is a different problem from one that is simply out.
  //
  // Both are team-scoped like every other read here, so they can only ever describe the caller's own
  // orders.
  rpc OrderProductActivityByIds(OrderProductActivityByIdsRequest) returns (OrderProductActivityByIdsResponse);
  rpc OrderActivityStat(OrderActivityStatRequest) returns (OrderActivityStatResponse);

  // ── The ORDER LIST's own stat ──────────────────────────────────────────────────────────────────
  //
  // The stat above the list, and it is a DIFFERENT question from OrderActivityStat above: that one
  // describes a set of PRODUCTS ("when did each of these last sell"), this one describes the set of
  // ORDERS the screen is showing ("what is waiting on somebody, and what has it been worth").
  //
  // Deliberately NOT folded into OrderList. A stat that rode on the list response would be recomputed
  // on every page turn and every sort, for numbers that do not change when you turn a page — and it
  // would be scoped to the tab, so switching to "Cancelled" would empty the very counts you use to
  // decide which tab to open.
  rpc OrderStat(OrderStatRequest) returns (OrderStatResponse);

  // ── A statement's refs, resolved ───────────────────────────────────────────────────────────────
  //
  // The settlement importer turns every platform ref in a statement into OUR order, in one call per
  // file (settlement_importer critique 4): the order, its shop — a ref in another shop fails the file
  // (a-file-with-another-shops-orders-is-refused) — and its creator, whom the row counts for
  // (user-id-is-the-orders-creator-else-the-shops-primary-cs).
  rpc OrderByExternalRefs(OrderByExternalRefsRequest) returns (OrderByExternalRefsResponse);

  // The people the list's "created by" filter offers: everyone who typed in an order this team may list
  // (a-who-filter-lists-the-people-on-its-rows).
  rpc OrderCreatorList(OrderCreatorListRequest) returns (OrderCreatorListResponse);
}

// An order's status: the eleven of the order context's status diagram
// (the-status-move-is-the-only-journey). Who makes each move is OrderStatusChange's table.
//
// The numbers 1, 2, 3, 5 and 6 are kept from the old six, so an old value still means the status its
// rows were migrated to (00015): placed→pending, confirmed→processed, cancelled→cancel, packed→picked,
// shipped→shipping. Old picking (4) became processed, and is reserved.
enum OrderStatus {
  reserved 4;
  reserved "ORDER_STATUS_PLACED", "ORDER_STATUS_CONFIRMED", "ORDER_STATUS_CANCELLED",
    "ORDER_STATUS_PICKING", "ORDER_STATUS_PACKED";

  ORDER_STATUS_UNSPECIFIED = 0;
  // Created, waiting for the warehouse.
  ORDER_STATUS_PENDING = 1;
  // The warehouse confirmed it and printed the label.
  ORDER_STATUS_PROCESSED = 2;
  // Called off by the selling team, from pending only. Terminal.
  ORDER_STATUS_CANCEL = 3;
  // The warehouse set it picked: done, waiting for the handover.
  ORDER_STATUS_PICKED = 5;
  // Handed to the courier, by the warehouse's handover scan.
  ORDER_STATUS_SHIPPING = 6;
  // Customer service saw it moving on the platform.
  ORDER_STATUS_SHIPPED = 7;
  ORDER_STATUS_COMPLETED = 8;
  // Customer service saw a problem on the platform.
  ORDER_STATUS_PROBLEM = 9;
  // Terminal (lost-is-final).
  ORDER_STATUS_LOST = 10;
  // Coming back: claimed by customer service, or forced by the warehouse.
  ORDER_STATUS_RETURN = 11;
  // Back in the warehouse, accepted. Terminal.
  ORDER_STATUS_RETURN_COMPLETED = 12;
}

// WHICH SIDE wrote a timeline row (order-timeline-logs-replaces-order-events): the warehouse working the order, or
// the selling team that owns it.
enum OrderTimelineFrom {
  ORDER_TIMELINE_FROM_UNSPECIFIED = 0;
  ORDER_TIMELINE_FROM_WAREHOUSE = 1;
  ORDER_TIMELINE_FROM_SELLING = 2;
}

// One row of an order's timeline (order-timeline-logs-replaces-order-events) — a STATUS CHANGE, or a NOTE written
// while working it (*no goods on Rak A*), with who wrote it and from which side.
message OrderTimelineLog {
  uint64 id = 1;
  // The status the order moved INTO. UNSPECIFIED = a note only, no move.
  OrderStatus status = 2;
  // Why, on a move that needed a reason (back to pending), or the note itself.
  string note = 3;
  OrderTimelineFrom from = 4;
  // The opaque user_service id of whoever wrote it; 0 = not recorded. Resolved to a name at read time, never
  // snapshotted — a person's name is theirs to change.
  uint64 actor_id = 5;
  int64 created_at_unix = 6;
}

// OrderItem is one order line. product_id is an OPAQUE product_service id; sku/name are a SNAPSHOT
// taken at order time, so later catalogue edits never rewrite an order's history. Used for both input
// (create; `id` and every money field ignored) and output.
//
// ⚠ A LINE CARRIES NO MARKETPLACE PRICE (an-order-line-carries-no-marketplace-price). Every money field
// is what inventory's take drew and priced the line at, frozen when the order was placed; what the
// marketplace charged lives on the draft's platform rows only.
message OrderItem {
  uint64 id = 1;
  uint64 product_id = 2 [(buf.validate.field).uint64.gt = 0];
  string sku = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  uint32 quantity = 5 [(buf.validate.field).uint32.gte = 1];
  // 6 was `unit_price` — a line carries no price of its own (an-order-line-carries-no-marketplace-price, corrected
  // 2026-10-23); its readers moved to `unit_cost` and `unit_cost_with_markup`. Selling 00028 dropped the column.
  reserved 6;
  reserved "unit_price";

  // What this product COST us, per unit, frozen when the order was placed (#74) — the owner's
  // `unit_cost`: the units the take drew ÷ the quantity (an-order-is-costed-at-what-leaves-the-shelf),
  // whole rupiah.
  //
  // SERVER-SET AND IGNORED ON INPUT. A client supplying it would be writing its own margin, which is
  // the one number nobody placing an order should get to choose.
  //
  // 0 means "unknown", not "free": a product that was never restocked (received straight into stock,
  // say) has no recorded cost. Margin on such a line reads as if the goods were free, so 0 here is a
  // flag that the number is not to be trusted rather than a value to compute with.
  int64 unit_cost = 7;

  // The line's frozen TOTAL — the owner's `total`, `unit_cost_with_markup × quantity`: the goods the take
  // drew plus, on another team's product, that product's own cross markup (inventory-computes-the-markup).
  // What the product fee is posted from (the-ledger-charges-the-frozen-line-total). Unrounded rupiah
  // (rupiah-is-floating-point). SERVER-SET AND IGNORED ON INPUT. Absent = never frozen (a line placed
  // before selling 00023, or a product the take named no draw for) — never a 0.
  optional double total = 8;

  // One unit at the owner's markup — the owner's `unit_cost_with_markup`: on a borrowed product the
  // price after its cross markup, on an own product the unit cost. Unrounded rupiah, as the take
  // returned it. SERVER-SET AND IGNORED ON INPUT. Absent = never frozen (before selling 00025).
  optional double unit_cost_with_markup = 9;

  // What the markup added — the owner's `markup_total`, `total − unit_cost × quantity` (within the
  // rounding of the whole-rupiah `unit_cost`). 0 on an own product. Unrounded rupiah. SERVER-SET AND
  // IGNORED ON INPUT. Absent = never frozen (before selling 00025).
  optional double markup_total = 10;
}

// A customer's delivery address, FROZEN onto the order (#118).
//
// A SNAPSHOT, not a live reference. region_service's rows change — a desa is renamed, merged, split —
// and a historical order must keep reading exactly what was agreed, so the codes AND the names are
// stored. Rendering a past order therefore never needs region_service at all. This is the same
// decision the order already makes about its money and its line items: it freezes them.
//
// selling_service defines its OWN address shape rather than importing region_service's
// RegionAncestry: a snapshot is THIS service's data (HARD RULE 3), and it must not track another
// service's contract.
message OrderAddress {
  string provinsi_code = 1;
  string provinsi_name = 2;
  string kabupaten_code = 3;
  string kabupaten_name = 4;
  string kecamatan_code = 5;
  string kecamatan_name = 6;
  string desa_code = 7;
  string desa_name = 8;
  // The desa's postcode as chosen — editable in the picker, so not necessarily the dataset's.
  string kode_pos = 9;
  // Jalan, no. rumah, RT/RW — the part no dataset can supply. This is what the old free-text
  // `customer_address` carried.
  string address_line = 10;
}

// The SHIPPING RECEIPT attached to an order (owner) — the courier's slip photographed, or the PDF
// the marketplace prints. One per order.
//
// A REFERENCE, not the file: the bytes live in document_service, and this records which document
// they are. The id is opaque (no FK across services, HARD RULE 3), and the two labels beside it are
// a deliberate SNAPSHOT — an order can name its attachment, and say whether it is a picture or a
// PDF, without calling another service to render a row.
//
// The document is PRIVATE, so viewing it is a DocumentService.GetDownloadUrl call scoped to the
// team. Storing a URL here instead would either be a link that expires in the database, or a
// permanently public one for a document that names a buyer and their address.
message OrderReceipt {
  // A document_service id. "" = no receipt, which is the ordinary state of a fresh order.
  string document_id = 1 [(buf.validate.field).string.max_len = 64];
  // What it was called when it was uploaded — the label a person recognises in a list.
  string filename = 2 [(buf.validate.field).string.max_len = 255];
  // image/jpeg, application/pdf, … Kept so the reader knows whether it can show the thing inline or
  // must offer it as a download, without fetching the file to find out.
  string mime_type = 3 [(buf.validate.field).string.max_len = 128];
}

message Order {
  uint64 id = 1;
  uint64 team_id = 2;
  uint64 shop_id = 3;
  OrderStatus status = 4;

  string customer_name = 5;
  string customer_phone = 6;
  // was `string customer_address` — free text, replaced by the structured snapshot `address` (#118).
  reserved 7;
  reserved "customer_address";
  // A courier code (opaque; no FK) — a shipment_service channel's `code`. Moves to
  // shipment_channel_id with the order redesign (the-old-catalogue-bridges-by-code).
  string shipping_code = 8;

  // 9, 10, 11 were `subtotal`, `shipping_cost` and `total`. The owner's `orders` has none of them: our side of the
  // trade is `goods_cost` and `total_cost` below, and an order records no shipping (an-order-records-no-shipping-cost).
  // Selling 00027 dropped the columns.
  reserved 9, 10, 11;
  reserved "subtotal", "shipping_cost", "total";

  // WHAT THE BUYER PAID on the platform — the owner's `platform_total` (the-total-is-ours-the-platform-total-is-theirs),
  // after the marketplace's vouchers, coin subsidies and promotions. A FACT read off the storefront, not an estimate
  // (marketplace-total-is-a-fact-not-an-estimate); stored because nothing here CAN derive it. Settlement opens the
  // order's account on it (`initial_total`).
  //
  // REQUIRED at placement since selling 00022 (platform-total-is-required-at-finalize), on both doors — so 0 only
  // survives on an order placed before that, and means "not recorded", never "sold for nothing".
  //
  //   margin = platform_total − total_cost        (an-order-records-no-shipping-cost)
  int64 platform_total = 17;

  // The lines — populated by OrderDetail (OrderList returns a summary without them).
  repeated OrderItem items = 12;

  // The order's TIMELINE, oldest first — populated by OrderDetail only, exactly like `items`. A list returning every
  // order's whole history would multiply its page size by the length of each life.
  repeated OrderTimelineLog timeline_logs = 23;
  // 20 was `events` (order_events), dropped for order_timeline_logs (order-timeline-logs-replaces-order-events).
  reserved 20;
  reserved "events";

  int64 created_at_unix = 13;

  // The frozen delivery address (#118).
  OrderAddress address = 14;

  // WHAT THE GOODS COST THE SELLER — the owner's `goods_cost`, "goods only, used for warehouse fee charge
  // calculation": Σ the lines' frozen `total`, so a borrowed line counts WITH its owner's markup
  // (the-cross-charge-lives-on-the-line). The warehouse fee is priced on it (the-fee-is-priced-on-goods-cost). Whole
  // rupiah, rounded once. Frozen at create (a-lines-money-is-frozen-at-finalize); an order placed before selling 00027
  // keeps the drawn cost it was frozen with, the same figure on any order with no borrowed line.
  //
  // Denormalised onto the header on purpose: OrderList returns a summary WITHOUT lines, so a list that wants to show
  // margin would otherwise have to load every order's items.
  //
  // 0 means the goods' cost is unknown (the take valued nothing), not that they were free.
  int64 goods_cost = 16;

  // GOODS + THE WAREHOUSE'S FEE — the owner's `total_cost`, what the order cost the seller ("total beli"). Frozen at
  // create beside the two it adds; unrounded rupiah, like the fee (rupiah-is-floating-point). An order whose fee was
  // never priced counts it as nothing here, so a reader that needs to know reads `warehouse_fee`'s absence.
  //
  //   total_cost = goods_cost + warehouse_fee        margin = platform_total − total_cost
  double total_cost = 31;

  // The shipping receipt attached to this order, if one was. Always present as a message; an order
  // with no receipt carries an empty `document_id` rather than a nil field, so a client renders it
  // without null-checking — the same convention `address` already follows.
  OrderReceipt receipt = 19;

  // The order's NOTES are timeline rows with no status (a-note-is-a-timeline-row) — OrderDetailResponse.timeline_logs.
  // The one free-text note this field held moved there as the order's first note row.
  reserved 18;
  reserved "note";

  // WHICH WAREHOUSE fulfils this order (#72) — chosen per order by whoever types it in, and stored
  // here rather than inferred. An opaque team_service id (a WAREHOUSE team); no FK across services.
  //
  // It is on the ORDER, not looked up from the shop, on purpose: a shop's default changing later
  // would otherwise silently make old orders read as if they had shipped from a building they never
  // shipped from. What an order says happened must stay what happened.
  //
  // This is also what makes #69 possible at all — "deduct at placement" is meaningless until an order
  // says which warehouse to deduct FROM.
  uint64 warehouse_id = 15;

  // THE MARKETPLACE'S OWN ID for this order — what the storefront calls it, read off the screen and
  // typed in beside the shop that took it (owner).
  //
  // It is the only name this order has that a BUYER, a courier's dashboard or the marketplace's own
  // support can be asked about: our `id` means nothing to any of them. So it is stored verbatim and
  // never parsed — every marketplace formats its reference differently, and any structure we imposed
  // would be a rule that the next storefront breaks.
  //
  // REQUIRED on every new order (an-order-ref-is-required-by-the-rpc). "" only on an order placed
  // before that rule — not a phone order, and not "unknown": it was simply never asked for.
  //
  // ⚠ NOT unique, and nothing joins on it. Two orders may share one — a duplicate is warned about,
  // never refused (a-duplicate-ref-is-warned-not-refused), because cancel-and-re-enter is legitimate.
  string order_external_ref_id = 21;

  // WHO TYPED IT IN — read from the authenticated caller at placement, never from the request, and never
  // updated. An opaque user_service id; the screen resolves the name with UserByIDs. 0 = not recorded
  // (an order placed before the creator was kept).
  uint64 created_by_user_id = 22;

  // HOW MANY UNITS — the sum of the order's line quantities (the-warehouse-row-fills-from-shop-and-user-by-ids),
  // computed by the query, so OrderList carries it without carrying the lines. OrderDetail fills it too.
  int64 item_quantity = 24;

  // THE TRACKING NUMBER — the one printed on the slip: the owner's `orders.receipt` (order context.md), what a buyer
  // chases a parcel by, and what a label scan matches beside the marketplace ref
  // (a-label-scan-reads-the-ref-or-the-receipt).
  //
  // Named apart from `receipt` above, which is the FILE the number is printed on — the two travel together and are
  // different facts: a slip can be photographed before anybody types its number, and a number can be pasted off the
  // storefront before any file exists. Stored verbatim, never parsed: every courier formats its own.
  //
  // "" = not recorded. Written at create. The seller may change it — the number, the file, or both — while the parcel
  // is still in the building, and never from `shipping` on (the-seller-edits-the-resi-until-handover); that edit RPC
  // is not built yet.
  string receipt_code = 25;

  // WHEN IT ENTERED ITS CURRENT STATUS — the newest timeline row moving it into `status`
  // (a-filtered-status-shows-its-own-date). OrderList fills it, so a status tab can date each row by its own step
  // without carrying the whole timeline. An order moved back into a status it held before reads the LATER move.
  //
  // 0 = no timeline row records the move: an order whose status changed before order_timeline_logs existed.
  int64 status_at_unix = 26;

  // THE WAREHOUSE'S FEE for fulfilling this order, FROZEN at create (the-flat-rate-is-dropped-last, step 3): priced
  // once by warehouse_service's WarehouseFeeCalculate on the order's goods cost (the-fee-is-priced-on-goods-cost) and
  // never recomputed, so a rate changed later cannot rewrite what an order cost. The owner's `warehouse_fee`.
  //
  // Unrounded rupiah, a double like the rate it came from (rupiah-is-floating-point) — when a frozen figure is rounded
  // is not decided, so it is not rounded.
  //
  // ABSENT = never priced: an order placed before fees were frozen. Never 0 for that — 0 is a warehouse that chose to
  // charge nothing, which is a price.
  optional double warehouse_fee = 27;

  // WHEN THE BUYER ORDERED on the storefront — the owner's `platform_created_at`, beside `created_at_unix`, which is
  // when WE wrote the row (platform-created-at-is-required-at-finalize). An order taken on Saturday and typed in on
  // Monday carries both. Required at create on both doors, so every order placed since carries one.
  //
  // 0 = not recorded: an order placed before the field existed.
  int64 platform_created_at_unix = 28;

  // The marketplace's own SHIP-BY time — its "kirim sebelum", the owner's `platform_shipment_deadline`
  // (the-shipment-deadline-is-the-platforms-and-optional). Nothing here computes it: it is the platform's promise,
  // read off the storefront or pushed by the app.
  //
  // 0 = none, which is allowed: an order with no deadline shows no urgency.
  int64 platform_shipment_deadline_unix = 29;

  // THE BUYER'S USERNAME on the marketplace — the name the buyer goes by in the marketplace chat
  // (the-buyers-username-is-optional). Not `customer_name`, which is who the parcel is addressed to: the two can differ.
  //
  // "" = none, which is a valid order on both doors. Stored as typed, trimmed.
  string buyer_username = 30;
}

// WHICH DATE a list's date window reads (the-date-filter-switches-created-or-platform). The two answer different
// questions — "what came in today" against "the buyers' Saturday orders" — and an order carries both.
enum OrderDateField {
  // The default, and the same as CREATED: when we wrote the row down.
  ORDER_DATE_FIELD_UNSPECIFIED = 0;
  // `created_at` — when the order was typed in or promoted.
  ORDER_DATE_FIELD_CREATED = 1;
  // `platform_created_at` — when the buyer ordered on the storefront.
  ORDER_DATE_FIELD_PLATFORM_CREATED = 2;
}

message OrderCreateRequest {
  // Write: the selling team's managers and customer service (CS types orders in).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 shop_id = 2 [(buf.validate.field).uint64.gt = 0];

  // Which warehouse fulfils it (#72). REQUIRED, and deliberately so: from #69 an order takes its
  // stock out of this warehouse at placement, and an order that cannot say where its goods come from
  // is not an order the system can honour. Making it optional would mean inventing a default at the
  // moment stock moves, which is the guess this whole design refuses.
  uint64 warehouse_id = 12 [(buf.validate.field).uint64.gt = 0];

  string customer_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string customer_phone = 4 [(buf.validate.field).string.max_len = 40];
  // was `string customer_address` — free text, replaced by `address` below (#118).
  reserved 5;
  reserved "customer_address";
  string shipping_code = 6 [(buf.validate.field).string.max_len = 40];

  // 7, 8, 9 were `subtotal`, `shipping_cost` and `total` — the order's money is the take's, frozen by the server
  // (goods_cost, warehouse_fee, total_cost), and it records no shipping (an-order-records-no-shipping-cost).
  reserved 7, 8, 9;
  reserved "subtotal", "shipping_cost", "total";

  // What the buyer PAID on the platform. REQUIRED at finalize (platform-total-is-required-at-finalize) — refused
  // when 0 by the placement rule both doors share, so the message names what is missing rather than a field number.
  // See Order.platform_total.
  int64 platform_total = 13 [(buf.validate.field).int64.gte = 0];

  // The shipping receipt, already uploaded to document_service by the client. Optional.
  //
  // NOT VERIFIED HERE, and that is a choice rather than an oversight: checking the id would make
  // placing an order depend on document_service being up, for a label. A wrong id costs a receipt
  // that will not open — never another team's file, because GetDownloadUrl is scoped to the caller's
  // own team and refuses anything else.
  OrderReceipt receipt = 15;

  // A free-text note about the order, for the people who handle it. Optional; "" is the ordinary
  // case. Written as the order's FIRST NOTE ROW (a-note-is-a-timeline-row): from selling, by the caller, in the
  // order's own transaction. Nothing in the system branches on it.
  //
  // Capped at 2000 characters: long enough for the several sentences a difficult order really does
  // need, short enough that the field cannot become a document store.
  string note = 14 [(buf.validate.field).string.max_len = 2000];

  // The marketplace's own id for this order, as the person read it off the storefront. REQUIRED
  // (an-order-ref-is-required-by-the-rpc): every order comes from a marketplace, and the ref is what the
  // duplicate warning and the order Import match on. Refused here, by the request's validation, before
  // any handler runs. Orders placed before the rule keep their "". See Order.order_external_ref_id.
  //
  // Capped at 128 to match OrderDraft.external_id — the two hold the same kind of thing, and a
  // reference that fits in a draft must fit in the order that draft becomes.
  string order_external_ref_id = 16 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // The tracking number printed on the slip, as the person read it — off the storefront or off the label. Optional;
  // "" = not known yet. See Order.receipt_code.
  string receipt_code = 17 [(buf.validate.field).string.max_len = 64];

  // When the buyer ordered on the storefront, read off the same page as the ref. REQUIRED
  // (platform-created-at-is-required-at-finalize) — refused when 0 by the placement rule both doors share, so the
  // message names what is missing rather than a field number. See Order.platform_created_at_unix.
  int64 platform_created_at_unix = 18 [(buf.validate.field).int64.gte = 0];
  // The marketplace's ship-by time. Optional; 0 = none. See Order.platform_shipment_deadline_unix.
  int64 platform_shipment_deadline_unix = 19 [(buf.validate.field).int64.gte = 0];

  // The buyer's username on the marketplace. Optional; "" = none, and nothing refuses it
  // (the-buyers-username-is-optional). Trimmed by the handler, so spaces alone are stored as none. See
  // Order.buyer_username.
  string buyer_username = 20 [(buf.validate.field).string.max_len = 100];

  // At least one line; `id` on each is ignored.
  repeated OrderItem items = 10 [(buf.validate.field).repeated.min_items = 1];

  // The delivery address, snapshotted onto the order. Optional — exactly as the free text it
  // replaces was: an order can be taken before the address is known, and forcing four region levels
  // to place one would be a new rule, not a port of the old one.
  OrderAddress address = 11;

  // THE DRAFT THIS ORDER FINISHES — what the draft page's Promote sends
  // (a-draft-becomes-an-order-through-order-create). Optional; 0 = an order typed from scratch. When set, the draft
  // must be the scoped team's and the caller's, and it is DELETED in the order's own transaction: a refused order
  // leaves it, and a draft already turned into an order refuses the second one. Everything the order says comes from
  // the fields above, never from the draft — the page sends what is on its screen.
  uint64 order_draft_id = 21;
}

message OrderCreateResponse {
  Order order = 1;
}

message OrderListRequest {
  // Read: BOTH SIDES of an order (#151). A selling team sees the orders it placed; a WAREHOUSE sees the
  // orders shipping FROM it, which is the queue its crew picks from.
  //
  // One RPC rather than two, following RestockRequestList: it is the same order approached from
  // whichever end you stand at, and two RPCs would drift apart. So `team_id` means "the team you hold a
  // role in", and the handler matches it against EITHER side — not "the team whose orders you get".
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OrderListFilter filter = 2;
  OrderListFilterSort sort = 3;
  repeated OrderListDataType data_request = 4;
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

// OrderListFilter carries the NON-scope filters (all server-side because the list is paginated — a
// client-side filter would narrow the loaded page only, and the count driving the pager would still
// be the unfiltered total).
message OrderListFilter {
  // Filter to ONE status; UNSPECIFIED (the default) means ALL of them (#151).
  OrderStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  // Only orders carrying THIS product on one of their lines (#159). 0 = no filter.
  uint64 product_id = 2;

  // ── The three below are MIRRORED on OrderStatFilter ──────────────────────────────────────────
  //
  // They narrow WHICH ORDERS EXIST for this screen, so the header's counts must be computed over the
  // same set or the tabs would total a different population than the table shows. `status` is the one
  // filter deliberately NOT mirrored, because it IS the tab.

  // Free text over the customer's NAME, their PHONE, the MARKETPLACE REF, the TRACKING NUMBER
  // (`receipt_code`) and — when the term is all digits — the ORDER ID. Case-insensitive, substring.
  // "" = no filter.
  //
  // Those and no more. A person looking an order up has one of them in front of them: the buyer said
  // their name, the buyer rang from a number, somebody quoted an order number, or a parcel is in their
  // hand with its slip on it (a-label-scan-reads-the-ref-or-the-receipt). Widening
  // it to the address or the line items would make the same term match orders for reasons the person
  // searching cannot see, and every extra column is another one the query cannot use an index for.
  string search = 3 [(buf.validate.field).string.max_len = 100];

  // Only orders placed on THIS shop. 0 = no filter.
  //
  // A shop belongs to a SELLING team, so this is meaningful only when a selling team is asking. A
  // warehouse reading its pick queue holds no shops; it simply leaves this at 0.
  uint64 shop_id = 4;

  // The window the order was PLACED in — `created_at`, inclusive on both ends, unix seconds.
  // 0 on either side is an OPEN end, so {0,0} means every date.
  //
  // `created_at` because it is the only timestamp an order has that means anything to the person
  // filtering. When fulfilment starts stamping its own (picked_at, shipped_at), this becomes a
  // WHICH-timestamp choice and the field names here are what stop that being ambiguous — the shared
  // DateRangePicker already carries a field segment for exactly that.
  int64 created_from_unix = 5;
  int64 created_to_unix = 6;

  // Only orders THIS person typed in (`created_by_user_id`). 0 = anybody. An order placed before the
  // creator was kept matches nobody: the record does not say, and filing it under a name would invent the
  // one fact being filtered on. The picker offers OrderCreatorList.
  uint64 created_by_user_id = 7;

  // The warehouse's three filters (the-filter-gains-seller-marketplace-and-courier). The same filter feeds OrderStat
  // through scopedOrders, so the counts match the rows.
  //
  // Only orders of THIS selling team — the order's `team_id`. Named apart from the request's `team_id`, which is
  // the caller's scope. 0 = any.
  uint64 seller_team_id = 8;
  // Only orders whose shop is on this marketplace. UNSPECIFIED = any.
  warehouse.marketplace.v1.Marketplace marketplace = 9 [(buf.validate.field).enum.defined_only = true];
  // Only orders with this courier — `shipping_code` (jne, jnt …). Empty = any.
  string shipping_code = 10 [(buf.validate.field).string.max_len = 50];

  // Only orders shipping FROM this warehouse — the order's `warehouse_id`. 0 = any.
  //
  // The SELLING list's question ("only the ones leaving Gudang Pusat"). A warehouse reading its own queue leaves it at
  // 0: the scope already narrows it to the orders it ships, and naming another warehouse here matches nothing.
  uint64 warehouse_id = 11;

  // WHICH DATE `created_from_unix` / `created_to_unix` read (the-date-filter-switches-created-or-platform):
  // UNSPECIFIED or CREATED = when we wrote the row, PLATFORM_CREATED = when the buyer ordered. The window's fields keep
  // their names; this says which column they are measured against. An order with no platform date never matches a
  // platform-date window — it has no date there to fall inside.
  OrderDateField date_field = 12 [(buf.validate.field).enum.defined_only = true];
}

// OrderListDataType selects which slices the response carries per order.
enum OrderListDataType {
  ORDER_LIST_DATA_TYPE_UNSPECIFIED = 0;
  ORDER_LIST_DATA_TYPE_GENERAL = 1;
  ORDER_LIST_DATA_TYPE_ORDER = 2;
}

// OrderRowSort is the sort selection paired with the ORDER slice.
enum OrderRowSort {
  ORDER_ROW_SORT_UNSPECIFIED = 0;
  ORDER_ROW_SORT_ID = 1;
  ORDER_ROW_SORT_TOTAL = 2;
}

message OrderListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    warehouse.common.v1.GeneralSort general = 2;
    OrderRowSort order = 3;
  }
}

// The ORDER slice reuses the Order message directly (a list summary leaves items empty).
message OrderRowMapItem {
  map<uint64, Order> map_data = 1;
}

message OrderListResponseItem {
  oneof d {
    warehouse.common.v1.GeneralMapItem general = 1;
    OrderRowMapItem order = 2;
  }
}

message OrderListResponse {
  repeated OrderListResponseItem items = 1;
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}

message OrderDetailRequest {
  // Read: BOTH SIDES, exactly as OrderList (#151). The warehouse needs this one more than anybody — the
  // PICK LIST IS THE ORDER'S LINES, and nothing else returns them. A crew that can list its queue but
  // cannot open an order can see there is work and not what the work is.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 order_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message OrderDetailResponse {
  Order order = 1;
}

// OrderCancel moves a PENDING order to CANCEL (terminal), returning its stock and cancelling its sale.
// Only the order's SELLING team (who-may-cancel-a-pending-order); any other status is refused.
message OrderCancelRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 order_id = 2 [(buf.validate.field).uint64.gt = 0];
}

message OrderCancelResponse {
  Order order = 1;
}

// WHOSE COLUMNS an export is written in — the reader's own row, as on screen (one-export-is-the-list-as-a-file).
enum OrderExportView {
  ORDER_EXPORT_VIEW_UNSPECIFIED = 0;
  // The selling team's order list.
  ORDER_EXPORT_VIEW_SELLER = 1;
  // The warehouse's order list.
  ORDER_EXPORT_VIEW_WAREHOUSE = 2;
}

// THE LIST AS A FILE (one-export-is-the-list-as-a-file) — exactly the rows the list holds with this filter, every page
// of them, in the reader's columns.
message OrderExportRequest {
  // Whoever may read the list may export it.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The list's own filter — the status tab included.
  OrderListFilter filter = 2;
  OrderExportView view = 3 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // THE TICKED ROWS, when the warehouse's bar exports a selection (the-bulk-actions-are-always-on-screen): only these
  // orders, still within the scope and the filter. Empty = every row the filter holds.
  repeated uint64 order_ids = 4 [(buf.validate.field).repeated = {
    max_items: 200
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

// One message of the stream (code-implementation-guideline.md): a log line, the progress, and — on the last message —
// the file.
message OrderExportResponse {
  // A sentence about the step, as the guideline requires every long task's message to carry.
  string message = 1;
  // Rows written so far, of the total the filter holds.
  int64 done = 2;
  int64 total = 3;
  // Set on the LAST message only: the file's expiring link, and its name.
  string download_url = 4;
  string filename = 5;
}

// OrderStatusChange makes one plain move for many orders (one-status-change-for-every-plain-move).
message OrderStatusChangeRequest {
  // Write: both ends of an order. The warehouse crew makes its moves (staff included — they are the
  // ones at the shelf and the handover), and the selling team's customer service makes its own. Which
  // end the caller is, per order, follows from the scope: the order's warehouse, or its team.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The team making the move: the order's warehouse, or its selling team.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  // The orders to move. A handover scan sends the whole batch, and each gets its own result.
  repeated uint64 order_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1,
    max_items: 200,
    unique: true,
    items: {uint64: {gt: 0}}
  }];
  // The status to move INTO. Cancel and return_completed have their own actions and are refused here.
  OrderStatus to = 3 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  // Why: required for a move back to pending, and written to the order's history with the move.
  string note = 4 [(buf.validate.field).string.max_len = 500];
}

message OrderStatusChangeResponse {
  // One per requested order, in the order sent.
  repeated OrderStatusChangeResult results = 1;
}

// One order's outcome. A refusal never blocks the rest: 30 scanned, 28 moved, 2 "not picked yet".
message OrderStatusChangeResult {
  uint64 order_id = 1;
  bool moved = 2;
  // Where the order is now: the new status if moved, its unchanged one if refused, UNSPECIFIED when
  // it is not one of the caller's orders.
  OrderStatus status = 3;
  // Why it did not move, for a person to read. Empty when moved.
  string refused_reason = 4;
}

// Write: both ends of an order, as a status move (OrderStatusChangeRequest). The side the note is from follows from
// the scope: the order's selling team writes from selling, its warehouse from warehouse.
message OrderNoteCreateRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // The team writing: the order's selling team, or its warehouse. Any other team reads NotFound.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 order_id = 2 [(buf.validate.field).uint64.gt = 0];
  // The note itself, 1 to 500 characters. Trimmed; a note of only spaces is refused.
  string note = 3 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 500
  }];
}

message OrderNoteCreateResponse {
  // The row written: no status, the note, its side, the caller as its actor.
  OrderTimelineLog log = 1;
}

message OrderReceiptUpdateRequest {
  // The selling team's action only: the marketplace issues the number on the seller's label, so the warehouse does
  // not edit it (the-seller-edits-the-resi-until-handover).
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  // The order's selling team. Any other team, its warehouse included, reads NotFound.
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  uint64 order_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Each of the two is changed ON ITS OWN: unset leaves it as it is. At least one must be set.
  //
  // The new tracking number, verbatim; "" removes it.
  optional string receipt_code = 3 [(buf.validate.field).string.max_len = 64];
  // The new label file, already uploaded to document_service by the client; an empty `document_id` removes it.
  OrderReceipt receipt = 4;
}

message OrderReceiptUpdateResponse {
  // The order as it now is. Unchanged, with no note written, when the request named what was already there.
  Order order = 1;
}

// ── Order activity, per product ──────────────────────────────────────────────────────────────────

// OrderProductActivityItem is what one product has been doing on this team's orders.
message OrderProductActivityItem {
  // When it last sold. 0 = never ordered.
  //
  // CANCELLED orders do not count. The question this answers is "is this product moving", and an
  // order that was placed and then unwound moved nothing — treating it as a sale would make a dead
  // product look alive on the strength of a mistake somebody corrected.
  int64 last_order_unix = 1;

  // How many UNITS of it were sold in the last 30 days, over the same non-cancelled orders. A date
  // alone cannot separate "sold one, once" from "sells fifty a week".
  int64 sold_qty_30d = 2;
}

message OrderProductActivityMapItem {
  map<uint64, OrderProductActivityItem> map_data = 1;
}

enum OrderProductActivityDataType {
  ORDER_PRODUCT_ACTIVITY_DATA_TYPE_UNSPECIFIED = 0;
  ORDER_PRODUCT_ACTIVITY_DATA_TYPE_ACTIVITY = 1;
}

message OrderProductActivityByIdsFilter {
  // The products to answer for — ids the caller already holds from its own catalogue. No paging: the
  // caller supplies the set, and max_items is what stops this becoming a bulk export.
  repeated uint64 product_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
}

message OrderProductActivityByIdsRequest {
  // Read: the team's own people, the same audience as OrderList.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  OrderProductActivityByIdsFilter filter = 2 [(buf.validate.field).required = true];
  repeated OrderProductActivityDataType data_request = 3;
}

message OrderProductActivityByIdsResponseItem {
  oneof d {
    OrderProductActivityMapItem activity = 1;
  }
}

message OrderProductActivityByIdsResponseList {
  repeated OrderProductActivityByIdsResponseItem items = 1;
}

message OrderProductActivityByIdsResponse {
  // Keyed by product id. A product that has never been ordered is ABSENT rather than a row of zeros.
  map<uint64, OrderProductActivityByIdsResponseList> items = 1;
}

message OrderActivityStatRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
}

message OrderActivityPreview {
  // The last time this team sold ANYTHING. 0 = never.
  int64 last_order_unix = 1;
  // Orders placed in the last 30 days, cancelled ones excluded.
  int64 orders_30d = 2;
}

message OrderActivityStatResponse {
  OrderActivityPreview preview = 1;
}

// ── The order list's stat ─────────────────────────────────────────────────────────────────────────

// OrderStatFilter mirrors OrderListFilter MINUS the status, and the omission is the point: this stat
// GROUPS BY status, so filtering to one would leave every other tab's count at zero. The screen's tab
// is a filter on the list, never on the stat.
message OrderStatFilter {
  // ⚠ Every field mirrors OrderListFilter's, because both feed scopedOrders: the strip above the list must count
  // exactly the rows below it (the-filter-gains-seller-marketplace-and-courier).
  // Only orders carrying THIS product on one of their lines, exactly as OrderListFilter means it.
  // 0 = no filter.
  uint64 product_id = 1;

  // The mirror of OrderListFilter's search / shop / date window / creator, and the mirroring is load-bearing
  // rather than tidy: these narrow which orders exist for the screen, so a header computed without
  // them would sit above a table describing a smaller set — "Placed 12" over four visible rows, with
  // nothing on screen explaining the gap. The server shares ONE query builder between the two RPCs so
  // they cannot drift.
  //
  // Each means exactly what it means on OrderListFilter; see there for why search covers those three
  // columns and why the window is `created_at`.
  string search = 2 [(buf.validate.field).string.max_len = 100];
  uint64 shop_id = 3;
  int64 created_from_unix = 4;
  int64 created_to_unix = 5;
  uint64 created_by_user_id = 6;

  // The warehouse's three filters, as on OrderListFilter.
  uint64 seller_team_id = 7;
  warehouse.marketplace.v1.Marketplace marketplace = 8 [(buf.validate.field).enum.defined_only = true];
  string shipping_code = 9 [(buf.validate.field).string.max_len = 50];

  // The seller list's warehouse filter, as on OrderListFilter.
  uint64 warehouse_id = 10;

  // Which date the window reads, as on OrderListFilter — so the tab counts total what the table shows.
  OrderDateField date_field = 11 [(buf.validate.field).enum.defined_only = true];
}

message OrderStatRequest {
  // Read: BOTH SIDES, matching OrderListRequest exactly. The stat describes the same set of orders the
  // list does, so anyone who may see the list may see its totals — a warehouse reading its pick queue
  // included. Any narrower policy here would mean a screen whose table loads and whose header 403s.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OrderStatFilter filter = 2;
}

// OrderStatusCount is one status and what is sitting in it RIGHT NOW — the GROUPING half of the stat.
//
// It is a live census, not a window: an order counted here is an order in that state today. That is
// what makes it the work queue, and it is why these numbers carry no date range while the preview's
// do.
message OrderStatusCount {
  OrderStatus status = 1;
  int64 count = 2;
  // The sum of those orders' `platform_total`, whole rupiah — what the buyers paid the platform for them. Every order in
  // the pile, measurable or not (an order placed before platform-total-is-required-at-finalize adds its 0). It summed
  // `total` until selling 00027 dropped that column.
  int64 value = 3;

  // Σ line quantity over EVERY order in the pile — units, not lines, because units are what UPT counts
  // (the-summary-follows-the-tab: UPT = item_count ÷ count).
  int64 item_count = 4;

  // ── The margin's inputs (the-margin-is-mp-minus-total-beli) ───────────────────────────────────────────────────
  //
  // ⚠ SUMMED OVER THE MEASURABLE ORDERS ONLY — an order with a cost (`goods_cost` > 0), a platform figure
  // (`platform_total` > 0) and a frozen `warehouse_fee`. The margin needs all three, and summing every order's
  // revenue against only the costed orders' cost is what once put a 36% margin at 48%. Only the server knows the size
  // of what it leaves out, so it does the leaving out.
  //
  //   total beli = goods_cost + fees        margin = mp_value − total beli        % = margin ÷ mp_value

  // Σ platform_total — what the buyers paid the platform.
  int64 mp_value = 5;
  // Σ goods_cost — what the goods cost the seller, borrowed lines with their markup.
  int64 goods_cost = 6;
  // Σ warehouse_fee — what fulfilling them cost. Unrounded rupiah, like the frozen fees it adds.
  double fees = 7;
  // How many of `count` are NOT measurable, so the reader is told what the three sums above left out.
  int64 margin_unknown = 8;
}

// OrderStatPreview is the MONEY half — a rolling 30-day window, which is what a person means by "how
// is it going lately".
//
// CANCELLED orders are excluded from both figures, for the same reason OrderActivityPreview excludes
// them: a cancelled order is not a sale, and counting one would let a team read revenue it never took.
//
// There is no average-order-value field, deliberately. It is `revenue_30d / orders_30d`, and a client
// that divides the two numbers it is already displaying cannot disagree with the tiles beside it —
// whereas a third number computed here could, the moment either definition moved.
message OrderStatPreview {
  int64 orders_30d = 1;
  // Σ `platform_total` over the window — what the buyers paid. It summed `total` until selling 00027 dropped it.
  int64 revenue_30d = 2;
}

message OrderStatResponse {
  OrderStatPreview preview = 1;
  // One entry per status that HAS orders. A status with none is absent rather than a zero row — the
  // caller knows the full enum and renders the gaps, and "nothing to say" travels lighter (the same
  // convention OwnerStockByIds uses for a product with no stock).
  repeated OrderStatusCount by_status = 2;
}

// ── OrderByExternalRefs ──────────────────────────────────────────────────────────────────────────

message OrderByExternalRefsFilter {
  // The marketplace refs, as the statement wrote them. No paging: the caller supplies the set, and
  // max_items is a statement's worth — the largest sample carries under 1,500.
  repeated string refs = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2000
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

enum OrderByExternalRefsDataType {
  ORDER_BY_EXTERNAL_REFS_DATA_TYPE_UNSPECIFIED = 0;
  ORDER_BY_EXTERNAL_REFS_DATA_TYPE_ORDER_REF = 1;
}

message OrderByExternalRefsRequest {
  // Read: the team's own people, the same audience as OrderList — the importer asks under the
  // uploader's token.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OrderByExternalRefsFilter filter = 2 [(buf.validate.field).required = true];
  repeated OrderByExternalRefsDataType data_request = 3;
}

// One of the team's orders carrying the ref.
message OrderRefItem {
  uint64 order_id = 1;
  uint64 shop_id = 2;
  // Who placed it — 0 on an order placed before the creator was recorded.
  uint64 created_by_user_id = 3;
  OrderStatus status = 4;
}

message OrderRefMapItem {
  // Keyed by order id. A ref two shops share, or a cancelled order re-recorded, carries several.
  map<uint64, OrderRefItem> map_data = 1;
}

message OrderByExternalRefsResponseItem {
  oneof d {
    OrderRefMapItem order_ref = 1;
  }
}

message OrderByExternalRefsResponseList {
  repeated OrderByExternalRefsResponseItem items = 1;
}

message OrderByExternalRefsResponse {
  // Keyed by ref. A ref no order of the team carries is ABSENT.
  map<string, OrderByExternalRefsResponseList> items = 1;
}

// ── Who typed the orders in (a-who-filter-lists-the-people-on-its-rows) ──────────────────────────
//
// What the list's "created by" filter offers: the people who typed in an order this team may list, and
// nobody else. Not the team's members — a person who has left still typed last year's orders in, and a
// member who has never placed one is no answer to "whose orders are these". Every id is already on a row
// the caller can see. Former members and suspended accounts are kept
// (a-filter-keeps-former-and-suspended-people).

enum OrderCreatorListDataType {
  ORDER_CREATOR_LIST_DATA_TYPE_UNSPECIFIED = 0;
  ORDER_CREATOR_LIST_DATA_TYPE_CREATOR = 1;
}

// OrderCreatorSort is the sort selection paired with the CREATOR slice.
enum OrderCreatorSort {
  ORDER_CREATOR_SORT_UNSPECIFIED = 0;
  // When they last typed one in — the default, newest first, so the people working now lead.
  ORDER_CREATOR_SORT_LAST_AT = 1;
}

// Nothing narrows it yet: the picker offers everyone on the team's orders.
message OrderCreatorListFilter {}

message OrderCreatorListFilterSort {
  warehouse.common.v1.CommonSortType sort_type = 1;
  oneof s {
    OrderCreatorSort creator = 2;
  }
}

message OrderCreatorListRequest {
  // Whoever may read the list may filter it (whoever-reads-a-list-may-filter-it): exactly OrderList's roles.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];
  OrderCreatorListFilter filter = 2;
  OrderCreatorListFilterSort sort = 3;
  repeated OrderCreatorListDataType data_request = 4;
  // It grows with staff turnover, slowly but without a ceiling, so it pages; the picker asks for a large
  // first page and filters in the field.
  warehouse.common.v1.CommonPagination page = 5 [(buf.validate.field).required = true];
}

// One person, and when they last typed in an order this team may list. Their name is user_service's — the
// picker resolves it with UserByIDs.
message OrderCreatorItem {
  uint64 user_id = 1;
  int64 last_at_unix = 2;
}

message OrderCreatorMapItem {
  // Keyed by user id.
  map<uint64, OrderCreatorItem> map_data = 1;
}

message OrderCreatorListResponseItem {
  oneof d {
    OrderCreatorMapItem creator = 1;
  }
}

message OrderCreatorListResponse {
  repeated OrderCreatorListResponseItem items = 1;
  // User ids, in the sort's order.
  repeated uint64 ids = 2;
  warehouse.common.v1.PageInfo page_info = 3;
}
