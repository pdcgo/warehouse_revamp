option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/selling/v1;sellingv1";

// THE ORDER METRICS (docs/business/order/order_statistic_metric.md) — five, each counting WHOLE ORDERS on the day of its
// own move (a-fact-counts-on-the-day-it-happened) — and WAREHOUSE FEE, the fee frozen on those orders, net of cancels
// (the-warehouse-fee-prototype-is-accepted). All six are served through the analytic pattern
// (docs/business/analytic/rpc_provide.md): `MetricSearch` ranks the keys, `MetricData` fills them.
//
// ⚠ EVERY NUMBER IS READ FROM A FOLDED TABLE — `order_daily_reports`, built by selling_service's own webhook from
// `OrderPlaced`, `OrderCancelled` and `OrderStatusChanged` (a-report-is-fed-by-events-only-for-now). A figure lags its
// move by the broker's delivery time.
//
// WHO READS WHAT (a-warehouse-reads-the-orders-it-ships): `team_id` is the caller's scope. A selling team reads its own
// orders, a warehouse the orders it ships, the root team every order. ⚠ A WAREHOUSE GETS COUNTS ONLY
// (a-warehouse-sees-no-seller-money): every money field of the five order metrics is `optional` and left UNSET for it —
// never 0 — and a sort on one is refused. Warehouse Fee's `amount` is the one exception: the warehouse's own income, set
// for it (a-warehouse-sees-its-own-fee-amount). The service decides from the scope's team type; the screen only drops a
// column that came back unset.
service OrderAnalyticService {
  // The keys of a page of the table, ranked by one field of one order metric.
  rpc MetricSearch(MetricSearchRequest) returns (MetricSearchResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The figures of the keys a search returned — or, grouped by SUMMARY, the headline.
  rpc MetricData(MetricDataRequest) returns (MetricDataResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Every metric here has the same shape (the-four-group-by-team-shop-warehouse-user-and-time):
//
//   one row per     a whole order — no product filter or group (product-is-its-own-line-metric)
//   the total       the order's frozen `total_cost` (a-total-is-the-total-cost)
//   the mp total    the order's `platform_total`, what the buyer paid on the storefront
//   TEAM            the seller, `orders.team_id` · WAREHOUSE the warehouse, `orders.warehouse_id`
//                   (the-team-group-is-the-seller)
//   USER            the order's creator, `created_by_user_id` (a-metrics-user-is-the-orders-creator)
//
// The field names are the owner's, from the doc's §Metric That Must Exists.

// ORDER CREATED — each order counted on its `created_at`.
message OrderCreatedMetric {
  option (warehouse.analytic_base.v1.metric) = {
    metric_id: "metrics/orders/created"
    supported_filters: [
      FILTER_TYPE_DATE_RANGE,
      FILTER_TYPE_TEAM,
      FILTER_TYPE_SHOP,
      FILTER_TYPE_WAREHOUSE,
      FILTER_TYPE_USER
    ]
    required_filters: [FILTER_TYPE_DATE_RANGE]
    supported_group_by: [
      GROUP_TYPE_SUMMARY,
      GROUP_TYPE_DAILY,
      GROUP_TYPE_WEEKLY,
      GROUP_TYPE_MONTHLY,
      GROUP_TYPE_YEARLY,
      GROUP_TYPE_TEAM,
      GROUP_TYPE_SHOP,
      GROUP_TYPE_WAREHOUSE,
      GROUP_TYPE_USER
    ]
  };

  // Orders.
  int64 created_count = 1 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_QTY
  ];
  // Σ their `total_cost`. Unset for a warehouse.
  optional double created_total = 2 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
  // Σ their `platform_total`. Unset for a warehouse.
  optional int64 mp_total = 3 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
}

// A page of keys' figures — keyed by team, shop, warehouse or user id. An asked id with nothing in the window is zero.
message OrderCreatedMetricByID {
  map<uint64, OrderCreatedMetric> items = 1;
}

// A page of periods' figures — keyed by the period's first day, YYYY-MM-DD. A quiet period is zero.
message OrderCreatedMetricByDay {
  map<string, OrderCreatedMetric> items = 1;
}

