message MetricSearchRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // Every member of the scoped team reads every metric of it (every-member-reads-every-metric-of-their-team).
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // Never SUMMARY — a headline is not searched.
  warehouse.analytic_base.v1.GroupType group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0, 1]
  }];

  // At most one of each FilterType.
  repeated warehouse.analytic_base.v1.FilterItem filters = 3 [(buf.validate.field).repeated.max_items = 5];

  // Names ONE of this service's metrics and one of its fields. An order metric's money field is refused for a warehouse
  // (Warehouse Fee's `amount` is not — a-warehouse-sees-its-own-fee-amount).
  warehouse.analytic_base.v1.MetricSort sort = 4 [(buf.validate.field).required = true];

  warehouse.analytic_base.v1.PaginationFilter page = 5 [(buf.validate.field).required = true];
}

message MetricSearchResponse {
  // Ranked; the key DESC breaks a tie (the-key-breaks-every-tie). Only keys with figures in the window.
  warehouse.analytic_base.v1.MetricKeys keys = 1;
  // Read as limit + 1 — no total (a-page-says-whether-another-follows).
  bool has_next = 2;
}

message MetricDataRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS,
      ROLE_WAREHOUSE_OWNER,
      ROLE_WAREHOUSE_ADMIN,
      ROLE_WAREHOUSE_STAFF
    ]
  };

  // Every member of the scoped team reads every metric of it (every-member-reads-every-metric-of-their-team).
  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  warehouse.analytic_base.v1.GroupType group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The same as the search's — they scope the numbers, never the keys (the-fill-step-scopes-its-numbers-by-the-filters).
  repeated warehouse.analytic_base.v1.FilterItem filters = 3 [(buf.validate.field).repeated.max_items = 5];

  // IDs for TEAM, SHOP, WAREHOUSE and USER, days for a period; none for SUMMARY. At most a page.
  warehouse.analytic_base.v1.MetricKeys keys = 4;

  // Any of the six, in any order; the answer keeps it.
  repeated string metric_ids = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 6
    unique: true
  }];
}

// One per asked metric, in the asked order (one-call-answers-every-asked-metric): the case says which metric and how
// it is keyed.
message MetricData {
  oneof m {
    OrderCreatedMetricByID created_by_id = 1;
    OrderCreatedMetricByDay created_by_day = 2;
    OrderCreatedMetric created_summary = 3;
    OrderCancelMetricByID cancel_by_id = 4;
    OrderCancelMetricByDay cancel_by_day = 5;
    OrderCancelMetric cancel_summary = 6;
    OrderReturnCreatedMetricByID return_created_by_id = 7;
    OrderReturnCreatedMetricByDay return_created_by_day = 8;
    OrderReturnCreatedMetric return_created_summary = 9;
    OrderReturnArrivedMetricByID return_arrived_by_id = 10;
    OrderReturnArrivedMetricByDay return_arrived_by_day = 11;
    OrderReturnArrivedMetric return_arrived_summary = 12;
    OrderLostCreatedMetricByID lost_created_by_id = 13;
    OrderLostCreatedMetricByDay lost_created_by_day = 14;
    OrderLostCreatedMetric lost_created_summary = 15;
    WarehouseFeeMetricByID warehouse_fee_by_id = 16;
    WarehouseFeeMetricByDay warehouse_fee_by_day = 17;
    WarehouseFeeMetric warehouse_fee_summary = 18;
  }
}

message MetricDataResponse {
  repeated MetricData metric_datas = 1;
  // AS OF WHEN (a-money-metric-says-as-of-when): the moment this service last folded an event — the newest claim in
  // `order_event_logs`, unix seconds. Every figure above includes what was folded up to then; a figure is a projection, seconds
  // behind its source normally and longer while a retry or a replay holds an event back. One time for the service, so
  // every metric it serves shares it. 0 = nothing folded yet.
  //
  // ⚠ It cannot tell a quiet day from a stuck fold — both stop it moving; that is the operator's, through the
  // dead-letter topic and the lease's log.
  int64 as_of_unix = 2;
}
