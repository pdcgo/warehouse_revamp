syntax = "proto3";

// warehouse.events.v1 is the ONE event contract for the whole system.
//
// Every event is a variant of the single Event envelope, and every variant names its own Pub/Sub
// topic on itself, so a publisher never names one. The design is
// docs/technical/event_architecture/context.md — the decisions behind each choice below live in
// context_decision.md beside it, and are named in the comments.
package warehouse.events.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/events/v1;eventsv1";

// EventConfig declares, ON THE VARIANT ITSELF, which Pub/Sub topic that event belongs to. The topic
// therefore travels with the message: a publisher cannot send an event to the wrong topic, because
// it never names one.
//
// The field is topic, singular — one variant, one topic (one-event-one-topic-per-variant,
// the-option-field-is-topic). A variant with no topic is an error at publish time, not a default.
message EventConfig {
  string topic = 1;
}

extend google.protobuf.MessageOptions {
  // 50001 — the number warehouse.event_base.v1 held before it was removed
  // (event-base-v1-is-removed). Reused rather than retired: nothing was ever published under the old
  // option, and 50001 is the number CLAUDE.md's options table already documents.
  EventConfig event_config = 50001;
}

// Event is the envelope every message on every topic carries.
//
// WARNING: THE WIRE IDENTITY OF EVERY FIELD BELOW IS ITS NAME, NOT ITS NUMBER. Events are encoded as
// protojson (events-are-encoded-with-protojson), so renaming a field — and above all renaming a
// oneof arm — orphans every message already published. buf breaking in CI is what catches that
// (ci-runs-on-dev-and-checks-breaking).
message Event {
  // The LOGICAL id, and every consumer's dedup key. DERIVED from the row that caused the event —
  // "settlement-log:8241" — never a fresh UUID, or a redelivery and a replay stop colliding and the
  // same fact is folded twice (typed-fields-for-what-the-library-reads).
  string event_id = 1 [(buf.validate.field).string.min_len = 1];

  // When the fact HAPPENED, from one authoritative clock — not the publish time, not the retry time.
  // Consumers bucket by it, so two clocks for one fact would file a boundary row in different days
  // depending on who read it.
  google.protobuf.Timestamp occurred_at = 2 [(buf.validate.field).required = true];

  // "shop:5" — the default ordering key. No ordering key is set today
  // (ordering-is-each-services-job): the field stays required and unread for now, so turning ordering
  // on later needs no migration of stored events.
  string aggregate_id = 3 [(buf.validate.field).string.min_len = 1];

  // Whatever else the producer wants to carry.
  //
  // WARNING: THIS MAP IS COPIED VERBATIM INTO THE PUB/SUB MESSAGE ATTRIBUTES
  // (event-metadata-is-copied-into-the-attributes), and attributes are capped where a proto map is
  // not. The rules below ARE Pub/Sub's own limits, so they can never reject a message the broker
  // would have accepted — they only move the failure from a nameless broker rejection to a
  // validation error that names the field.
  //
  // The library also writes into this map (event_type, the trace context), so the caller and the
  // library share one key namespace: a producer must not set a key the library sets.
  map<string, string> metadata = 4 [(buf.validate.field).map = {
    max_pairs: 100,
    keys: {string: {max_bytes: 256}},
    values: {string: {max_bytes: 1024}}
  }];

  // WHO CAUSED IT. Supplied by the caller as a parameter to the sender and copied on here
  // (identity-is-a-sender-parameter) — never filled at a call site by hand.
  //
  // WARNING: A RECORD, NEVER A CREDENTIAL (identity-is-a-record-never-a-credential). Push routes are
  // open, so anyone who can reach one can POST any identity: no consumer authorises from this field,
  // and passing it to san_auth.WithIdentity is forbidden. The token's expired_at is cleared by the
  // sender — it is a token's expiry, and this event outlives the token.
  warehouse.role_base.v1.Identity identity = 5;

  // 6–99 stay free for envelope growth.

  // The variant. Exactly one is set, and which one decides the topic.
  oneof message {
    // An Event with no variant set has no topic, no meaning and nothing to dispatch on
    // (the-event-oneof-is-required). Under protojson with DiscardUnknown, an arm a consumer has not
    // regenerated decodes to an UNSET oneof — without this rule that arrives as a valid Event with
    // no body and is silently ACKed. With it the library records the rejection and ACKs, leaving a
    // row a human can read.
    option (buf.validate.oneof).required = true;

    // Variants are numbered in a block per context: selling 200–299, settlement 300–399.
    OrderPlaced order_placed = 200;
    OrderCancelled order_cancelled = 201;
  }
}

// OrderPlaced announces that an order was placed and COMMITTED (#153).
//
// Published by selling_service after the order's transaction commits. An EVENT rather than a direct
// call because everything downstream of an order is DOWNSTREAM: recording what an order was expected
// to make must never be able to fail the order itself. A shop keeps selling while its consumers are
// down.
//
// IT CARRIES THE MONEY, not just an order id, and that is a correctness choice rather than a
// convenience. The figures were FROZEN onto the order when it was placed (#74), so shipping them here
// makes the event a snapshot of what was expected AT THE TIME. A thin event naming only an order
// would make a consumer read the order back later and record whatever it said then — so an edit
// between publish and consume would silently rewrite history, and a REPLAY would fold current state
// instead of the historical fact.
message OrderPlaced {
  option (event_config).topic = "order-placed";

  // The SELLING team that placed it, and the order.
  uint64 team_id = 1;
  uint64 order_id = 2;

  // The frozen money, whole rupiah. revenue is the order's total — what the buyer paid.
  int64 revenue = 3;
  int64 cogs = 4;
  int64 shipping_cost = 5;

  // Whether the goods' cost was actually KNOWN (#74). 0 cogs is ambiguous on its own — it means
  // "free" and "never recorded" equally — so the distinction travels as its own field rather than
  // being guessed at by the consumer. A margin computed over an unknown cost reads as pure profit,
  // and the consumer has to be able to say so.
  bool cost_known = 6;

  // WHICH WAREHOUSE fulfilled it (#186). liability_service charges the order fee to this team — the
  // order cannot say who to bill without it.
  uint64 warehouse_id = 7;

  // The lines, for liability's PRODUCT FEE (#186): an order selling another team's product owes that
  // team money.
  //
  // Carried on the event rather than read back, which is the same choice the money above already
  // makes and for the same reason: these are FROZEN AT ORDER TIME. A product moved to another team
  // next month must not rewrite who was owed for a sale that happened today.
  repeated OrderPlacedLine lines = 8;

  // WHO PLACED THE ORDER (every-entry-names-who-posted-it).
  //
  // NOT the envelope's identity, and the two genuinely differ. This is the ORDER's actor, read from
  // the stored row, so a backfill six hours later still names the person who placed it. The
  // envelope's identity says who caused THAT PUBLISH — the operator running the backfill. A consumer
  // folding the fact reads this one.
  uint64 actor_id = 9;
}

// One line of a placed order, as liability_service needs it (#186).
//
// Deliberately not the whole OrderItem: an event carries what its consumers need, and sku, name and
// the buyer-paid price are none of liability_service's business. What it needs is who owns the goods
// and what they cost.
message OrderPlacedLine {
  uint64 product_id = 1;

  // The team that OWNS this product, resolved from the catalogue when the order was placed. 0 when it
  // could not be resolved — a product deleted between the pick and the publish — which
  // liability_service treats as "nobody to pay" rather than guessing.
  uint64 owning_team_id = 2;

  uint32 quantity = 3;

  // What the goods COST, per unit, frozen at order time (#74) — and the anchor the product fee is a
  // markup OVER. Server-set and ignored on input, which means that anti-tampering protection guards
  // the product fee for free.
  //
  // 0 means UNKNOWN, not free. Under cost+markup that computes a fee of zero, so the owning team is
  // silently owed nothing for goods that really left its stock. The decision is to let that stand and
  // have the reconciliation report name it (#187), rather than refuse a real sale over a bookkeeping
  // gap.
  int64 unit_cost = 4;
}

// OrderCancelled announces that an order was cancelled (#164).
//
// Published by selling_service after the cancel commits. A consumer that saw placements but not
// cancellations would overstate from its first day.
//
// It carries only the ids. Unlike OrderPlaced, which ships the frozen money because the money IS the
// record, there is nothing to snapshot here: "this order stopped counting" is the whole message, and
// the figures being voided are already on the row.
message OrderCancelled {
  option (event_config).topic = "order-cancelled";

  uint64 team_id = 1;
  uint64 order_id = 2;

  // WHO CANCELLED IT (every-entry-names-who-posted-it). The reversal this event causes is a real
  // ledger movement, and it is a different person's act from the placement it undoes — so it carries
  // its own actor rather than reusing the one on the entries being reversed.
  uint64 actor_id = 3;
}
