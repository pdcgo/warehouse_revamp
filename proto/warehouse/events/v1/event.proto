syntax = "proto3";

// warehouse.events.v1 is the ONE event contract for the whole system.
//
// Every event is a variant of the single Event envelope, and every variant names its own Pub/Sub
// topic on itself, so a publisher never names one. The design is
// docs/technical/event_architecture/context.md — the decisions behind each choice below live in
// context_decision.md beside it, and are named in the comments.
package warehouse.events.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";
import "warehouse/role_base/v1/role.proto";
import "warehouse/settlement/v1/settlement.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/events/v1;eventsv1";

// EventConfig declares, ON THE VARIANT ITSELF, which Pub/Sub topic that event belongs to. The topic
// therefore travels with the message: a publisher cannot send an event to the wrong topic, because
// it never names one.
//
// The field is topic, singular — one variant, one topic (one-event-one-topic-per-variant,
// the-option-field-is-topic). A variant with no topic is an error at publish time, not a default.
message EventConfig {
  string topic = 1;
}

extend google.protobuf.MessageOptions {
  // 50001 — the number warehouse.event_base.v1 held before it was removed
  // (event-base-v1-is-removed). Reused rather than retired: nothing was ever published under the old
  // option, and 50001 is the number CLAUDE.md's options table already documents.
  EventConfig event_config = 50001;
}

// Event is the envelope every message on every topic carries.
//
// WARNING: THE WIRE IDENTITY OF EVERY FIELD BELOW IS ITS NAME, NOT ITS NUMBER. Events are encoded as
// protojson (events-are-encoded-with-protojson), so renaming a field — and above all renaming a
// oneof arm — orphans every message already published. buf breaking in CI is what catches that
// (ci-runs-on-dev-and-checks-breaking).
message Event {
  // The LOGICAL id, and every consumer's dedup key. DERIVED from the row that caused the event —
  // "settlement-log:8241" — never a fresh UUID, or a redelivery and a replay stop colliding and the
  // same fact is folded twice (typed-fields-for-what-the-library-reads).
  string event_id = 1 [(buf.validate.field).string.min_len = 1];

  // When the fact HAPPENED, from one authoritative clock — not the publish time, not the retry time.
  // Consumers bucket by it, so two clocks for one fact would file a boundary row in different days
  // depending on who read it.
  google.protobuf.Timestamp occurred_at = 2 [(buf.validate.field).required = true];

  // "shop:5" — the default ordering key. No ordering key is set today
  // (ordering-is-each-services-job): the field stays required and unread for now, so turning ordering
  // on later needs no migration of stored events.
  string aggregate_id = 3 [(buf.validate.field).string.min_len = 1];

  // Whatever else the producer wants to carry.
  //
  // WARNING: THIS MAP IS COPIED VERBATIM INTO THE PUB/SUB MESSAGE ATTRIBUTES
  // (event-metadata-is-copied-into-the-attributes), and attributes are capped where a proto map is
  // not. The rules below ARE Pub/Sub's own limits, so they can never reject a message the broker
  // would have accepted — they only move the failure from a nameless broker rejection to a
  // validation error that names the field.
  //
  // The library also writes into this map (event_type, the trace context), so the caller and the
  // library share one key namespace: a producer must not set a key the library sets.
  map<string, string> metadata = 4 [(buf.validate.field).map = {
    max_pairs: 100,
    keys: {string: {max_bytes: 256}},
    values: {string: {max_bytes: 1024}}
  }];

  // WHO CAUSED IT. Supplied by the caller as a parameter to the sender and copied on here
  // (identity-is-a-sender-parameter) — never filled at a call site by hand.
  //
  // WARNING: A RECORD, NEVER A CREDENTIAL (identity-is-a-record-never-a-credential). Push routes are
  // open, so anyone who can reach one can POST any identity: no consumer authorises from this field,
  // and passing it to san_auth.WithIdentity is forbidden. The token's expired_at is cleared by the
  // sender — it is a token's expiry, and this event outlives the token.
  warehouse.role_base.v1.Identity identity = 5;

  // 6–99 stay free for envelope growth.

  // The variant. Exactly one is set, and which one decides the topic.
  oneof message {
    // An Event with no variant set has no topic, no meaning and nothing to dispatch on
    // (the-event-oneof-is-required). Under protojson with DiscardUnknown, an arm a consumer has not
    // regenerated decodes to an UNSET oneof — without this rule that arrives as a valid Event with
    // no body and is silently ACKed. With it the library records the rejection and ACKs, leaving a
    // row a human can read.
    option (buf.validate.oneof).required = true;

    // Variants are numbered in a block per context: user 100–199, selling 200–299, settlement 300–399,
    // inventory 400–499, liability 500–599.
    MemberRemoved member_removed = 100;

    OrderPlaced order_placed = 200;
    OrderCancelled order_cancelled = 201;

    SettlementLogPosted settlement_log_posted = 300;

    RestockAccepted restock_accepted = 400;
    RestockCreated restock_created = 401;
    RestockCancelled restock_cancelled = 402;
    RestockUpdated restock_updated = 403;
    WarehouseTransferCreated warehouse_transfer_created = 404;
    WarehouseTransferUpdated warehouse_transfer_updated = 405;
    WarehouseTransferCancelled warehouse_transfer_cancelled = 406;
    WarehouseTransferAccepted warehouse_transfer_accepted = 407;

    LiabilityPaymentAccepted liability_payment_accepted = 500;
  }
}

// MemberRemoved announces that a person left ONE team (removing-a-member-drops-their-shop-access).
//
// Published by user_service after TeamUserUpdate's removal commits, one per membership-log row. The shop side drops
// the person's grants on that team's shops — a primary Customer Service flag is on a grant, so it goes with it. The
// person keeps their account and their other teams, so nothing else listens.
//
// It carries only ids: "this person is no longer in this team" is the whole fact. The envelope's occurred_at is when
// the removal happened — a consumer drops only what was granted BEFORE it, so a late redelivery never undoes a grant
// made after the person was added back.
message MemberRemoved {
  option (event_config).topic = "member-removed";

  uint64 team_id = 1;
  uint64 user_id = 2;

  // WHO REMOVED THEM — from the membership log row, a record (every-role-change-is-logged). 0 when it was a
  // developer through tools/san.
  uint64 actor_id = 3;
}

// SettlementLogPosted announces ONE immutable row of `settlement_logs` (docs/business/settlement/context.md
// §General Brief 2 — "Settlement Log … publish to the broker").
//
// Published by settlement_service after the posting's transaction commits. ONE variant for every
// settlement_type, because every settlement fact has one shape — a new row — and the fold runs the same
// statement for all of them; the type is a FIELD, so a ninth type is an enum value rather than a new
// variant and a new handler arm in every consumer.
//
// IT CARRIES THE WHOLE ROW, not an id. `settlement_logs` is append-only, so the values cannot go stale —
// and the Financial Ledger is another service, which cannot read the row back at all (HARD RULE 3).
//
// event_id is "settlement-log:<log_id>", so a retried publish of the same row collides in every
// consumer's dedup instead of folding the movement twice.
message SettlementLogPosted {
  option (event_config).topic = "settlement-log-posted";

  // settlement_logs.id
  uint64 log_id = 1;
  // The caller's idempotency key, unique across the whole log.
  string unique_id = 2;

  // 0 = the row is SHOP-ADDRESSED and names no order (#an-entry-names-an-order-or-a-shop).
  uint64 order_id = 3;
  uint64 shop_id = 4;
  uint64 team_id = 5;
  // Who is answerable for the row (#actor-id-is-the-pic).
  uint64 actor_id = 6;

  // WHO CREATED THE ORDER — `order_settlements.created_by_user_id`, 0 on a shop-addressed row or an
  // account opened without one. The per-user report attributes an order row to this person and a shop
  // row to `actor_id` (#a-shop-addressed-row-is-attributed-to-its-actor).
  uint64 order_created_by_user_id = 7;

  warehouse.settlement.v1.SettlementType settlement_type = 8;
  warehouse.settlement.v1.SourceType source_type = 9;

  // Signed, whole rupiah. POSITIVE IS MONEY TOWARD US.
  int64 change = 10;
  // The account's position after this row. Audit only — no report folds it.
  int64 balance = 11;

  // YYYY-MM-DD. The day the report BUCKETS on (#posted-on-buckets-the-report) — a string, so no
  // consumer re-derives a day from an instant in some other timezone.
  string posted_on = 12;
  // YYYY-MM-DD. The day the money belongs to — carried, never bucketed.
  string occurred_on = 13;

  uint64 reverses_id = 14;
  string note = 15;

  // WHO THE PER-USER REPORT COUNTS A SHOP ROW FOR — the shop's primary CS on an IMPORTED shop row, written
  // on the row by settlement (#settlement-asks-the-shop-for-its-primary-cs). 0 = the row's actor counts it.
  // Carried, never re-asked: a replay folds the person the row was written with.
  uint64 user_id = 16;
}

// OrderPlaced announces that an order was placed and COMMITTED (#153).
//
// Published by selling_service after the order's transaction commits. An EVENT rather than a direct
// call because everything downstream of an order is DOWNSTREAM: recording what an order was expected
// to make must never be able to fail the order itself. A shop keeps selling while its consumers are
// down.
//
// IT CARRIES THE MONEY, not just an order id, and that is a correctness choice rather than a
// convenience. The figures were FROZEN onto the order when it was placed (#74), so shipping them here
// makes the event a snapshot of what was expected AT THE TIME. A thin event naming only an order
// would make a consumer read the order back later and record whatever it said then — so an edit
// between publish and consume would silently rewrite history, and a REPLAY would fold current state
// instead of the historical fact.
message OrderPlaced {
  option (event_config).topic = "order-placed";

  // The SELLING team that placed it, and the order.
  uint64 team_id = 1;
  uint64 order_id = 2;

  // 3 was `revenue` (the order's `total`) and 5 `shipping_cost` — both dropped with the order's columns (selling 00027,
  // an-order-records-no-shipping-cost). Neither had a consumer: what the buyer paid is `platform_total` below.
  reserved 3, 5;
  reserved "revenue", "shipping_cost";

  // The order's frozen `goods_cost`, whole rupiah — Σ its lines' `total`, borrowed lines with their markup
  // (the-cross-charge-lives-on-the-line). Renamed from `cogs`, same number.
  int64 goods_cost = 4;

  // Whether the goods' cost was actually KNOWN (#74). A goods_cost of 0 is ambiguous on its own — it means
  // "free" and "never recorded" equally — so the distinction travels as its own field rather than
  // being guessed at by the consumer. A margin computed over an unknown cost reads as pure profit,
  // and the consumer has to be able to say so.
  bool cost_known = 6;

  // WHICH WAREHOUSE fulfilled it (#186). liability_service charges the order fee to this team — the
  // order cannot say who to bill without it.
  uint64 warehouse_id = 7;

  // The lines, for liability's PRODUCT FEE (#186): an order selling another team's product owes that
  // team money.
  //
  // Carried on the event rather than read back, which is the same choice the money above already
  // makes and for the same reason: these are FROZEN AT ORDER TIME. A product moved to another team
  // next month must not rewrite who was owed for a sale that happened today.
  repeated OrderPlacedLine lines = 8;

  // WHO PLACED THE ORDER (every-entry-names-who-posted-it).
  //
  // NOT the envelope's identity, and the two genuinely differ. This is the ORDER's actor, read from
  // the stored row, so a backfill six hours later still names the person who placed it. The
  // envelope's identity says who caused THAT PUBLISH — the operator running the backfill. A consumer
  // folding the fact reads this one.
  uint64 actor_id = 9;

  // The shop it was sold on, and what the PLATFORM says the buyer paid, whole rupiah — 0 = not recorded.
  // settlement_service opens the order's account from these (settlement-opens-the-sale-from-the-order-event):
  // its `initial_total` is the platform total with the sign flipped, on the shop's account. The order never
  // calls settlement, so the event has to carry everything the account needs.
  uint64 shop_id = 10;
  // The order's `platform_total` (the-total-is-ours-the-platform-total-is-theirs) — renamed from
  // `marketplace_total`, same number.
  int64 platform_total = 11;
}

// One line of a placed order, as liability_service needs it (#186).
//
// Deliberately not the whole OrderItem: an event carries what its consumers need, and sku, name and
// the buyer-paid price are none of liability_service's business. What it needs is who owns the goods
// and what the line came to.
message OrderPlacedLine {
  uint64 product_id = 1;

  // The team that OWNS this product, resolved from the catalogue when the order was placed. 0 when it
  // could not be resolved — a product deleted between the pick and the publish — which
  // liability_service treats as "nobody to pay" rather than guessing.
  uint64 owning_team_id = 2;

  uint32 quantity = 3;

  // What the goods COST, per unit, frozen at order time (#74) — the units the take drew ÷ the quantity
  // (an-order-is-costed-at-what-leaves-the-shelf), before any markup. 0 means UNKNOWN, not free.
  //
  // ⚠ NOT WHAT THE PRODUCT FEE IS COMPUTED FROM any more — that is `total` below
  // (the-ledger-charges-the-frozen-line-total).
  int64 unit_cost = 4;

  // THE LINE'S FROZEN TOTAL, rupiah (rupiah-is-floating-point) — what inventory's take priced it at: the goods it drew
  // plus, on another team's product, that product's own cross markup (inventory-computes-the-markup). Frozen on
  // `order_items.total` in the order's transaction and copied here as stored, never recomputed.
  //
  // liability_service posts it AS IT IS: the product fee owed to each owning team is Σ that team's line totals
  // (the-product-fee-is-the-line-total) — it reads no markup of its own.
  //
  // 0 means NOT KNOWN — a line whose take valued nothing, or an order placed before lines froze a total — and is
  // charged nothing rather than guessed at, which the reconciliation report (#187) is built to find.
  double total = 5;
}

// OrderCancelled announces that an order was cancelled (#164).
//
// Published by selling_service after the cancel commits. A consumer that saw placements but not
// cancellations would overstate from its first day.
//
// It carries only the ids. Unlike OrderPlaced, which ships the frozen money because the money IS the
// record, there is nothing to snapshot here: "this order stopped counting" is the whole message, and
// the figures being voided are already on the row.
message OrderCancelled {
  option (event_config).topic = "order-cancelled";

  uint64 team_id = 1;
  uint64 order_id = 2;

  // WHO CANCELLED IT (every-entry-names-who-posted-it). The reversal this event causes is a real
  // ledger movement, and it is a different person's act from the placement it undoes — so it carries
  // its own actor rather than reusing the one on the entries being reversed.
  uint64 actor_id = 3;

  // The shop it was sold on — settlement cancels the sale on that shop's account
  // (settlement-opens-the-sale-from-the-order-event).
  uint64 shop_id = 4;
}

// RestockAccepted announces that a warehouse COUNTED AND ACCEPTED a restock, and the accept COMMITTED.
//
// Published by inventory_service after RestockRequestFulfill's transaction commits. supplier_service folds it into a
// supplier's figures (the-report-is-processed-like-settlement) — a consumer downstream of the accept, which must never
// be able to fail it.
//
// IT CARRIES THE COUNTS AND THE PRICE, not just an id (each-figure-is-read-at-the-accept): every figure is what the
// accept knew, and a REPLAY must fold the historical fact, never the restock as it reads later.
//
// ⚠ `event_id` is `restock-accepted:<restock_id>` — a restock is accepted once, so a republish, a replay and the
// backfill (past-accepts-are-backfilled-once) all collide in the fold's dedup.
message RestockAccepted {
  option (event_config).topic = "restock-accepted";

  uint64 restock_id = 1;
  // The SELLING team that bought — the figures' `team_id` (the-report-is-keyed-by-team-not-by-store).
  uint64 team_id = 2;
  // The warehouse team that counted it.
  uint64 warehouse_id = 3;

  // The RESTOCK's supplier, 0 = none — every line counts for it until restock lines name a store
  // (the-supplier-comes-from-the-restock-until-lines-name-a-store). With 0 there is nothing to fold.
  uint64 supplier_id = 4;

  // YYYY-MM-DD — the accept's JAKARTA day, the day the figures bucket on. A string, so no consumer re-derives a day
  // from an instant in some other timezone.
  string accepted_on = 5;

  repeated RestockAcceptedLine lines = 6;

  // The accept's instant, unix seconds (restock-accepted-carries-every-line) — the day above is derived from it.
  int64 accepted_at_unix = 7;

  // The courier's charge at the door, ONE per restock, and its note; 0 = none. Balance posts the selling team's debt to
  // the warehouse from it, after the accept commits (balance-posts-the-couriers-debt-from-the-event) — the accept itself
  // no longer writes balance. Money is `double`, as inventory stores it (money-is-double-in-the-api-too).
  double warehouse_additional_cost = 8;
  string warehouse_additional_cost_note = 9;
  // Who counted the box in — the debt's actor (every-entry-names-who-posted-it). Read from the stored restock, never
  // from the envelope's identity.
  uint64 actor_id = 10;
}

// One line as the accept counted it. Lost and broken sit BESIDE accepted, never inside it, so
// ordered ≈ accepted + lost + broken (each-figure-is-read-at-the-accept).
message RestockAcceptedLine {
  // restock_items.id
  uint64 item_id = 1;
  // The restocking team's product.
  uint64 product_id = 2;

  // Units ordered on the line, and the line's total as typed — what the supplier charged. A figure's value is
  // units × total ÷ ordered, so the line's three values add back to its total without a rounded unit price. The
  // total is `double`, as inventory stores it (money-is-double-in-the-api-too).
  int64 ordered_count = 3;
  double total_price = 4;

  // Units accepted as good stock — the batch's sellable count.
  int64 accepted_count = 5;
  // Units that arrived broken.
  int64 broken_count = 6;
  // Units short in the box — the MISSING problem row (a-short-unit-at-the-door-is-missing). Renamed in place from
  // lost_count.
  int64 missing_count = 7;

  // The line's own supplier and store (a-line-names-the-channel-it-was-bought-from); 0 = not named. Until restock lines
  // store them, the restock-level supplier_id above is what a fold reads.
  uint64 supplier_id = 8;
  uint64 supplier_channel_id = 9;
}

// RestockCreated announces a restock was RAISED — the money left the paying account then
// (a-created-restock-tells-the-financial-account, a-restock-must-name-the-account-that-paid).
//
// Published by inventory_service after RestockRequestCreate commits; financial_account_service posts the payment.
// `event_id` is `restock-created:<restock_id>`.
message RestockCreated {
  option (event_config).topic = "restock-created";

  uint64 restock_id = 1;
  // The selling team that raised it.
  uint64 team_id = 2;
  uint64 warehouse_id = 3;
  // The operational account that paid.
  uint64 finance_account_id = 4;
  // Goods plus shipping — never the courier's charge, which the warehouse paid
  // (the-couriers-charge-stays-out-of-total). `double`, as inventory stores it (money-is-double-in-the-api-too).
  double amount = 5;
  uint64 actor_id = 6;
  int64 created_at_unix = 7;
}

// RestockCancelled announces an ONGOING restock was called off (a-restock-is-cancelled-only-while-ongoing).
//
// `money_returned` decides what the financial account does: yes posts a refund of `amount` into the account that
// paid, no posts nothing (a-restock-names-its-paying-account). `event_id` is `restock-cancelled:<restock_id>` — a
// restock is cancelled once.
message RestockCancelled {
  option (event_config).topic = "restock-cancelled";

  uint64 restock_id = 1;
  uint64 team_id = 2;
  uint64 finance_account_id = 3;
  double amount = 4;
  bool money_returned = 5;
  uint64 actor_id = 6;
  int64 cancelled_at_unix = 7;
}

// RestockUpdated announces an edit that changed WHAT WAS PAID, or FROM WHERE (an-edit-sends-the-difference,
// an-edit-may-move-the-payment-to-another-account). Not sent for an edit that changed nothing paid.
//
// Both sides are carried so a consumer never re-derives them: the same account means post new − old; a different
// account means the old one gets old_amount back and the new one pays new_amount. `event_id` is
// `restock-updated:<restock_id>:<restock_log_id>` — one per edit.
message RestockUpdated {
  option (event_config).topic = "restock-updated";

  uint64 restock_id = 1;
  uint64 team_id = 2;
  uint64 old_finance_account_id = 3;
  uint64 new_finance_account_id = 4;
  double old_amount = 5;
  double new_amount = 6;
  uint64 actor_id = 7;
  int64 updated_at_unix = 8;
}

// WarehouseTransferCreated announces a transfer OPENED, and the shipping expense typed with it — the selling team's,
// from its own account (the-shipping-expense-reaches-the-account-by-event, a-transfer-names-its-paying-account). The cost
// may still be 0 here and typed later; a listener posts nothing for 0.
//
// Published by inventory_service after WarehouseTransferCreate commits; financial_account_service posts the expense.
// `event_id` is `warehouse-transfer-created:<transfer_id>`.
//
// ⚠ Money is `double`, unlike the restock events beside it (stock-money-is-float64-compared-at-4-digits names the
// transfer's costs): a new event gets the decided type on day one, since changing a published field's type later is a
// wire break.
message WarehouseTransferCreated {
  option (event_config).topic = "warehouse-transfer-created";

  uint64 transfer_id = 1;
  // The selling team that owns the goods and pays the trip.
  uint64 team_id = 2;
  // A and B.
  uint64 from_warehouse_id = 3;
  uint64 to_warehouse_id = 4;
  // The account that paid; 0 when the cost is 0.
  uint64 finance_account_id = 5;
  // The shipping cost, rupiah. Never in a unit's price (a-transfer-never-changes-a-units-price).
  double amount = 6;
  uint64 actor_id = 7;
  int64 created_at_unix = 8;
}

// WarehouseTransferUpdated announces an edit that changed the shipping cost or the account that paid it — until the
// transfer is accepted (the-shipping-expense-reaches-the-account-by-event). Not sent for an edit that changed neither.
//
// Both sides are carried, as RestockUpdated: the same account means post new − old; a different account means the old
// one gets old_amount back and the new one pays new_amount. `event_id` is
// `warehouse-transfer-updated:<transfer_id>:<cost_revision>` — one per edit that moved money.
message WarehouseTransferUpdated {
  option (event_config).topic = "warehouse-transfer-updated";

  uint64 transfer_id = 1;
  uint64 team_id = 2;
  uint64 old_finance_account_id = 3;
  uint64 new_finance_account_id = 4;
  double old_amount = 5;
  double new_amount = 6;
  uint64 actor_id = 7;
  int64 updated_at_unix = 8;
}

// WarehouseTransferCancelled announces a transfer called off while created
// (cancel-before-processed-lost-only-in-transit) — whatever was posted for its shipping comes back to the account that
// paid. `event_id` is `warehouse-transfer-cancelled:<transfer_id>` — a transfer is cancelled once.
message WarehouseTransferCancelled {
  option (event_config).topic = "warehouse-transfer-cancelled";

  uint64 transfer_id = 1;
  uint64 team_id = 2;
  // The account that paid and the amount it gets back; 0 = nothing was posted.
  uint64 finance_account_id = 3;
  double amount = 4;
  uint64 actor_id = 5;
  int64 cancelled_at_unix = 6;
}

// WarehouseTransferAccepted announces B counted the box in, and the courier's charge B paid at its door
// (balance-posts-the-transfers-on-site-debt-from-the-event). Published after EVERY accept, a charge of 0 included; the
// selling team owes B the charge, and nothing for 0.
//
// `event_id` is `warehouse-transfer-accepted:<transfer_id>` — a transfer is accepted once. ⚠ Balance does not listen
// yet: the source type it posts under is open (balance context Q13) — never INCIDENTAL_FEE keyed by the transfer id,
// which collides with a restock's of the same number.
message WarehouseTransferAccepted {
  option (event_config).topic = "warehouse-transfer-accepted";

  uint64 transfer_id = 1;
  // The selling team — the debtor.
  uint64 team_id = 2;
  // A, and B — the warehouse that paid the courier, the creditor.
  uint64 from_warehouse_id = 3;
  uint64 to_warehouse_id = 4;
  // The courier's charge at B's door, rupiah, and its note (an-incidental-line-must-say-what-it-was-for); 0 = none.
  double warehouse_additional_cost = 5;
  string warehouse_additional_cost_note = 6;
  // Who counted it in — read from the stored transfer, never from the envelope's identity.
  uint64 actor_id = 7;
  int64 accepted_at_unix = 8;
}

// LiabilityPaymentAccepted announces that a CREDITOR accepted a team payment — they looked at their bank and the
// money was there (a-team-payment-posts-on-accept). Published by liability_service after LiabilityPaymentConfirm
// commits; the financial accounts post one `team_payment` row out of `from_account_id` and one into
// `to_account_id`, sharing a group.
//
// Recording and rejecting publish nothing: a claim moves no account. And there is no reverse to follow
// (an-accepted-payment-is-final). `event_id` is `liability-payment-accepted:<payment_id>` — a payment is accepted
// once. The envelope's `occurred_at` is when it was accepted, which is the day both rows count on.
message LiabilityPaymentAccepted {
  option (event_config).topic = "liability-payment-accepted";

  uint64 payment_id = 1;
  uint64 payer_team_id = 2;
  uint64 creditor_team_id = 3;
  // Whole rupiah, always positive — direction is the two accounts, never a sign.
  int64 amount = 4;
  // The payer's account. 0 on a payment recorded before *Paid from* existed: only the `to` leg posts.
  uint64 from_account_id = 5;
  // The creditor's account, named on accept. Never 0.
  uint64 to_account_id = 6;
  // Who accepted — the creditor's person, read from the payment row. The person who decided the money landed.
  uint64 actor_id = 7;
}
