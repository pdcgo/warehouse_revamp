syntax = "proto3";

package warehouse.supplier.v1;

import "buf/validate/validate.proto";
import "warehouse/analytic_base/v1/analytic.proto";
import "warehouse/role_base/v1/role.proto";

option go_package = "github.com/pdcgo/warehouse_revamp/backend/gen/warehouse/supplier/v1;supplierv1";

// A SUPPLIER'S FIGURES — what was restocked from it, and how much of that was lost or broken on the way
// (docs/business/supplier/context.md §How We provide Analitical Data of Suppliers). Read on the supplier details'
// Statistics tab and the Supplier Report page (the-figures-are-a-statistics-tab-and-a-supplier-report).
//
// Served through the analytic pattern (docs/business/analytic/rpc_provide.md): ONE metric, `metrics/suppliers`, read by
// `MetricSearch` (rank the keys) and `MetricData` (fill them) — the shape every service's figures share
// (the-pattern-replaces-the-shipped-analytics). It replaced four bespoke reads.
//
// ⚠ EVERY NUMBER HERE IS READ FROM A FOLDED TABLE — `supplier_product_daily_reports`, built by supplier_service's own
// webhook consuming `RestockAccepted` (the-report-is-processed-like-settlement). A figure can lag the accept by the
// broker's delivery time, and never by more than that.
//
// PENJUALAN (penjualan-is-the-selling-value-on-the-order-day) is folded beside them, into its OWN table
// `supplier_sale_daily_reports`, by the same service's webhook consuming `OrderPlaced` and `OrderCancelled` — the units
// the order's stock take drew from batches carrying the supplier (read from inventory through an in-process seam), at
// their share of what the order sold them for, on the order's Jakarta day; a cancel takes them back on its own day.
//
// ⚠ EVERY SELLING TEAM READS EVERY TEAM'S FIGURES (every-selling-team-sees-every-teams-figures). `team_id` is the
// CALLER's scope, as on every read; a TeamFilter narrows to whose restocks are counted.
service SupplierAnalyticService {
  // The keys of a page of the table, ranked by one field of `metrics/suppliers` — suppliers, products or periods.
  rpc MetricSearch(MetricSearchRequest) returns (MetricSearchResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The figures of the keys a search returned — or, grouped by SUMMARY, the headline.
  rpc MetricData(MetricDataRequest) returns (MetricDataResponse) {
    // A READ — an agent's credential and the admin team's monitor may call it (an-agent-only-reads-for-now,
    // the-admin-team-monitors-read-only).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // THE STATISTIK TAB AS A FILE (each-supplier-tab-exports-its-own-table, on one-export-is-the-list-as-a-file): the view
  // on screen — Per Periode (every period of the window at its grain, newest first, the quiet ones included) or Per
  // Produk (every product, ranked as the tab ranks them) — over the tab's own filters, every page, in the tab's columns,
  // as .xlsx. A server stream: progress, then an expiring link. Not a read: it stores a file, so a monitor and an agent
  // are refused (the-admin-team-monitors-read-only).
  rpc SupplierFigureExport(SupplierFigureExportRequest) returns (stream SupplierFigureExportResponse);
  // THE SUPPLIER REPORT AS A FILE (a-report-export-is-the-whole-view-as-a-file, on one-export-is-the-list-as-a-file): the
  // WHOLE ranking as narrowed — the report's own window, team and search, in its own order — every page, each supplier
  // with its figures in the report's columns, as .xlsx. A server stream: progress, then an expiring link. Not a read: it
  // stores a file, so a monitor and an agent are refused (the-admin-team-monitors-read-only).
  rpc SupplierReportExport(SupplierReportExportRequest) returns (stream SupplierReportExportResponse);
}

// The two operations a DEVELOPER runs on the fold — settlement's, read for the supplier
// (the-report-is-processed-like-settlement). Split from the reads because the policy is different and total.
service SupplierAnalyticMaintenanceService {
  // Rebuild the figures from `start_date` by seeking the fold's own subscription. Bounded by its retention.
  rpc AnalyticReplayCompute(AnalyticReplayComputeRequest) returns (AnalyticReplayComputeResponse);
  // Prune the dedup table, `supplier_event_logs`.
  rpc AnalyticMaintenanceRun(AnalyticMaintenanceRunRequest) returns (AnalyticMaintenanceRunResponse);
}

// THE SIX FIGURES (each-figure-is-read-at-the-accept) and the broken rate. All six are movements, so a period, a
// product or a supplier is a plain SUM. Lost and broken sit BESIDE restocked, never inside it. Values are whole
// rupiah, at the line's price.
//
// Groups: SUPPLIER and PRODUCT — the RESTOCKING team's product, so two teams buying one item are two keys
// (every-accepted-line-links-its-own-product) — and every period. Filters: the window (required); TEAM, whose
// restocks are counted (the-team-filter-picks-any-selling-team); SUPPLIER, one supplier; SUPPLIER_KEYWORD, the Supplier
// Report's search (the-supplier-report-keeps-its-search).
message SupplierMetric {
  option (warehouse.analytic_base.v1.metric) = {
    metric_id: "metrics/suppliers"
    supported_filters: [
      FILTER_TYPE_DATE_RANGE,
      FILTER_TYPE_TEAM,
      FILTER_TYPE_SUPPLIER,
      // The Supplier Report's search (the-supplier-report-keeps-its-search).
      FILTER_TYPE_SUPPLIER_KEYWORD
    ]
    required_filters: [FILTER_TYPE_DATE_RANGE]
    supported_group_by: [
      GROUP_TYPE_SUMMARY,
      GROUP_TYPE_DAILY,
      GROUP_TYPE_WEEKLY,
      GROUP_TYPE_MONTHLY,
      GROUP_TYPE_YEARLY,
      GROUP_TYPE_SUPPLIER,
      GROUP_TYPE_PRODUCT
    ]
  };

  // Units accepted as good stock.
  int64 restock_count = 1 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_QTY
  ];
  double restock_valuation = 2 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
  // Units short in an accepted parcel.
  int64 shipping_lost_count = 3 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_QTY
  ];
  double shipping_lost_valuation = 4 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
  // Units that arrived broken.
  int64 shipping_broken_count = 5 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_QTY
  ];
  double shipping_broken_valuation = 6 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];

  // broken ÷ (restocked + lost + broken), 0 to 1 — 0 when nothing arrived, so read the counts to tell no rate from a
  // rate of 0. Ranked only among keys with at least 50 units; the rest follow, in key order
  // (rate-ranking-needs-50-units, a-rate-ranks-only-above-its-minimum-sample).
  double broken_rate = 7 [
    (warehouse.analytic_base.v1.metric_sort) = {
      can_sort: true
      rank_min_sample: 50
    },
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_RATIO
  ];

  // PENJUALAN — units SOLD to a buyer from the supplier's goods (batches carrying its id), counted on the Jakarta day
  // the order was placed; a cancel takes them back on the cancel's day, so a day may read negative
  // (penjualan-is-the-selling-value-on-the-order-day). TEAM is the team that owns the goods — the restocking team.
  int64 sales_count = 8 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_QTY
  ];
  // Their SELLING value, rupiah, exact: each order line's share of the order's `platform_total` (by the line's frozen
  // total), spread over the line's units — the units from this supplier's batches at that price.
  double sales_value = 9 [
    (warehouse.analytic_base.v1.metric_sort) = {can_sort: true},
    (warehouse.analytic_base.v1.field_stat_type) = FIELD_STAT_TYPE_CURRENCY
  ];
}

// A page of keys' figures — keyed by supplier or product id. An asked id with nothing in the window is all zero.
message SupplierMetricByID {
  map<uint64, SupplierMetric> items = 1;
}

// A page of periods' figures — keyed by the period's first day, YYYY-MM-DD. An asked period that was quiet is all zero.
message SupplierMetricByDay {
  map<string, SupplierMetric> items = 1;
}

message MetricSearchRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // Never SUMMARY — a headline is not searched.
  warehouse.analytic_base.v1.GroupType group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0, 1]
  }];

  // At most one of each FilterType.
  repeated warehouse.analytic_base.v1.FilterItem filters = 3 [(buf.validate.field).repeated.max_items = 6];

  warehouse.analytic_base.v1.MetricSort sort = 4 [(buf.validate.field).required = true];

  warehouse.analytic_base.v1.PaginationFilter page = 5 [(buf.validate.field).required = true];
}

message MetricSearchResponse {
  // Ranked; the key DESC breaks a tie (the-key-breaks-every-tie). Only keys with figures in the window.
  warehouse.analytic_base.v1.MetricKeys keys = 1;
  // Read as limit + 1 — no total (a-page-says-whether-another-follows).
  bool has_next = 2;
}

message MetricDataRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  warehouse.analytic_base.v1.GroupType group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The same as the search's — they scope the numbers, never the keys (the-fill-step-scopes-its-numbers-by-the-filters).
  repeated warehouse.analytic_base.v1.FilterItem filters = 3 [(buf.validate.field).repeated.max_items = 6];

  // IDs for SUPPLIER and PRODUCT, days for a period; none for SUMMARY. At most a page.
  warehouse.analytic_base.v1.MetricKeys keys = 4;

  repeated string metric_ids = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
    unique: true
  }];
}

// One per asked metric (one-call-answers-every-asked-metric).
message MetricData {
  oneof m {
    SupplierMetricByID supplier_by_id = 1;
    SupplierMetricByDay supplier_by_day = 2;
    SupplierMetric supplier_summary = 3;
  }
}

message MetricDataResponse {
  repeated MetricData metric_datas = 1;
  // AS OF WHEN (a-money-metric-says-as-of-when): the moment this service last folded an event — the newest claim in
  // `supplier_event_logs`, unix seconds. Every figure above includes what was folded up to then; a figure is a projection, seconds
  // behind its source normally and longer while a retry or a replay holds an event back. One time for the service, so
  // every metric it serves shares it. 0 = nothing folded yet.
  //
  // ⚠ It cannot tell a quiet day from a stuck fold — both stop it moving; that is the operator's, through the
  // dead-letter topic and the lease's log.
  int64 as_of_unix = 2;
}

// THE STATISTIK TAB AS A FILE — the view's own read, every page (each-supplier-tab-exports-its-own-table).
message SupplierFigureExportRequest {
  // MetricData's readers.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // THE VIEW: DAILY, MONTHLY or YEARLY is Per Periode at that grain; PRODUCT is Per Produk. The Supplier Report's
  // ranking (SUPPLIER) is not offered here — its file is SupplierReportExport.
  warehouse.analytic_base.v1.GroupType group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    in: [2, 4, 5, 6]
  }];

  // The tab's own filters — the window (required), the supplier (required), and whose restocks when one team is picked.
  repeated warehouse.analytic_base.v1.FilterItem filters = 3 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 6
  }];
}

// One message of the stream (code-implementation-guideline.md): a log line, the progress, and — on the last message —
// the file.
message SupplierFigureExportResponse {
  // A sentence about the step.
  string message = 1;
  // Rows written so far, of the total the view holds.
  int64 done = 2;
  int64 total = 3;
  // Set on the LAST message only: the file's expiring link, and its name.
  string download_url = 4;
  string filename = 5;
}

// THE SUPPLIER REPORT AS A FILE — the ranking's own reads, every page (a-report-export-is-the-whole-view-as-a-file).
message SupplierReportExportRequest {
  // MetricSearch's readers — the ranking's.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR,
      ROLE_SELLING_OWNER,
      ROLE_SELLING_ADMIN,
      ROLE_SELLING_CS
    ]
  };

  uint64 team_id = 1 [
    (buf.validate.field).uint64.gt = 0,
    (warehouse.role_base.v1.use_scope) = true
  ];

  // The report's own filters — the window (required), whose restocks when one team is picked, and the search. Never a
  // supplier: a file of one supplier is its Statistik tab's (SupplierFigureExport).
  repeated warehouse.analytic_base.v1.FilterItem filters = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 3
  }];

  // The report's order — `metrics/suppliers` by restock_valuation or broken_rate, as its "Urutkan" picks; the server
  // ranks exactly as MetricSearch does (the rate's minimum sample included).
  warehouse.analytic_base.v1.MetricSort sort = 3 [(buf.validate.field).required = true];
}

// One message of the stream (code-implementation-guideline.md): a log line, the progress, and — on the last message —
// the file.
message SupplierReportExportResponse {
  // A sentence about the step.
  string message = 1;
  // Rows written so far, of the total the ranking holds.
  int64 done = 2;
  int64 total = 3;
  // Set on the LAST message only: the file's expiring link, and its name.
  string download_url = 4;
  string filename = 5;
}

// ── maintenance ─────────────────────────────────────────────────────────────────────────────────

message AnalyticReplayComputeRequest {
  // A developer's repair tool, and it DELETES figure rows before rebuilding them. Unscoped, so the policy is the root
  // team's.
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };

  // The first Jakarta day to rebuild, YYYY-MM-DD. Every figure row on or after it is deleted and rebuilt from what the
  // subscription redelivers.
  string start_date = 1 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
}

message AnalyticReplayComputeResponse {
  // ⚠ "started", NEVER "done" — a seek is asynchronous.
  string status = 1;
  int64 deleted_report_rows = 2;
  int64 deleted_event_logs = 3;
  // The earliest start_date the subscription could still serve, as YYYY-MM-DD.
  string earliest_start_date = 4;
}

message AnalyticMaintenanceRunRequest {
  option (warehouse.role_base.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMINISTRATOR
    ]
  };
}

message AnalyticMaintenanceRunResponse {
  // Dedup rows removed — those received before `cutoff`.
  int64 deleted_event_logs = 1;
  // The receive instant the prune cut at, RFC 3339.
  string cutoff = 2;
}
